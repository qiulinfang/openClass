<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link type="text/css" rel="stylesheet" href="jsmind.css" />
    <script type="text/javascript" src="jsmind.js"></script>
    <style>
        /* 添加自定义菜单样式 */
        .custom-menu {
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            border-radius: 4px;
            z-index: 1000;
            min-width: 90px; /* 确保菜单不会太窄 */
        }
        .custom-menu-item {
            padding: 8px 15px;
            cursor: pointer;
            font-size: 16px;
            color: #1d85ce;
            white-space: nowrap; /* 防止换行 */
            min-width: 80px; /* 确保菜单项足够宽 */
        }
        .custom-menu-item:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
<div id="jsmind_container" style="width: 1000px; height: 600px;"></div>
<script type="text/javascript">
    var graph = {
        "meta": { "name": "生物知识导图", "author": "imates", "version": "0.1" },
        "format": "node_tree",
        "data": {
            "id": "biology",
            "topic": "生物(必修二)",
            "background-color": "#0D3390",
            "direction": "left",
            "children": [
                {
                    "id": "chapter3",
                    "topic": "第3章基因的本质",
                    "background-color": "#3788f6",
                    "leading-line-color": "#1c217e",
                    "foreground-color": "#ffffff",
                    "direction": "left",
                    "children": [
                        {
                            "id": "section3.1",
                            "background-color": "#e4f8ff",
                            "leading-line-color": "#1f82f0",
                            "foreground-color": "#0b294a",
                            "topic": "3.1DNA是主要的遗传物质"
                        },
                        {
                            "id": "section3.2",
                            "background-color": "#e4f8ff",
                            "leading-line-color": "#1f82f0",
                            "foreground-color": "#0b294a",
                            "topic": "3.2DNA的结构"
                        },
                        {
                            "id": "section3.3",
                            "background-color": "#e4f8ff",
                            "leading-line-color": "#1f82f0",
                            "foreground-color": "#0b294a",
                            "topic": "3.3DNA的复制"
                        },
                        {
                            "id": "section3.4",
                            "background-color": "#e4f8ff",
                            "leading-line-color": "#1f82f0",
                            "foreground-color": "#0b294a",
                            "topic": "3.4基因通常是有遗传效应的DNA片段"
                        }

                    ]
                },
                {
                    "id": "chapter4",
                    "topic": "第4章基因的表达",
                    "background-color": "#3788f6",
                    "leading-line-color": "#1c217e",
                    "foreground-color": "#ffffff",
                    "direction": "left",
                    "children": [
                        {
                            "id": "section4.1",
                            "background-color": "#e4f8ff",
                            "leading-line-color": "#1f82f0",
                            "foreground-color": "#0b294a",
                            "topic": "4.1基因指导蛋白质的合成"
                        },
                        {
                            "id": "section4.2",
                            "background-color": "#e4f8ff",
                            "leading-line-color": "#1f82f0",
                            "foreground-color": "#0b294a",
                            "topic": "4.2基因表达与性状的关系"
                        }
                    ]
                },
                {
                    "id": "chapter5",
                    "topic": "第5章基因突变及其他变异",
                    "background-color": "#3788f6",
                    "leading-line-color": "#1c217e",
                    "foreground-color": "#ffffff",
                    "direction": "right",
                    "children": [
                        {
                            "id": "section5.1",
                            "background-color": "#e4f8ff",
                            "leading-line-color": "#1f82f0",
                            "foreground-color": "#0b294a",
                            "topic": "5.1基因突变和基因重组"
                        },
                        {
                            "id": "section5.2",
                            "background-color": "#e4f8ff",
                            "leading-line-color": "#1f82f0",
                            "foreground-color": "#0b294a",
                            "topic": "5.2染色体变异"
                        },
                        {
                            "id": "section5.3",
                            "background-color": "#e4f8ff",
                            "leading-line-color": "#1f82f0",
                            "foreground-color": "#0b294a",
                            "topic": "5.3人类遗传病"
                        }
                    ]
                },
                {
                    "id": "chapter6",
                    "topic": "第6章生物的进化",
                    "background-color": "#3788f6",
                    "leading-line-color": "#1c217e",
                    "foreground-color": "#ffffff",
                    "direction": "right",
                    "children": [
                        {
                            "id": "section6.1",
                            "background-color": "#e4f8ff",
                            "leading-line-color": "#1f82f0",
                            "foreground-color": "#0b294a",
                            "topic": "6.1生物有共同祖先的证据"
                        },
                        {
                            "id": "section6.2",
                            "background-color": "#e4f8ff",
                            "leading-line-color": "#1f82f0",
                            "foreground-color": "#0b294a",
                            "topic": "6.2自然选择与适应的形成"
                        },
                        {
                            "id": "section6.3",
                            "background-color": "#e4f8ff",
                            "leading-line-color": "#1f82f0",
                            "foreground-color": "#0b294a",
                            "topic": "6.3种群基因组成的变化与物种的形成"
                        },
                        {
                            "id": "section6.4",
                            "background-color": "#e4f8ff",
                            "leading-line-color": "#1f82f0",
                            "foreground-color": "#0b294a",
                            "topic": "6.4协同进化与生物多样性的形成"
                        }
                    ]
                }
            ]
        }
    };

    var options = {
        container: 'jsmind_container',
        theme: 'primary',
        editable: false,
        support_html: true,
        view: { engine: 'canvas',
                draggable: true
        },
        layout:{
           hspace:30,          // 节点之间的水平间距
           vspace:40,          // 节点之间的垂直间距
           pspace:13,          // 节点与连接线之间的水平间距（用于容纳节点收缩/展开控制器）
           cousin_space:10      // 相邻节点的子节点之间的额外的垂直间距
        }
    };

    var mind = new jsMind(options);
    mind.show(graph);
    var currentContextMenu = null;

    // 修改为click事件监听
    document.addEventListener('click', function(event) {
        var nodeElement = event.target.closest('jmnode');
        if (nodeElement) {
            event.stopPropagation(); // 阻止事件冒泡
            event.preventDefault(); // 阻止默认行为

            var nodeId = nodeElement.getAttribute('nodeid');
            // 只处理章节节点
            if (nodeId && nodeId.startsWith("section")) {
                showContextMenu(event, nodeElement);
            }
        }
    }, true); // 使用捕获阶段确保优先处理

    // 显示上下文菜单的函数
    function showContextMenu(event, node) {
        // 清理现有菜单
        if (currentContextMenu) {
            document.body.removeChild(currentContextMenu);
            currentContextMenu = null;
        }

        var nodeId = node.getAttribute('nodeid');
        var nodeName = node.textContent.trim();

        // 创建菜单容器
        var contextMenu = document.createElement('div');
        contextMenu.className = 'custom-menu';

        // 定位菜单（向右下方偏移5px）
        contextMenu.style.left = (event.pageX) + 'px';
        contextMenu.style.top = (event.pageY) + 'px';

        // 添加菜单项
        var menuItems = [
            {text: '去学习', action: () => {
                            document.body.removeChild(contextMenu);
                            currentContextMenu = null;
                            window.Android.onPrepareLesson(nodeId, nodeName);
                        }},
            {text: '去练习', action: () => {
                            document.body.removeChild(contextMenu);
                            currentContextMenu = null;
                            window.Android.onReviewLesson(nodeId, nodeName);
                        }}
        ];

        menuItems.forEach(item => {
            var div = document.createElement('div');
            div.className = 'custom-menu-item';
            div.textContent = item.text;
            div.onclick = function(e) {
                e.stopPropagation();
                item.action();
                document.body.removeChild(contextMenu);
            };
            contextMenu.appendChild(div);
        });

        document.body.appendChild(contextMenu);
        currentContextMenu = contextMenu;
    }

    // 点击任意位置关闭菜单
    document.addEventListener('click', function(e) {
         try {
            if (currentContextMenu && !currentContextMenu.contains(e.target)) {
                document.body.removeChild(currentContextMenu);
                currentContextMenu = null;
            }
         } catch (e) {
            // 捕获并处理异常
            console.log(e.toString());
        }
    });
</script>
</body>
</html>
