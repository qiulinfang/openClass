<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link type="text/css" rel="stylesheet" href="jsmind.css" />
    <script type="text/javascript" src="jsmind.js"></script>
</head>
<body>
<div id="jsmind_container" style="width: 800px; height: 800px;"></div>
<script type="text/javascript">
    var graph = {
        "meta": {
            "name": "数学第4章知识导图",
            "author": "imates",
            "version": "0.1"
        },
        "format": "node_tree",
        "data": {
            "id": "chapter5",
            "topic": "第4章<br/>数列",
            "children": [
                {
                    "id": "section4.1",
                    "topic": "4.1<br/>数列的概念",
                    "direction":"left",
                    "children" : [
                        {
                            "id":"subsetion4.1.1",
                            "topic":"列表"
                        },
                        {
                            "id":"subsetion4.1.2",
                            "topic":"通项公式"
                        },
                        {
                            "id":"subsetion4.1.3",
                            "topic":"根据递推关系<br/>求数列的某一项<br/>(非周期类)"
                        },
                        {
                            "id":"subsetion4.1.4",
                            "topic":"利用S<sub>n</sub>与a<sub>n</sub>的递推<br/>关系求通项"
                        },
                        {
                            "id":"subsetion4.1.5",
                            "topic":"数列中最大项与<br/>最小项的求解问题"
                        },
                        {
                            "id":"subsetion4.1.6",
                            "topic":"数列单调性问题"
                        },
                        {
                            "id":"subsetion4.1.7",
                            "topic":"数列周期性问题"
                        },
                        {
                            "id":"subsetion4.1.8",
                            "topic":"分段数列问题"
                        }
                    ]
                },
                {
                    "id": "section4.2",
                    "topic": "4.2<br/>等差数列",
                    "direction":"right",
                    "children":[
                        {
                            "id":"subsetion4.2.1",
                            "topic":"等差数列的概念"
                        },
                        {
                            "id":"subsetion4.2.2",
                            "topic":"等差数列前n项和"
                        }
                    ]
                },
                {
                    "id": "section4.3",
                    "topic": "4.3<br/>等比数列",
                    "direction":"right",
                    "children":[
                        {
                            "id":"subsetion4.3.1",
                            "topic":"等比数列的概念"
                        },
                        {
                            "id":"subsetion4.3.2",
                            "topic":"等比数列前n项和"
                        },
                        {
                            "id":"subsetion4.3.3",
                            "topic":"等差数列与等比数列综合"
                        }
                    ]
                }
            ]
        }
    };
    var options = {
        container: 'jsmind_container',
        theme: 'primary',
        editable: false,
        support_html: true,
        view:{
            engine: 'svg',
            draggable: true,
        },
    };
    var mind = new jsMind(options);
    mind.show(graph);

    // 全局变量保存当前上下文菜单
    var currentContextMenu = null;

    document.addEventListener('contextmenu', function(event) {
        var nodeElement = event.target.closest('jmnode'); // 使用自定义标签 jmnode
        if (nodeElement) {
            event.preventDefault(); // 阻止默认上下文菜单
            showContextMenu(event, nodeElement)
        }
    }, false);

    // 显示上下文菜单的函数
    function showContextMenu(event, node) {
        event.preventDefault(); // 阻止默认的右键菜单
        var nodeId = node.getAttribute('nodeid');
        var nodeName = node.textContent.trim();
        if (nodeId.startsWith("section")) {
            console.log("字符串以 'section' 开头");
        } else {
            console.log("字符串不以 'section' 开头");
            return;
        }
        try {
            // 如果已经有菜单存在，先移除它
            if (currentContextMenu) {
                document.body.removeChild(currentContextMenu);
                currentContextMenu = null;
            }
        } catch (e) {
            // 捕获并处理异常
            console.log(e.toString()); // 输出：UserException: "Value too high"
        }

        // 创建一个简单的上下文菜单
        var contextMenu = document.createElement('div');
        contextMenu.style.position = 'absolute';
        contextMenu.style.left = event.pageX + 'px';
        contextMenu.style.top = event.pageY + 'px';
        contextMenu.style.backgroundColor = 'white';
        contextMenu.style.border = '1px solid #ccc';
        contextMenu.style.boxShadow = '2px 2px 5px rgba(0, 0, 0, 0.2)';
        contextMenu.style.fontSize = '18pt'
        contextMenu.style.color = '#1d85ce'
        contextMenu.style.borderRadius = '4pt';
        contextMenu.style.zIndex = '1000';

        // 添加菜单项
        var menuItem1 = document.createElement('div');
        menuItem1.innerText = '去练习';
        menuItem1.style.padding = '5px 10px';
        menuItem1.addEventListener('click', function() {
            document.body.removeChild(contextMenu);
            window.Android.onReviewLesson(nodeId, nodeName);
        });

        var menuItem2 = document.createElement('div');
        menuItem2.innerText = '去学习';
        menuItem2.style.padding = '5px 10px';
        menuItem2.addEventListener('click', function() {
            document.body.removeChild(contextMenu);
            window.Android.onPrepareLesson(nodeId, nodeName);
        });

        contextMenu.appendChild(menuItem1);
        contextMenu.appendChild(menuItem2);

        document.body.appendChild(contextMenu);

        // 保存当前菜单
        currentContextMenu = contextMenu;
    }

    // 全局作用域中添加document的click事件监听器
    document.addEventListener('click', function(e) {
        try {
            if (currentContextMenu && !currentContextMenu.contains(e.target)) {
                document.body.removeChild(currentContextMenu);
                currentContextMenu = null;
            }
                } catch (e) {
            // 捕获并处理异常
            console.log(e.toString());
        }
    });
</script>
</body>
</html>
