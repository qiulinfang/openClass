<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公式输入板</title><script defer="defer" src="bundle.js"></script></head><body><div class="container"><div class="header"><h3>🧮 公式输入板</h3></div><div class="main-content"><div class="editor-section"><div class="custom-toolbar"><div class="toolbar-section"><div class="toolbar-label">⚡ 操作</div><div class="action-buttons"><button class="action-btn" id="insertMathBtn">🧮 插入公式</button> <button class="action-btn" id="showKeyboardBtn">⌨️ 公式键盘</button> <button class="action-btn secondary" id="clearEditorBtn">🗑️ 清空输入</button> <button class="action-btn success" id="exportMarkdownBtn">📤 编辑完成</button></div></div></div><div id="editor"></div><div class="custom-toolbar"><div class="toolbar-section"><div class="toolbar-label collapsible" id="formulaTemplatesToggle" style="cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;"><span>🎯 快速公式模板</span> <span id="formulaTemplatesArrow" style="transition:transform 0.2s;transform:rotate(90deg);">▶</span></div><div class="formula-templates" id="formulaTemplatesPanel" style="display:flex;"><button class="template-btn" data-formula="\frac{a}{b}"><span>分数</span></button> <button class="template-btn" data-formula="x^{2}"><span>上标</span></button> <button class="template-btn" data-formula="x_{1}"><span>下标</span></button> <button class="template-btn" data-formula="\sqrt{x}"><span>√x</span></button> <button class="template-btn" data-formula="x^2"><span>x²</span></button> <button class="template-btn" data-formula="\sum_{i=1}^{n} x_i"><span>∑</span></button> <button class="template-btn" data-formula="\lim_{x \to \infty} f(x)"><span>lim</span></button> <button class="template-btn" data-formula="\alpha + \beta = \gamma"><span>αβγ</span></button> <button class="template-btn" data-formula="\int_{a}^{b} f(x) dx"><span>∫</span></button> <button class="template-btn" data-formula="\alpha"><span>α</span></button> <button class="template-btn" data-formula="\beta"><span>β</span></button> <button class="template-btn" data-formula="\pi"><span>π</span></button> <button class="template-btn" data-formula="\leq"><span>≤</span></button> <button class="template-btn" data-formula="\geq"><span>≥</span></button> <button class="template-btn" data-formula="\begin{pmatrix} a & b \\ c & d \end{pmatrix}"><span>矩阵</span></button> <button class="template-btn" data-formula="a_n = a_1 + (n-1)d"><span>等差通项</span></button> <button class="template-btn" data-formula="S_n = \frac{n(a_1+a_n)}{2} = na_1 + \frac{n(n-1)}{2}d"><span>等差求和</span></button> <button class="template-btn" data-formula="a_n = a_1 q^{n-1}"><span>等比通项</span></button> <button class="template-btn" data-formula="S_n = \begin{cases} 
                                \frac{a_1(1-q^n)}{1-q} & (q \neq 1) \\
                                na_1 & (q = 1)
                                \end{cases}"><span>等比求和</span></button> <button class="template-btn" data-formula="\sum_{k=1}^n k^2 = \frac{n(n+1)(2n+1)}{6}"><span>平方和</span></button> <button class="template-btn" data-formula="a_{n+1} = pa_n + q \ (p \neq 1)"><span>递推数列</span></button> <button class="template-btn" data-formula="\log_{a}b = \frac{\ln b}{\ln a}"><span>对数换底</span></button> <button class="template-btn" data-formula="(a+b)^2 = a^2 + 2ab + b^2"><span>完全平方</span></button> <button class="template-btn" data-formula="a^2 - b^2 = (a-b)(a+b)"><span>平方差</span></button> <button class="template-btn" data-formula="a^3 \pm b^3 = (a \pm b)(a^2 \mp ab + b^2)"><span>立方和/差</span></button> <button class="template-btn" data-formula="x = \frac{-b \pm \sqrt{b^2-4ac}}{2a}"><span>求根</span></button> <button class="template-btn" data-formula="a^n \times a^m = a^{n+m}"><span>指数运算</span></button> <button class="template-btn" data-formula="\log_{a}(MN) = \log_{a}M + \log_{a}N"><span>对数运算</span></button> <button class="template-btn" data-formula="\sqrt{a} \times \sqrt{b} = \sqrt{ab} \ (a,b \geq 0)"><span>根式运算</span></button> <button class="template-btn" data-formula="|a| = \begin{cases} 
                                a & (a \geq 0) \\
                                -a & (a < 0)
                                \end{cases}"><span>绝对值定义</span></button> <button class="template-btn" data-formula="\frac{1}{a} + \frac{1}{b} = \frac{a+b}{ab}"><span>分式加法</span></button> <button class="template-btn" data-formula="(x-a)(x-b) = x^2 - (a+b)x + ab"><span>因式分解</span></button> <button class="template-btn" data-formula="\begin{cases} 
                                x + y = m \\ 
                                xy = n 
                                \end{cases} \Rightarrow t^2 - mt + n = 0"><span>韦达定理</span></button> <button class="template-btn" data-formula="f(x) = ax^2 + bx + c"><span>二次函数</span></button> <button class="template-btn" data-formula="\begin{cases} x+y=5 \\ 2x-y=1 \end{cases}"><span>方程组</span></button> <button class="template-btn" data-formula="a^2 + b^2 = c^2"><span>勾股定理</span></button> <button class="template-btn" data-formula="S_{\triangle} = \frac{1}{2}bh"><span>三角形面积</span></button> <button class="template-btn" data-formula="A = \pi r^2"><span>圆面积</span></button> <button class="template-btn" data-formula="S_{\text{扇形}} = \frac{1}{2} \alpha r^2 \ (\alpha\text{为弧度})"><span>扇形面积</span></button> <button class="template-btn" data-formula="A_{\text{球}} = 4\pi r^2"><span>球体表面积</span></button> <button class="template-btn" data-formula="V_{\text{锥}} = \frac{1}{3}\pi r^2 h"><span>圆锥体积</span></button> <button class="template-btn" data-formula="V_{\text{柱}} = \pi r^2 h"><span>圆柱体积</span></button> <button class="template-btn" data-formula="l = \alpha r \ (\alpha\text{为弧度})"><span>弧长公式</span></button> <button class="template-btn" data-formula="d = \sqrt{(x_2-x_1)^2 + (y_2-y_1)^2}"><span>两点距离</span></button> <button class="template-btn" data-formula="(x-a)^2 + (y-b)^2 = r^2"><span>圆的方程</span></button> <button class="template-btn" data-formula="\frac{x^2}{a^2} + \frac{y^2}{b^2} = 1"><span>椭圆方程</span></button> <button class="template-btn" data-formula="\frac{x-x_0}{a} + \frac{y-y_0}{b} = 1"><span>截距式直线</span></button> <button class="template-btn" data-formula="\vec{a} \cdot \vec{b} = |\vec{a}||\vec{b}|\cos\theta"><span>向量点积</span></button> <button class="template-btn" data-formula="\tan\alpha = \frac{\sin\alpha}{\cos\alpha}"><span>正切定义</span></button> <button class="template-btn" data-formula="\frac{a}{\sin A} = \frac{b}{\sin B} = \frac{c}{\sin C} = 2R"><span>正弦定理</span></button> <button class="template-btn" data-formula="a^2 = b^2 + c^2 - 2bc\cos A"><span>余弦定理</span></button> <button class="template-btn" data-formula="\sin(\alpha \pm \beta) = \sin\alpha\cos\beta \pm \cos\alpha\sin\beta"><span>和角公式</span></button> <button class="template-btn" data-formula="\cos2\alpha = \cos^2\alpha - \sin^2\alpha"><span>二倍角公式</span></button> <button class="template-btn" data-formula="\sin\alpha + \sin\beta = 2\sin\frac{\alpha+\beta}{2}\cos\frac{\alpha-\beta}{2}"><span>和化积</span></button> <button class="template-btn" data-formula="1 + \tan^2\alpha = \sec^2\alpha"><span>正割恒等式</span></button> <button class="template-btn" data-formula="\sin^2\theta + \cos^2\theta = 1"><span>三角恒等式</span></button> <button class="template-btn" data-formula="\sin\frac{\alpha}{2} = \pm \sqrt{\frac{1-\cos\alpha}{2}}"><span>半角公式</span></button> <button class="template-btn" data-formula="y = A\sin(\omega x + \phi) + k"><span>正弦函数</span></button> <button class="template-btn" data-formula="P(\overline{A}) = 1 - P(A)"><span>对立事件</span></button> <button class="template-btn" data-formula="P_n^k = \frac{n!}{(n-k)!}"><span>排列数</span></button> <button class="template-btn" data-formula="C_n^k = \frac{n!}{k!(n-k)!}"><span>组合数</span></button> <button class="template-btn" data-formula="E(X) = \sum x_i P(x_i)"><span>数学期望</span></button> <button class="template-btn" data-formula="\sigma = \sqrt{\frac{1}{N}\sum_{i=1}^N (x_i-\mu)^2}"><span>标准差</span></button> <button class="template-btn" data-formula="D(X) = E(X^2) - [E(X)]^2"><span>方差</span></button> <button class="template-btn" data-formula="P(A|B) = \frac{P(AB)}{P(B)}"><span>条件概率</span></button> <button class="template-btn" data-formula="\chi^2 = \sum \frac{(O-E)^2}{E}"><span>卡方检验</span></button> <button class="template-btn" data-formula="P(A \cup B) = P(A) + P(B) - P(A \cap B)"><span>概率加法</span></button> <button class="template-btn" data-formula="P(X=k) = C_n^k p^k (1-p)^{n-k}"><span>二项分布</span></button> <button class="template-btn" data-formula="C_6H_{12}O_6 + 6O_2 \to 6CO_2 + 6H_2O"><span>有氧呼吸</span></button> <button class="template-btn" data-formula="\triangle ABC \cong \triangle DEF"><span>全等符号</span></button> <button class="template-btn" data-formula="\angle AOB = 90^\circ"><span>角度符号</span></button> <button class="template-btn" data-formula="\overrightarrow{AB}"><span>向量符号</span></button></div></div></div><div class="export-result" id="exportResult"><div class="toolbar-label">📄 Markdown</div><textarea id="markdownOutput" readonly="readonly" placeholder="导出的Markdown内容将显示在这里..."></textarea> <button class="action-btn success" id="copyMarkdownBtn" style="margin-top: 15px;">📋 复制到剪贴板</button></div></div><div class="preview-section"><div class="section-title">👁️ 预览</div><div class="preview-content" id="preview"><h2>🎉 欢迎使用富媒体公式输入板！</h2><ul><li><strong>无缝集成</strong>：数学公式直接嵌入在文本中</li><li><strong>可视化编辑</strong>：双击公式即可进入编辑模式</li><li><strong>公式键盘</strong>：自动弹出数学符号键盘</li><li><strong>实时预览</strong>：编辑过程中实时查看效果</li><li><strong>模板支持</strong>：丰富的公式模板库</li><li><strong>导出Markdown</strong>：支持Markdown格式导出</li></ul></div></div></div></div><div class="status-indicator" id="statusIndicator">操作成功！</div></body></html>
