<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学伴</title>
    <link rel="icon" type="image/webp" href="./icons/ip_new.webp">

    <!-- MathJax Configuration -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          processEnvironments: true
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'],
          menuOptions: {
            context: 'None',
            semantics: false,
            zoom: 'None',
            assistiveMml: false,
            collapsible: false,
            inTabOrder: false,
            renderer: 'CHTML'
          },
          enableMenu: false,
          enableExplorer: false,
          enableAssistiveMml: false,
          enableCollapsible: false,
          enableEnrichment: false,
          assistiveMml: false,
          renderActions: {
            assistiveMml: []
          }
        },
        startup: {
          ready: function () {
            console.log('[MathJax] 正在执行默认启动序列...');
            MathJax.startup.defaultReady();
            console.log('[MathJax] 默认启动序列执行完成');
          }
        }
      };

      // 统一处理交互拦截逻辑，不干扰 MathJax 内部初始化
      document.addEventListener('DOMContentLoaded', function() {
        const isMathElement = (target) => {
          if (!target) return false;
          return (
            target.classList.contains('mjx-chtml') ||
            target.classList.contains('mjx-math') ||
            target.hasAttribute('data-mjx-texclass') ||
            target.closest('.mjx-chtml') ||
            target.closest('.mjx-math') ||
            target.closest('[data-mjx-texclass]')
          );
        };

        document.addEventListener('contextmenu', function(e) {
          if (isMathElement(e.target)) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);

        document.addEventListener('touchstart', function(e) {
          if (isMathElement(e.target)) {
            e.stopPropagation();
          }
        }, true);

        document.addEventListener('touchend', function(e) {
          if (isMathElement(e.target)) {
            e.stopPropagation();
          }
        }, true);
      });
    </script>
    <script type="text/javascript" id="MathJax-script"
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
    <script type="module" crossorigin src="./assets/index.DkEtIwY1.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/vendor.DKa092dc.js">
    <link rel="modulepreload" crossorigin href="./assets/_commonjsHelpers.DsqdWQfm.js">
    <link rel="modulepreload" crossorigin href="./assets/__vite-browser-external.D7Ct-6yo.js">
    <link rel="modulepreload" crossorigin href="./assets/chunk-DfAF0w94.qwHW_6P2.js">
    <link rel="stylesheet" crossorigin href="./assets/index.BRVruLD9.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
