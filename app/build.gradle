plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.cosinetech.imates'
    compileSdk 34

    defaultConfig {
        applicationId "com.cosinetech.imates"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        compose true
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: [".jar", ".aar"])

    implementation libs.appcompat
    implementation libs.material
    implementation libs.recyclerview
    implementation libs.constraintlayout
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.lifecycle.runtime.ktx
    implementation libs.activity.compose
    implementation platform(libs.compose.bom)
    implementation libs.ui
    implementation libs.ui.graphics
    implementation libs.ui.tooling.preview
    implementation libs.material3
    implementation libs.annotation
    implementation libs.leanback
    implementation libs.activity

    implementation libs.gson

    // ======== lottie animate ========
    implementation libs.lottie

    // ======== smartrefreshlayout ========
    implementation libs.refresh.layout.kernel // 核心库
    implementation libs.refresh.header.classics // 经典 Header
    implementation libs.refresh.footer.classics // 经典 Footer

    // ======== markdown dependencies ========
    implementation libs.commonmark
    implementation libs.commonmark.parent
    implementation libs.jlatexmath.android
    implementation libs.jlatexmath.android.font.cyrillic
    implementation libs.jlatexmath.android.font.greek
    implementation files('libs/markwon-core.aar')
    implementation files('libs/markwon-html.aar')
    implementation files('libs/markwon-image.aar')
    implementation files('libs/markwon-image-glide.aar')
    implementation files('libs/markwon-inline-parser.aar')
    implementation files('libs/markwon-syntax-highlight.aar')
    implementation files('libs/markwon-ext-latex.aar')
//    implementation libs.core
//    implementation libs.image
//    implementation libs.image.glide
//    implementation libs.ext.latex
    implementation libs.glide.v4120
    implementation libs.compiler

    // ======== CameraX core library ========
    def camerax_version = "1.4.0" // 使用最新版本号
    implementation libs.camera.core
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view
    implementation libs.android.image.cropper

    // ======== http/https请求库 ========
    implementation platform(libs.okhttp.bom)
    // define any required OkHttp artifacts without version
    implementation libs.okhttp
    implementation libs.logging.interceptor

    // ======== Viewer pager for tab layout
    implementation libs.viewpager2
    implementation libs.material.v175

    // ======== graph view
    implementation 'com.jjoe64:graphview:4.2.2'

    // ======== pdf
    implementation 'com.github.mhiew:android-pdf-viewer:3.2.0-beta.1'

    // ======== rating
    implementation 'com.github.spareyaya:SimpleRatingView:v1.0.5-beta'

    implementation project(':pdfui')

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.ui.test.junit4
    debugImplementation libs.ui.tooling
    debugImplementation libs.ui.test.manifest
}