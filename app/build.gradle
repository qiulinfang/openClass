android {
    namespace 'com.cosinetech.imates'
    compileSdk 34

    defaultConfig {
        applicationId "com.cosinetech.imates.bj101"
        minSdk 24
        targetSdk 34
        versionCode 68
        versionName "1.0.68"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    signingConfigs {
        release {
            keyAlias 'bj101'
            keyPassword 'imates@bj101.com'
            storeFile file('../appkey4bj101.jks')
            storePassword 'imates.com.cn'
        }
        debug {
            keyAlias 'bj101'
            keyPassword 'imates@bj101.com'
            storeFile file('../appkey4bj101.jks')
            storePassword 'imates.com.cn'
        }
    }

    // 产品变体配置 - 用于区分不同发布渠道，避免覆盖已安装的应用
    flavorDimensions "version"
    productFlavors {
        // 正式发布版本（默认）
        production {
            dimension "version"
            applicationId "com.cosinetech.imates.bj101"
            versionNameSuffix ""
        }
        // 测试版本 - 不会覆盖正式版
        staging {
            dimension "version"
            applicationId "com.cosinetech.imates.bj101.staging"
            versionNameSuffix "-staging"
        }
        // 开发版本 - 不会覆盖正式版和测试版
        dev {
            dimension "version"
            applicationId "com.cosinetech.imates.bj101.dev"
            versionNameSuffix "-dev"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            // Debug版本自动使用dev flavor，避免覆盖release版本
            // applicationIdSuffix 已由productFlavors的dev处理
        }
    }

    // 配置APK输出路径和名称
    android.applicationVariants.configureEach { variant ->
        def buildTypeName = variant.buildType.name // 获取构建类型名称
        def flavorName = variant.flavorName // 获取产品变体名称
        def outputs = variant.outputs
        outputs.configureEach { output ->
            if (output.outputFile != null && output.outputFile.name.endsWith('.apk')) {
                def versionName = variant.versionName
                def versionCode = variant.versionCode

                // 定义输出文件的新名称，包含flavor信息
                def outputFileName = "app-${flavorName}-${buildTypeName}-${versionName}-${versionCode}.apk"

                // 修改 APK 文件的输出路径和文件名
                output.outputFileName = outputFileName

                // 创建一个任务，在 APK 生成后计算 MD5 校验码
                def generateApkInfoTask = project.tasks.register("generateApkInfo_${variant.name}") {
                    doLast {
                        // 获取生成后的 APK 文件
                        def generatedFile = output.outputFile

                        // 计算文件大小和 MD5 校验码
                        def fileSize = generatedFile.length()
                        def md5Checksum = calculateMd5(generatedFile)

                        // 创建该 APK 对应的 JSON 信息
                        def apkInfo = [
                                fileName: generatedFile.name,
                                filePath: generatedFile.absolutePath,
                                fileSize: fileSize,
                                md5Checksum: md5Checksum
                        ]

                        // 创建 JSON 文件，并保存在与 APK 相同的目录下
                        def jsonFileName = "${generatedFile.name.replace('.apk', '')}-info.json"
                        def jsonFile = new File(generatedFile.parentFile, jsonFileName)
                        jsonFile.text = new JsonBuilder(apkInfo).toPrettyString()
                    }
                }

                // 将这个任务添加到构建任务的执行顺序中，确保它在 APK 构建后执行
                variant.assembleProvider.get().finalizedBy(generateApkInfoTask)
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        compose true
        dataBinding = true
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

// 辅助方法：计算文件的MD5校验码
def calculateMd5(File file) {
    def md5 = MessageDigest.getInstance("MD5")
    file.withInputStream { inputStream ->
        byte[] buffer = new byte[8192]
        int bytesRead
        while ((bytesRead = inputStream.read(buffer)) != -1) {
            md5.update(buffer, 0, bytesRead)
        }
    }
    return md5.digest().encodeHex().toString()
}

