<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高性能移动端阅读器</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --primary-color: #1890ff;
            --panel-bg: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        /* 工具栏 */
        .toolbar {
            height: 50px;
            background: var(--panel-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .tool-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 6px 12px;
            border: 1px solid #d9d9d9;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button.active {
            color: #fff;
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 视口 */
        .viewport {
            flex: 1;
            position: relative;
            overflow: hidden;
            touch-action: none; 
        }

        .canvas-container {
            position: absolute;
            transform-origin: 0 0;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            background: #fff;
            will-change: transform;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
        }

        .loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 100;
        }

        .status-bar {
            height: 30px;
            background: #eee;
            font-size: 12px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            color: #666;
        }
    </style>
</head>
<body>

<div id="app">
    <div class="toolbar">
        <div class="tool-group">
            <button @click="prevPage" :disabled="pageNum <= 1 || loading">上一页</button>
            <span>{{ pageNum }} / {{ pageCount }}</span>
            <button @click="nextPage" :disabled="pageNum >= pageCount || loading">下一页</button>
        </div>
        <div class="tool-group">
            <button @click="toggleDraw" :class="{active: isDrawing}">画笔</button>
            <button @click="clearInk">清除</button>
            <button @click="resetView">重置</button>
        </div>
    </div>

    <div class="viewport" 
         ref="viewportRef"
         @wheel.prevent="handleWheel"
         @mousedown="onMouseDown"
         @mousemove="onMouseMove"
         @mouseup="onMouseUp"
         @touchstart.passive="onTouchStart"
         @touchmove.prevent="onTouchMove"
         @touchend="onTouchEnd">
        
        <div class="canvas-container" :style="containerStyle">
            <canvas ref="pdfCanvasRef"></canvas>
            <canvas ref="inkCanvasRef"></canvas>
        </div>

        <div v-if="loading" class="loading-overlay">处理中...</div>
    </div>

    <div class="status-bar">
        缩放比例: {{ (scale * 100).toFixed(0) }}% | 
        坐标偏移: {{ offset.x.toFixed(0) }}, {{ offset.y.toFixed(0) }}
    </div>
</div>

<script>
const { createApp, ref, shallowRef, computed, onMounted, watch, toRaw } = Vue;

const RENDER_QUALITY = 2.0; 
const DEFAULT_URL = 'https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/web/compressed.tracemonkey-pldi-09.pdf';

createApp({
    setup() {
        const pdfDoc = shallowRef(null);
        const pageNum = ref(1);
        const pageCount = ref(0);
        const scale = ref(1.0);
        const offset = ref({ x: 0, y: 0 });
        const loading = ref(false);
        const isDrawing = ref(false);
        
        const viewportRef = ref(null);
        const pdfCanvasRef = ref(null);
        const inkCanvasRef = ref(null);
        
        const paths = ref([]); 
        const currentPath = ref(null);

        // 初始化 PDF
        const initPDF = async () => {
            loading.value = true;
            const pdfjsLib = window['pdfjs-dist/build/pdf'];
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            
            try {
                const loadingTask = pdfjsLib.getDocument(DEFAULT_URL);
                const doc = await loadingTask.promise;
                pdfDoc.value = doc;
                pageCount.value = doc.numPages;
                await renderPage();
            } catch (err) {
                console.error('PDF 加载失败:', err);
            } finally {
                loading.value = false;
            }
        };

        // 渲染页面
        const renderPage = async () => {
            if (!pdfDoc.value) return;
            loading.value = true;
            try {
                const rawDoc = toRaw(pdfDoc.value);
                const page = await rawDoc.getPage(pageNum.value);
                const viewport = page.getViewport({ scale: 1.0 });
                const canvas = pdfCanvasRef.value;
                const ctx = canvas.getContext('2d');

                canvas.width = viewport.width * RENDER_QUALITY;
                canvas.height = viewport.height * RENDER_QUALITY;
                canvas.style.width = `${viewport.width}px`;
                canvas.style.height = `${viewport.height}px`;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport,
                    transform: [RENDER_QUALITY, 0, 0, RENDER_QUALITY, 0, 0]
                };

                await page.render(renderContext).promise;
                syncInkCanvas(viewport.width, viewport.height);
            } catch (err) {
                console.error('渲染失败:', err);
            } finally {
                loading.value = false;
            }
        };

        const syncInkCanvas = (width, height) => {
            const canvas = inkCanvasRef.value;
            if (!canvas) return;
            canvas.width = width * RENDER_QUALITY;
            canvas.height = height * RENDER_QUALITY;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            drawAllPaths();
        };

        const drawAllPaths = () => {
            const canvas = inkCanvasRef.value;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 2 * RENDER_QUALITY;

            const draw = (path) => {
                if (path.length < 2) return;
                ctx.beginPath();
                ctx.moveTo(path[0].x * RENDER_QUALITY, path[0].y * RENDER_QUALITY);
                for (let i = 1; i < path.length; i++) {
                    ctx.lineTo(path[i].x * RENDER_QUALITY, path[i].y * RENDER_QUALITY);
                }
                ctx.stroke();
            };
            paths.value.forEach(draw);
            if (currentPath.value) draw(currentPath.value);
        };

        // 统一缩放逻辑
        const zoomAt = (delta, clientX, clientY) => {
            const factor = Math.pow(1.1, delta / 100);
            const newScale = Math.min(Math.max(scale.value * factor, 0.2), 15.0);
            if (newScale === scale.value) return;

            const rect = viewportRef.value.getBoundingClientRect();
            const mouseX = clientX - rect.left;
            const mouseY = clientY - rect.top;

            const ratio = newScale / scale.value;
            offset.value.x = mouseX - (mouseX - offset.value.x) * ratio;
            offset.value.y = mouseY - (mouseY - offset.value.y) * ratio;
            scale.value = newScale;
        };

        const handleWheel = (e) => zoomAt(-e.deltaY, e.clientX, e.clientY);

        const screenToPdf = (clientX, clientY) => {
            const canvasRect = pdfCanvasRef.value.getBoundingClientRect();
            return {
                x: (clientX - canvasRect.left) / scale.value,
                y: (clientY - canvasRect.top) / scale.value
            };
        };

        // 交互逻辑
        const startDrawing = (x, y) => {
            if (!isDrawing.value) return;
            currentPath.value = [screenToPdf(x, y)];
        };

        const moveDrawing = (x, y) => {
            if (!currentPath.value) return;
            currentPath.value.push(screenToPdf(x, y));
            drawAllPaths();
        };

        const endDrawing = () => {
            if (currentPath.value) {
                paths.value.push(currentPath.value);
                currentPath.value = null;
            }
        };

        const onMouseDown = (e) => startDrawing(e.clientX, e.clientY);
        const onMouseMove = (e) => {
            if (e.buttons === 1 && !isDrawing.value) {
                offset.value.x += e.movementX;
                offset.value.y += e.movementY;
            } else if (isDrawing.value) {
                moveDrawing(e.clientX, e.clientY);
            }
        };
        const onMouseUp = () => endDrawing();

        // 移动端核心手势处理
        let lastTouchDistance = 0;
        let lastTouchCenter = { x: 0, y: 0 };

        const onTouchStart = (e) => {
            if (e.touches.length === 1) {
                const t = e.touches[0];
                startDrawing(t.clientX, t.clientY);
                lastTouchCenter = { x: t.clientX, y: t.clientY };
            } else if (e.touches.length === 2) {
                const t1 = e.touches[0];
                const t2 = e.touches[1];
                lastTouchDistance = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                lastTouchCenter = {
                    x: (t1.clientX + t2.clientX) / 2,
                    y: (t1.clientY + t2.clientY) / 2
                };
            }
        };

        const onTouchMove = (e) => {
            if (e.touches.length === 1) {
                const t = e.touches[0];
                if (isDrawing.value) {
                    moveDrawing(t.clientX, t.clientY);
                } else {
                    // 平移逻辑
                    offset.value.x += (t.clientX - lastTouchCenter.x);
                    offset.value.y += (t.clientY - lastTouchCenter.y);
                    lastTouchCenter = { x: t.clientX, y: t.clientY };
                }
            } else if (e.touches.length === 2) {
                const t1 = e.touches[0];
                const t2 = e.touches[1];
                const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                const centerX = (t1.clientX + t2.clientX) / 2;
                const centerY = (t1.clientY + t2.clientY) / 2;
                
                if (lastTouchDistance > 0) {
                    // 1. 先计算位移增量
                    const dx = centerX - lastTouchCenter.x;
                    const dy = centerY - lastTouchCenter.y;

                    // 2. 计算缩放比
                    const ratio = dist / lastTouchDistance;
                    const newScale = Math.min(Math.max(scale.value * ratio, 0.2), 15.0);
                    const actualRatio = newScale / scale.value;

                    // 3. 应用变换：先随中心移动平移，再以新中心进行比例缩放补偿
                    // 这种算法能防止“手指离开瞬间”因微小位移导致的剧动
                    offset.value.x += dx;
                    offset.value.y += dy;
                    
                    offset.value.x = centerX - (centerX - offset.value.x) * actualRatio;
                    offset.value.y = centerY - (centerY - offset.value.y) * actualRatio;

                    scale.value = newScale;
                }
                
                lastTouchDistance = dist;
                lastTouchCenter = { x: centerX, y: centerY };
            }
        };

        const onTouchEnd = (e) => {
            endDrawing();
            // 重置手势基准，防止手指离开顺序不同导致的坐标跳变
            lastTouchDistance = 0;
            if (e.touches.length === 1) {
                // 如果还剩一个手指，更新其为新的平移起点
                lastTouchCenter = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        };

        const containerStyle = computed(() => ({
            transform: `translate(${offset.value.x}px, ${offset.value.y}px) scale(${scale.value})`
        }));

        const prevPage = () => { if (pageNum.value > 1) pageNum.value--; };
        const nextPage = () => { if (pageNum.value < pageCount.value) pageNum.value++; };
        const toggleDraw = () => isDrawing.value = !isDrawing.value;
        const clearInk = () => { paths.value = []; drawAllPaths(); };
        const resetView = () => { scale.value = 1.0; offset.value = { x: 0, y: 0 }; };

        watch(pageNum, renderPage);
        onMounted(initPDF);

        return {
            pdfCanvasRef, inkCanvasRef, viewportRef,
            pageNum, pageCount, scale, offset, loading, isDrawing,
            containerStyle,
            prevPage, nextPage, toggleDraw, clearInk, resetView,
            handleWheel, onMouseDown, onMouseMove, onMouseUp,
            onTouchStart, onTouchMove, onTouchEnd
        };
    }
}).mount('#app');
</script>
</body>
</html>
