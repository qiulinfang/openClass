<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>画底和高</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f7;
      color: #111;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #app {
      width: 920px; /* 900px canvas + padding */
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 10px;
      transform-origin: center center;
      flex-shrink: 0;
    }

    canvas {
      width: 900px;
      height: 675px;
      display: block;
      border: 2px solid #222;
      background: #fff;
      touch-action: none;
    }

    .pen-toolbar {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .action-toolbar {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .pen-toolbar button {
      width: 220px;
    }

    button {
      min-height: 44px;
      border: 2px solid #222;
      border-radius: 6px;
      background: #fff;
      color: #111;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button.active.blue {
      border-color: #2563eb;
      background: #eaf2ff;
      color: #2563eb;
    }

    button.active.red {
      border-color: #dc2626;
      background: #ffecec;
      color: #dc2626;
    }

    #submitBtn:disabled {
      border-color: #9ca3af;
      background: #f3f4f6;
      color: #9ca3af;
      cursor: not-allowed;
    }

    #submitBtn.ready {
      border-color: #16a34a;
      background: #dcfce7;
      color: #166534;
    }

    #toast {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.96);
      padding: 12px 22px;
      border-radius: 10px;
      background: rgba(17, 17, 17, 0.88);
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease;
      z-index: 1000;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="pen-toolbar">
      <button id="bluePen" class="blue active" type="button">底：蓝笔</button>
      <button id="redPen" class="red" type="button">高：红笔</button>
    </div>

    <canvas id="board" width="900" height="675"></canvas>

    <div class="action-toolbar">
      <button id="undoBtn" type="button">撤销</button>
      <button id="clearBtn" type="button">清空</button>
      <button id="submitBtn" type="button" disabled>提交</button>
    </div>
  </div>

  <div id="toast" aria-live="polite"></div>

  <script>
    // 屏幕适配缩放逻辑
    function handleResize() {
      const app = document.getElementById('app');
      if (!app) return;
      
      const padding = 20; // 左右边距总和
      const designWidth = 920; 
      const designHeight = app.offsetHeight;
      
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      
      const scaleX = windowWidth / designWidth;
      const scaleY = windowHeight / designHeight;
      const scale = Math.min(scaleX, scaleY, 1);
      
      app.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', handleResize);
    // 使用 MutationObserver 监听高度变化，确保内容加载后也能正确缩放
    const observer = new MutationObserver(handleResize);
    observer.observe(document.body, { childList: true, subtree: true });
    
    // 初始化
    handleResize();
    setTimeout(handleResize, 100); // 兜底

    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const bluePen = document.getElementById("bluePen");
    const redPen = document.getElementById("redPen");
    const undoBtn = document.getElementById("undoBtn");
    const clearBtn = document.getElementById("clearBtn");
    const submitBtn = document.getElementById("submitBtn");
    const toast = document.getElementById("toast");

    const points = {
      A: { x: 260, y: 185 },
      B: { x: 720, y: 185 },
      C: { x: 500, y: 530 },
      D: { x: 40, y: 530 }
    };

    let currentPen = "blue";
    let drawing = false;
    let startPoint = null;
    let previewLine = null;
    let strokes = {
      blue: null,
      red: null
    };
    let history = [];
    const AREA_TOLERANCE_RATIO = 0.06;
    const HEIGHT_PERPENDICULAR_TOLERANCE_DEG = 12;
    let toastTimer = null;

    function makeLine(a, b, name = "") {
      return {
        x1: a.x,
        y1: a.y,
        x2: b.x,
        y2: b.y,
        name
      };
    }

    function projectPointToLine(point, baseLine) {
      const vx = baseLine.x2 - baseLine.x1;
      const vy = baseLine.y2 - baseLine.y1;
      const wx = point.x - baseLine.x1;
      const wy = point.y - baseLine.y1;
      const lenSq = vx * vx + vy * vy;
      const t = lenSq === 0 ? 0 : (wx * vx + wy * vy) / lenSq;
      return {
        x: baseLine.x1 + t * vx,
        y: baseLine.y1 + t * vy
      };
    }

    function heightFromPointToBase(point, baseLine, name) {
      return makeLine(point, projectPointToLine(point, baseLine), name);
    }

    function buildGeometry() {
      const sides = [
        { name: "AB", line: makeLine(points.A, points.B, "AB"), adjacent: ["AD", "BC"], oppositePoints: [points.D, points.C] },
        { name: "BC", line: makeLine(points.B, points.C, "BC"), adjacent: ["AB", "DC"], oppositePoints: [points.A, points.D] },
        { name: "DC", line: makeLine(points.D, points.C, "DC"), adjacent: ["AD", "BC"], oppositePoints: [points.A, points.B] },
        { name: "AD", line: makeLine(points.A, points.D, "AD"), adjacent: ["AB", "DC"], oppositePoints: [points.B, points.C] }
      ];
      const sideByName = Object.fromEntries(sides.map((side) => [side.name, side.line]));

      return sides.map((side) => ({
        name: side.name,
        line: side.line,
        neighbors: side.adjacent.map((name) => sideByName[name]),
        heights: side.oppositePoints.map((point, index) =>
          heightFromPointToBase(point, side.line, `${side.name}-height-${index + 1}`)
        )
      }));
    }

    function setPen(pen) {
      currentPen = pen;
      bluePen.classList.toggle("active", pen === "blue");
      redPen.classList.toggle("active", pen === "red");
      draw();
    }

    function updateSubmitState() {
      const canSubmit = Boolean(strokes.blue && strokes.red);
      submitBtn.disabled = !canSubmit;
      submitBtn.classList.toggle("ready", canSubmit);
    }

    function canvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const source = event.touches && event.touches[0]
        ? event.touches[0]
        : event.changedTouches && event.changedTouches[0]
          ? event.changedTouches[0]
          : event;

      return {
        x: (source.clientX - rect.left) * scaleX,
        y: (source.clientY - rect.top) * scaleY
      };
    }

    function beginDraw(event) {
      event.preventDefault();
      drawing = true;
      startPoint = canvasPoint(event);
      previewLine = makeLine(startPoint, startPoint);
      draw();
    }

    function moveDraw(event) {
      if (!drawing) return;
      event.preventDefault();
      previewLine = makeLine(startPoint, canvasPoint(event));
      draw();
    }

    function endDraw(event) {
      if (!drawing) return;
      event.preventDefault();
      const endPoint = canvasPoint(event);
      const newLine = makeLine(startPoint, endPoint);

      if (lineLength(newLine) > 8) {
        history.push({
          type: "replace",
          color: currentPen,
          previous: strokes[currentPen]
        });
        strokes[currentPen] = newLine;
      }

      drawing = false;
      startPoint = null;
      previewLine = null;
      updateSubmitState();
      draw();
    }

    function cancelDraw(event) {
      event.preventDefault();
      drawing = false;
      startPoint = null;
      previewLine = null;
      draw();
    }

    function undo() {
      const last = history.pop();
      if (!last) return;

      if (last.type === "clear") {
        strokes.blue = last.previous.blue;
        strokes.red = last.previous.red;
      } else {
        strokes[last.color] = last.previous;
      }

      updateSubmitState();
      draw();
    }

    function clearAll() {
      history.push({
        type: "clear",
        previous: {
          blue: strokes.blue,
          red: strokes.red
        }
      });
      strokes.blue = null;
      strokes.red = null;
      hideToast();
      setPen("blue");
      updateSubmitState();
      draw();
    }

    function drawParallelogram() {
      ctx.save();
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#222";
      ctx.fillStyle = "#fff8df";
      ctx.beginPath();
      ctx.moveTo(points.A.x, points.A.y);
      ctx.lineTo(points.B.x, points.B.y);
      ctx.lineTo(points.C.x, points.C.y);
      ctx.lineTo(points.D.x, points.D.y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawStroke(line, color, preview = false) {
      if (!line) return;
      ctx.save();
      ctx.lineWidth = preview ? 5 : 7;
      ctx.lineCap = "round";
      ctx.strokeStyle = color === "blue" ? "#2563eb" : "#dc2626";
      if (preview) ctx.setLineDash([12, 8]);
      ctx.beginPath();
      ctx.moveTo(line.x1, line.y1);
      ctx.lineTo(line.x2, line.y2);
      ctx.stroke();
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawParallelogram();
      drawStroke(strokes.blue, "blue");
      drawStroke(strokes.red, "red");
      drawStroke(previewLine, currentPen, true);
    }

    function classify() {
      if (!strokes.blue || !strokes.red) {
        if (!strokes.blue) {
          suggestRedraw("both");
        } else {
          suggestRedraw("height");
        }
        return;
      }

      const options = buildGeometry();
      const matchedBases = options.filter((option) => isSameLine(strokes.blue, option.line));
      if (matchedBases.length === 0) {
        suggestRedraw("both");
        return;
      }

      const baseOption = pickBestMatchedBase(matchedBases, strokes.blue);
      const baseLen = lineLength(baseOption.line);
      if (baseLen === 0 || lineLength(strokes.red) <= 8) {
        suggestRedraw(baseLen === 0 ? "both" : "height");
        return;
      }

      const studentHeight = lineLength(strokes.red);
      const studentArea = baseLen * studentHeight;
      const trueArea = parallelogramArea(points.A, points.B, points.D);
      const areaClose = Math.abs(studentArea - trueArea) <= trueArea * AREA_TOLERANCE_RATIO;
      const angleToBase = lineAngleDegrees(strokes.red, baseOption.line);
      const nearPerpendicular = Math.abs(90 - angleToBase) <= HEIGHT_PERPENDICULAR_TOLERANCE_DEG;

      if (areaClose && nearPerpendicular) {
        showPersistentToast("你的高画的正确");
        return;
      }

      const neighborMistake = baseOption.neighbors.some((neighbor) =>
        isSameLine(strokes.red, neighbor)
      );

      if (neighborMistake) {
        showPersistentToast("你的高画的，其实是底边邻边");
        return;
      }

      suggestRedraw("height");
    }

    function suggestRedraw(clearMode) {
      showToast("建议重画哦");
      autoClearByMode(clearMode);
    }

    function showPersistentToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      if (toastTimer) {
        clearTimeout(toastTimer);
        toastTimer = null;
      }
    }

    function hideToast() {
      toast.classList.remove("show");
      toast.textContent = "";
      if (toastTimer) {
        clearTimeout(toastTimer);
        toastTimer = null;
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1200);
    }

    function autoClearByMode(mode) {
      if (mode === "height") {
        if (!strokes.red) return;
        history.push({
          type: "replace",
          color: "red",
          previous: strokes.red
        });
        strokes.red = null;
      } else {
        history.push({
          type: "clear",
          previous: {
            blue: strokes.blue,
            red: strokes.red
          }
        });
        strokes.blue = null;
        strokes.red = null;
      }
      updateSubmitState();
      draw();
    }

    function pickBestMatchedBase(matchedBases, actualBase) {
      if (matchedBases.length === 1) return matchedBases[0];
      return matchedBases.reduce((best, current) =>
        directedLineDistance(actualBase, current.line) < directedLineDistance(actualBase, best.line)
          ? current
          : best
      );
    }

    function pointToInfiniteLineDistance(point, target) {
      const vx = target.x2 - target.x1;
      const vy = target.y2 - target.y1;
      const wx = point.x - target.x1;
      const wy = point.y - target.y1;
      const len = Math.hypot(vx, vy);
      if (len === 0) return 0;
      return Math.abs(wx * vy - wy * vx) / len;
    }

    function parallelogramArea(a, b, d) {
      const abx = b.x - a.x;
      const aby = b.y - a.y;
      const adx = d.x - a.x;
      const ady = d.y - a.y;
      return Math.abs(abx * ady - aby * adx);
    }

    function isSameLine(actual, target) {
      const targetLength = lineLength(target);
      if (targetLength === 0) return false;

      const actualLength = lineLength(actual);
      const endpointTolerance = Math.max(72, targetLength * 0.22);
      const endpointDistance = directedLineDistance(actual, target);
      const lengthErrorRatio = Math.abs(actualLength - targetLength) / targetLength;

      return endpointDistance <= endpointTolerance && lengthErrorRatio <= 0.45;
    }

    function directedLineDistance(actual, target) {
      const d1 = distance({ x: actual.x1, y: actual.y1 }, { x: target.x1, y: target.y1 }) +
        distance({ x: actual.x2, y: actual.y2 }, { x: target.x2, y: target.y2 });
      const d2 = distance({ x: actual.x1, y: actual.y1 }, { x: target.x2, y: target.y2 }) +
        distance({ x: actual.x2, y: actual.y2 }, { x: target.x1, y: target.y1 });
      return Math.min(d1, d2);
    }

    function midpoint(line) {
      return {
        x: (line.x1 + line.x2) / 2,
        y: (line.y1 + line.y2) / 2
      };
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function lineLength(line) {
      return Math.hypot(line.x2 - line.x1, line.y2 - line.y1);
    }

    function lineAngleDegrees(lineA, lineB) {
      const ax = lineA.x2 - lineA.x1;
      const ay = lineA.y2 - lineA.y1;
      const bx = lineB.x2 - lineB.x1;
      const by = lineB.y2 - lineB.y1;
      const lenA = Math.hypot(ax, ay);
      const lenB = Math.hypot(bx, by);
      if (lenA === 0 || lenB === 0) return 0;
      const cosValue = (ax * bx + ay * by) / (lenA * lenB);
      const clampedCos = Math.max(-1, Math.min(1, cosValue));
      const angle = Math.acos(clampedCos) * 180 / Math.PI;
      return Math.min(angle, 180 - angle);
    }

    bluePen.addEventListener("click", () => setPen("blue"));
    redPen.addEventListener("click", () => setPen("red"));
    undoBtn.addEventListener("click", undo);
    clearBtn.addEventListener("click", clearAll);
    submitBtn.addEventListener("click", classify);

    canvas.addEventListener("mousedown", beginDraw);
    canvas.addEventListener("mousemove", moveDraw);
    window.addEventListener("mouseup", endDraw);
    canvas.addEventListener("touchstart", beginDraw, { passive: false });
    canvas.addEventListener("touchmove", moveDraw, { passive: false });
    canvas.addEventListener("touchend", endDraw, { passive: false });
    canvas.addEventListener("touchcancel", cancelDraw, { passive: false });

    updateSubmitState();
    draw();
  </script>
</body>
</html>
