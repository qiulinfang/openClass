<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>篮球拼图挑战赛 - 专业版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f8fafc;
            touch-action: manipulation;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .game-font {
            font-family: 'ZCOOL KuaiLe', cursive;
        }

        .grid-cell {
            aspect-ratio: 1 / 1;
            border: 1px solid #f1f5f9;
            background-color: white;
        }

        .piece {
            transition: top 0.2s linear, left 0.2s linear, box-shadow 0.3s ease;
            z-index: 10;
            cursor: pointer;
            user-select: none;
        }

        .piece.selected {
            box-shadow: 0 0 25px rgba(249, 115, 22, 0.4);
            outline: 3px solid #f97316;
            z-index: 20;
        }

        .piece img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .control-btn {
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .control-btn:active {
            transform: scale(0.92);
        }

        .num-btn.active {
            background-color: #3b82f6 !important;
            color: white;
        }

        .dir-btn.active {
            background-color: #f97316 !important;
            color: white;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 50px;
            background: rgba(15, 23, 42, 0.9);
            color: white;
            z-index: 2000;
            display: none;
            animation: fadeInOut 2s forwards;
            font-weight: bold;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -20px); }
            15% { opacity: 1; transform: translate(-50%, 0); }
            85% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }

        .history-card {
            background: #fff;
            border-left: 4px solid #f1f5f9;
            transition: all 0.3s;
        }
        .history-card.active {
            border-left-color: #f97316;
            background: #fff7ed;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* 响应式调整：使棋盘尽可能大 */
        #game-board-container {
            max-width: 90vh; /* 避免高度溢出 */
            width: 100%;
        }
    </style>
</head>
<body class="bg-slate-50">

    <div id="toast" class="toast"></div>

    <!-- 顶部标题栏 -->
    <header class="bg-white border-b border-gray-100 py-3 px-6 flex justify-between items-center shrink-0">
        <h1 class="text-3xl font-black text-slate-800 tracking-tight flex items-center gap-2">
            <span class="text-orange-500">🏀</span> 篮球拼图挑战赛
        </h1>
        <div class="flex gap-4 items-center">
            <!-- 步数和重置按钮已移到下方控制区 -->
        </div>
    </header>

    <main class="flex flex-col lg:flex-row flex-1 overflow-hidden">
        
        <!-- 左侧：状态与轨迹面板 -->
        <aside class="w-full lg:w-72 bg-white border-r border-gray-100 flex flex-col shrink-0 overflow-hidden">
            <!-- 目标图 -->
            <div class="p-6 border-b border-gray-50 text-center">
                <h3 class="text-sm text-gray-400 font-black uppercase tracking-[0.2em] mb-4">目标参考</h3>
                <div class="relative inline-block border-2 border-dashed border-gray-100 p-2 rounded-2xl bg-gray-50/30">
                    <img src="https://www.imates.com.cn/xuebanImg/basketball-full.webp" alt="Full Basketball" class="w-32 h-32 object-contain opacity-90">
                </div>
            </div>

            <!-- ABCD 移动轨迹 -->
            <div class="flex-1 flex flex-col overflow-hidden">
                <div class="px-6 py-4 flex justify-between items-center">
                    <h3 class="text-sm text-gray-400 font-black uppercase tracking-[0.2em]">移动轨迹 (A/B/C/D)</h3>
                </div>
                <div id="piece-history-container" class="flex-1 overflow-y-auto px-4 pb-6 space-y-3 no-scrollbar">
                    <!-- 动态生成 -->
                </div>
            </div>
        </aside>

        <!-- 中间：核心游戏区 -->
        <section class="flex-1 flex flex-col items-center justify-center p-4 lg:p-8 bg-slate-50 relative overflow-hidden">
            
            <div id="game-board-container" class="relative w-full bg-white">
                <!-- 棋盘网格 -->
                <div id="grid" class="grid grid-cols-6 grid-rows-4 gap-0 w-full aspect-[6/4]">
                    <!-- 动态网格背景 -->
                </div>
                
                <!-- 拼图碎片层 -->
                <div id="pieces-container" class="absolute inset-0 pointer-events-none">
                    <!-- 碎片将动态生成在此 -->
                </div>
            </div>

            <!-- 操作台 -->
            <div class="mt-8 bg-white/80 backdrop-blur-sm p-4 rounded-[2.5rem] shadow-lg border border-white flex flex-wrap justify-center items-center gap-6 max-w-4xl w-full">
                <!-- 方向键 -->
                <div class="grid grid-cols-3 gap-2">
                    <div class="w-14 h-14"></div>
                    <button id="btn-up" onclick="setDir('UP')" class="dir-btn control-btn w-14 h-14 bg-slate-100 rounded-xl flex items-center justify-center text-2xl shadow-sm hover:bg-slate-200">↑</button>
                    <div class="w-14 h-14"></div>
                    <button id="btn-left" onclick="setDir('LEFT')" class="dir-btn control-btn w-14 h-14 bg-slate-100 rounded-xl flex items-center justify-center text-2xl shadow-sm hover:bg-slate-200">←</button>
                    <button id="btn-down" onclick="setDir('DOWN')" class="dir-btn control-btn w-14 h-14 bg-slate-100 rounded-xl flex items-center justify-center text-2xl shadow-sm hover:bg-slate-200">↓</button>
                    <button id="btn-right" onclick="setDir('RIGHT')" class="dir-btn control-btn w-14 h-14 bg-slate-100 rounded-xl flex items-center justify-center text-2xl shadow-sm hover:bg-slate-200">→</button>
                </div>

                <!-- 步数键 -->
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setStep(1)" class="num-btn control-btn w-14 h-14 bg-blue-50 text-blue-600 font-black rounded-xl text-xl hover:bg-blue-100">1</button>
                    <button onclick="setStep(2)" class="num-btn control-btn w-14 h-14 bg-blue-50 text-blue-600 font-black rounded-xl text-xl hover:bg-blue-100">2</button>
                    <button onclick="setStep(3)" class="num-btn control-btn w-14 h-14 bg-blue-50 text-blue-600 font-black rounded-xl text-xl hover:bg-blue-100">3</button>
                    <button onclick="setStep(4)" class="num-btn control-btn w-14 h-14 bg-blue-50 text-blue-600 font-black rounded-xl text-xl hover:bg-blue-100">4</button>
                    <button onclick="setStep(5)" class="num-btn control-btn w-14 h-14 bg-blue-50 text-blue-600 font-black rounded-xl text-xl hover:bg-blue-100">5</button>
                    <button onclick="setStep(6)" class="num-btn control-btn w-14 h-14 bg-blue-50 text-blue-600 font-black rounded-xl text-xl hover:bg-blue-100">6</button>
                </div>

                <!-- 重置游戏按钮 -->
                <button onclick="resetGame()" class="control-btn w-28 h-14 bg-red-50 text-red-500 font-bold rounded-xl text-base hover:bg-red-100 flex items-center justify-center">复原</button>

                <div class="hidden sm:block h-12 w-[1px] bg-gray-100"></div>

                <!-- 指令说明 -->
                <div class="hidden md:flex flex-col text-xs text-gray-400 font-bold uppercase tracking-widest gap-1">
                    <span>1. 点击选择碎片</span>
                    <span>2. 选择移动方向</span>
                    <span>3. 选择移动步数</span>
                </div>
            </div>
        </section>

        <!-- 右侧：方案记录 (可选，若不需要可删除或隐藏) -->
        <aside class="w-full lg:w-64 bg-white border-l border-gray-100 flex flex-col shrink-0 overflow-hidden">
            <div class="p-6 border-b border-gray-50 flex justify-between items-center">
                <h3 class="text-sm text-gray-400 font-black uppercase tracking-[0.2em]">历史方案</h3>
                <button onclick="clearSchemes()" class="text-xs text-gray-300 hover:text-red-500 transition-colors">清空</button>
            </div>
            <div id="schemes-list" class="flex-1 overflow-y-auto p-4 space-y-2 no-scrollbar">
                <div class="text-center py-10 text-gray-300 text-xs italic">未解锁成功记录</div>
            </div>
        </aside>

    </main>

    <script>
        const ROWS = 4, COLS = 6;
        const PIECES_CONFIG = {
            'A': { src: "https://www.imates.com.cn/xuebanImg/basketball-piece1.webp", init: [0, 1] },
            'B': { src: "https://www.imates.com.cn/xuebanImg/basketball-piece2.webp", init: [1, 5] },
            'C': { src: "https://www.imates.com.cn/xuebanImg/basketball-piece3.webp", init: [2, 0] },
            'D': { src: "https://www.imates.com.cn/xuebanImg/basketball-piece4.webp", init: [3, 2] }
        };

        let pieces = {};
        let selectedId = null;
        let pendingStep = null;
        let pendingDir = null;
        let isAnimating = false;
        let currentMoves = []; 
        let pieceSpecificMoves = { 'A': [], 'B': [], 'C': [], 'D': [] }; 
        let savedSchemes = [];
        let hasWonCurrentRound = false;
        let isReplaying = false;

        function init() {
            createGrid();
            resetState();
            // 方案仅保留在内存中：刷新页面即丢弃
            localStorage.removeItem('bb_puzzle_save');
            loadSchemes();
            renderPieces();
            
            // 窗口调整大小时重新渲染以保持位置正确
            window.addEventListener('resize', renderPieces);
        }

        function createGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            for (let i = 0; i < ROWS * COLS; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                grid.appendChild(cell);
            }
        }

        function resetState() {
            Object.keys(PIECES_CONFIG).forEach(id => {
                pieces[id] = [...PIECES_CONFIG[id].init];
                pieceSpecificMoves[id] = [];
            });
            selectedId = null;
            pendingStep = null;
            pendingDir = null;
            currentMoves = [];
            hasWonCurrentRound = false;
            updateControlUI();
            updateHistoryUI();
        }


        function renderPieces() {
            const container = document.getElementById('pieces-container');
            container.innerHTML = '';
            const cellW = 100 / COLS, cellH = 100 / ROWS;

            Object.keys(PIECES_CONFIG).forEach(id => {
                const [r, c] = pieces[id];
                const el = document.createElement('div');
                el.id = `piece-${id}`;
                el.className = `piece absolute rounded-lg overflow-hidden ${selectedId === id ? 'selected' : ''}`;
                el.style.width = `${cellW}%`;
                el.style.height = `${cellH}%`;
                el.style.top = `${r * cellH}%`;
                el.style.left = `${c * cellW}%`;
                el.style.pointerEvents = 'auto';
                
                // 内部容器增加缩进，模拟拼图块感
                el.innerHTML = `
                    <div class="w-full h-full p-0 relative flex items-center justify-center">
                        <img src="${PIECES_CONFIG[id].src}" alt="${id}" class="w-full h-full object-contain">
                        <div class="absolute bottom-1 right-2 text-sm font-black text-orange-500/20 select-none">${id}</div>
                    </div>`;
                
                el.onclick = (e) => {
                    e.stopPropagation();
                    if (isAnimating || isReplaying) return;
                    selectPiece(id);
                };
                container.appendChild(el);
            });
            updateHistoryUI();
        }

        function selectPiece(id) {
            selectedId = id;
            updateControlUI();
            renderPieces();
        }

        function setStep(n) {
            if (isAnimating || isReplaying || !selectedId) {
                if(isReplaying) return;
                if(!selectedId) showToast("请先点击选择一个拼图块");
                return;
            }
            pendingStep = n;
            updateControlUI();
            checkTrigger();
        }

        function setDir(dir) {
            if (isAnimating || isReplaying || !selectedId) {
                if(isReplaying) return;
                if(!selectedId) showToast("请先点击选择一个拼图块");
                return;
            }
            pendingDir = dir;
            updateControlUI();
            checkTrigger();
        }

        function updateControlUI() {
            document.querySelectorAll('.num-btn').forEach((b, i) => b.classList.toggle('active', pendingStep === i + 1));
            document.querySelectorAll('.dir-btn').forEach(b => {
                const d = b.getAttribute('onclick').match(/'(\w+)'/)?.[1];
                if (d) b.classList.toggle('active', pendingDir === d);
            });
        }

        async function checkTrigger() {
            if (selectedId && pendingStep && pendingDir) {
                const id = selectedId, s = pendingStep, d = pendingDir;
                pendingStep = null; pendingDir = null;
                updateControlUI();
                await executeMove(id, d, s);
                checkVictory();
            }
        }

        async function executeMove(id, dir, steps, isReplay = false) {
            isAnimating = true;
            const startPos = [...pieces[id]];
            const dr = { UP: -1, DOWN: 1, LEFT: 0, RIGHT: 0 }[dir];
            const dc = { UP: 0, DOWN: 0, LEFT: -1, RIGHT: 1 }[dir];
            
            const targetR = startPos[0] + dr * steps;
            const targetC = startPos[1] + dc * steps;

            if (targetR < 0 || targetR >= ROWS || targetC < 0 || targetC >= COLS) {
                if (!isReplay) showToast("哎呀，撞墙了！");
                isAnimating = false;
                return;
            }

            let path = [];
            let collided = false;
            for (let i = 1; i <= steps; i++) {
                const nr = startPos[0] + dr * i;
                const nc = startPos[1] + dc * i;
                const hit = Object.entries(pieces).some(([oid, pos]) => oid !== id && pos[0] === nr && pos[1] === nc);
                path.push([nr, nc]);
                if (hit) { collided = true; break; }
            }

            const el = document.getElementById(`piece-${id}`);
            const cellW = 100 / COLS, cellH = 100 / ROWS;

            for (const [r, c] of path) {
                el.style.top = `${r * cellH}%`;
                el.style.left = `${c * cellW}%`;
                await sleep(180); 
            }

            if (collided) {
                await sleep(100);
                if (!isReplay) showToast("不能和其他拼图重叠哦");
                for (let i = path.length - 2; i >= -1; i--) {
                    const [r, c] = i === -1 ? startPos : path[i];
                    el.style.top = `${r * cellH}%`;
                    el.style.left = `${c * cellW}%`;
                    await sleep(120);
                }
                pieces[id] = [...startPos];
            } else {
                pieces[id] = [targetR, targetC];
                if (!isReplay) {
                    const moveObj = { dir, steps };
                    currentMoves.push({ id, ...moveObj });
                    pieceSpecificMoves[id].push(moveObj);
                }
            }

            isAnimating = false;
            renderPieces();
        }

        function updateHistoryUI() {
            const container = document.getElementById('piece-history-container');
            const dIcons = { UP: '↑', DOWN: '↓', LEFT: '←', RIGHT: '→' };
            
            container.innerHTML = Object.keys(PIECES_CONFIG).map(id => {
                const moves = pieceSpecificMoves[id];
                const active = selectedId === id ? 'active shadow-md' : '';
                return `
                    <div class="history-card p-4 rounded-2xl border border-gray-100 ${active}">
                        <div class="flex justify-between items-center mb-3">
                            <span class="font-black text-slate-700 text-base">碎片 ${id}</span>
                            <span class="text-xs bg-slate-100 text-slate-400 px-2 py-0.5 rounded-full">${moves.length} 步</span>
                        </div>
                        <div class="flex flex-wrap gap-1.5 min-h-[24px]">
                            ${moves.length === 0 ? '<span class="text-gray-300 italic text-xs">待命中...</span>' :
                                moves.map(m => `<span class="bg-white px-2 py-1 rounded-lg border border-slate-100 font-bold text-slate-600 text-xs shadow-sm">${dIcons[m.dir]} ${m.steps}</span>`).join('')
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        function checkVictory() {
            if (hasWonCurrentRound) return;
            const pA = pieces['A'], pB = pieces['B'], pC = pieces['C'], pD = pieces['D'];
            const r = pA[0], c = pA[1];
            if (pB[0] === r && pB[1] === c + 1 && pC[0] === r + 1 && pC[1] === c && pD[0] === r + 1 && pD[1] === c + 1) {
                hasWonCurrentRound = true;
                const isNewScheme = saveScheme();
                if (isNewScheme) {
                    showToast("🎉 完美拼合！");
                }
            }
        }

        function saveScheme() {
            const path = JSON.parse(JSON.stringify(currentMoves));
            const trajectory = JSON.parse(JSON.stringify(pieceSpecificMoves));
            const finalPositions = Object.keys(PIECES_CONFIG).reduce((acc, id) => {
                acc[id] = [...pieces[id]];
                return acc;
            }, {});
            const positionKey = JSON.stringify(finalPositions);
            const exists = savedSchemes.some(s => s.positionKey === positionKey);
            if (exists) {
                showToast("该方案已存在，还有新方法嘛？");
                return false;
            }
            savedSchemes.push({ steps: currentMoves.length, path, trajectory, positionKey });
            savedSchemes.sort((a, b) => a.steps - b.steps);
            loadSchemes();
            return true;
        }

        function loadSchemes() {
            const list = document.getElementById('schemes-list');
            if (savedSchemes.length === 0) {
                list.innerHTML = '<div class="text-center py-10 text-gray-300 text-xs italic">未解锁成功记录</div>';
                return;
            }

            list.innerHTML = savedSchemes.map((s, idx) => `
                <div onclick="replay(${idx})" class="group flex items-center justify-between p-3 bg-slate-50 hover:bg-orange-50 rounded-xl cursor-pointer transition-all border border-transparent hover:border-orange-100">
                    <div class="flex flex-col">
                        <span class="font-bold text-slate-700 text-sm">方案 ${idx+1}</span>
                        <span class="text-xs text-slate-400 font-medium">${s.steps} 步完成</span>
                    </div>
                    <span class="opacity-0 group-hover:opacity-100 text-xs bg-orange-500 text-white px-2 py-1 rounded-md transition-opacity">回放</span>
                </div>`).join('');
        }

        function buildTrajectoryFromPath(path) {
            const fallbackTrajectory = { 'A': [], 'B': [], 'C': [], 'D': [] };
            path.forEach(m => {
                if (fallbackTrajectory[m.id]) {
                    fallbackTrajectory[m.id].push({ dir: m.dir, steps: m.steps });
                }
            });
            return fallbackTrajectory;
        }

        async function replay(idx) {
            if (isAnimating || isReplaying) return;
            isReplaying = true;
            const scheme = savedSchemes[idx];
            const path = scheme.path;
            const trajectory = scheme.trajectory || buildTrajectoryFromPath(path);
            const replayMoveIndex = { 'A': 0, 'B': 0, 'C': 0, 'D': 0 };

            showToast("🎬 方案回放中...");
            resetState();
            renderPieces();
            await sleep(800);

            for (const m of path) {
                selectedId = m.id;
                renderPieces();
                await sleep(300);
                await executeMove(m.id, m.dir, m.steps, true);
                const moveIdx = replayMoveIndex[m.id];
                const moveFromTrajectory = trajectory[m.id]?.[moveIdx];
                pieceSpecificMoves[m.id].push(moveFromTrajectory || { dir: m.dir, steps: m.steps });
                replayMoveIndex[m.id] = moveIdx + 1;
                updateHistoryUI();
                await sleep(400);
            }

            selectedId = null;
            isReplaying = false;
            renderPieces();
            showToast("回放完毕");
        }

        function resetGame() {
            if(!isAnimating && !isReplaying) {
                resetState();
                renderPieces();
                showToast("已恢复初始状态");
            }
        }

        function clearSchemes() { 
            if(confirm("确定清空所有成功记录吗？")) { 
                savedSchemes=[]; 
                localStorage.removeItem('bb_puzzle_save'); 
                loadSchemes(); 
            } 
        }

        function showToast(m) { 
            const t=document.getElementById('toast'); 
            t.innerText=m; 
            t.style.display='block'; 
            setTimeout(()=>t.style.display='none', 2000); 
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
        window.onload = init;
    </script>
</body>
</html>
