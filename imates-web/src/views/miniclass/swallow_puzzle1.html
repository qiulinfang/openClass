<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>燕子拼图演示工具</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --board-width: 900px;
      --board-height: 470px;
      --board-scale: 1;
    }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
      background: #eceff3;
      color: #d8dce8;
      min-height: 100vh;
      height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      font-size: 24px; /* 调小标题字号 (原28px) */
      font-weight: 700;
      color: #8f6b11;
      letter-spacing: 4px;
      flex-shrink: 0;
      margin-bottom: 4px;
    }

    /* ─── Main Layout ───────────────────────────────────── */
    .main-layout {
      display: flex;
      flex-direction: row; /* 强制保持横向布局 */
      gap: 12px;
      align-items: stretch;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .grid-wrap {
      position: relative;
      flex: 2 1 0; /* 减小左侧权重 (原 2) */
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border: 1px solid #d7dbe3;
      border-radius: 12px;
      background: #f7f8fa;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      overflow: hidden;
    }

    .right-col {
      flex: 1.2 1 0; /* 增加右侧聊天区权重 (原 1) */
      min-width: 200px; /* 稍微缩小右侧最小宽度以腾出更多空间给左侧 */
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .grid-stage {
      position: relative;
      width: var(--board-width);
      height: var(--board-height);
      flex-shrink: 0;
      transform: scale(var(--board-scale));
      transform-origin: center center;
      will-change: transform;
      border: 2px solid #2e3650;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 6px 32px rgba(0,0,0,0.6);
    }

    .puzzle-grid {
      display: grid;
      grid-template-columns: repeat(10, 90px);
      grid-template-rows: repeat(5, 94px);
    }

    .cell {
      width: 90px;
      height: 94px;
      background-image: url('original_pic.png');
      background-size: 900px 470px;
      position: relative;
    }
    .cell.swallow-origin-empty {
      background-image: none;
      background-color: #ffffff;
    }

    /* ─── Swallow Piece Overlay ─────────────────────────── */
    .swallow-piece {
      position: absolute;
      width: 90px;
      height: 94px;
      background-image: url('original_pic.png');
      background-size: 900px 470px;
      box-shadow: 0 0 0 1px #e03838, 0 0 14px rgba(224,56,56,0.65);
      z-index: 10;
      transition: top 320ms cubic-bezier(0.4, 0, 0.2, 1),
                  left 320ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .swallow-piece.arrived {
      box-shadow: 0 0 0 1px #2ecc71, 0 0 18px rgba(46,204,113,0.85);
      animation: arrivalPulse 0.55s ease 3;
    }
    @keyframes arrivalPulse {
      0%,100% { box-shadow: 0 0 0 1px #2ecc71, 0 0 18px rgba(46,204,113,0.85); }
      50%      { box-shadow: 0 0 0 3px #2ecc71, 0 0 28px rgba(46,204,113,1);   }
    }

    /* ─── SVG Trail ─────────────────────────────────────── */
    .trail-svg {
      position: absolute;
      top: 0; left: 0;
      width: var(--board-width);
      height: var(--board-height);
      pointer-events: none;
      z-index: 20;
    }

    /* ─── Panel layout ──────────────────────────────────── */
    .panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-height: 0;
    }

    .card {
      background: #1e2438;
      border: 1px solid #2e3650;
      border-radius: 6px;
      padding: 12px 16px;
    }

    .card-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #5060a0;
      margin-bottom: 8px;
    }

    .row { display: flex; align-items: center; gap: 8px; }

    input[type="text"] {
      flex: 1;
      padding: 7px 10px;
      background: #141824;
      border: 1px solid #2e3650;
      border-radius: 4px;
      color: #d8dce8;
      font-size: 13px;
      font-family: inherit;
    }
    input:focus { outline: none; border-color: #4060c0; }

    textarea {
      width: 100%;
      background: #141824;
      border: 1px solid #2e3650;
      border-radius: 4px;
      color: #d8dce8;
      font-size: 15px; /* 调小输入框字号 */
      padding: 10px 12px;
      resize: vertical;
      font-family: inherit;
    }
    textarea:focus { outline: none; border-color: #4060c0; }

    .btn {
      padding: 7px 14px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-sm { padding: 5px 11px; font-size: 12px; }
    .btn-blue   { background: #2c5cc8; color: #fff; }
    .btn-blue:hover:not(:disabled)   { background: #2250b8; }
    .btn-green  { background: #1f8c50; color: #fff; }
    .btn-green:hover:not(:disabled)  { background: #177840; }
    .btn-red    { background: #7a2020; color: #ffa0a0; }
    .btn-red:hover:not(:disabled)    { background: #8f2828; }
    .btn-gray   { background: #2e3650; color: #a0a8c0; }
    .btn-gray:hover:not(:disabled)   { background: #3a4468; }
    .btn-amber  { background: #7a4e10; color: #f0c040; }
    .btn-amber:hover:not(:disabled)  { background: #8f5c12; }

    /* ─── Status lines ──────────────────────────────────── */
    .status {
      margin-top: 6px;
      font-size: 12px;
      min-height: 18px;
      line-height: 1.5;
    }
    .status.err  { color: #e05858; }
    .status.ok   { color: #40b870; }
    .status.info { color: #5080c0; }

    /* ─── Spinner ───────────────────────────────────────── */
    .spin {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid #2e3650;
      border-top-color: #4080d0;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      vertical-align: text-bottom;
      margin-right: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── WS indicator dot ──────────────────────────────── */
    .ws-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }
    .ws-dot.disconnected { background: #e05858; }
    .ws-dot.connecting   { background: #f0c040; animation: spin 0.65s linear infinite; }
    .ws-dot.connected    { background: #40b870; }

    /* ─── Chatbot panel ─────────────────────────────────── */
    .chatbot-card {
      background: #ffffff;
      border: 1px solid #d7dbe3;
      border-radius: 6px;
      color: #1f2937;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      position: relative;
    }
    .chatbot-header {
      padding: 8px 14px;
      border-bottom: 1px solid #e5e7eb;
      background: #f8fafc;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }
    .chatbot-header-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #f0c040;
      box-shadow: 0 0 6px rgba(240,192,64,0.6);
    }
    .chatbot-header-label {
      font-size: 18px; /* 调小页眉字号 (原20px) */
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #64748b;
      transition: color 0.2s;
    }
    .chatbot-header-label.err  { color: #e05858; font-weight: 600; letter-spacing: 0; text-transform: none; }
    .chatbot-header-label.ok   { color: #40b870; font-weight: 600; letter-spacing: 0; text-transform: none; }
    .chatbot-header-label.info { color: #5080c0; font-weight: 600; letter-spacing: 0; text-transform: none; }
    .chatbot-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    .chatbot-messages::-webkit-scrollbar { width: 4px; }
    .chatbot-messages::-webkit-scrollbar-track { background: transparent; }
    .chatbot-messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

    /* ─── Onboarding Overlay ────────────────────────────── */
    .input-lock-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #f8fafc;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      border-radius: 0 0 6px 6px;
      transition: opacity 0.3s;
    }
    .input-lock-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .onboarding-title {
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 4px;
    }
    .onboarding-desc {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 12px;
    }
    .onboarding-btn {
      padding: 8px 18px;
      background: #eff6ff;
      color: #3b82f6;
      border: 1px solid #dbeafe;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .onboarding-btn:hover { 
      background: #dbeafe;
      border-color: #3b82f6;
    }
    .onboarding-btn svg { width: 20px; height: 20px; }

    /* ─── Chatbot input footer ───────────────────────────── */
    .chatbot-footer {
      flex-shrink: 0;
      border-top: 1px solid #e5e7eb;
      background: #ffffff;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chatbot-input-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }
    .chatbot-btn-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: flex-end;
    }
    .chatbot-btn-stack .btn {
      min-width: 96px;
      height: 44px;
    }
    .chatbot-input-row textarea {
      flex: 1;
      resize: none;
      border-radius: 8px;
      min-height: 62px;
      max-height: 160px;
      background: #ffffff;
      border-color: #d1d5db;
      color: #111827;
    }
    .chatbot-input-row textarea::placeholder {
      font-size: 14px; /* 调小占位符 */
      color: #94a3b8;
    }

    /* ─── Image Preview ─────────────────────────────────── */
    .image-preview-area {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 12px;
      border-top: 1px solid #e5e7eb;
      background: #f9fafb;
    }
    .image-preview-area.visible { display: flex; }
    .image-item {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #d1d5db;
    }
    .image-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .image-item .remove-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      background: rgba(0,0,0,0.5);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      border: none;
    }
    .chat-bubble-image {
      max-width: 200px;
      border-radius: 8px;
      margin-top: 8px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .chat-bubble-image:hover {
      transform: scale(1.02);
    }

    /* ─── Crop Modal (Drawing Mode) ─── */
    .crop-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 10000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    .crop-modal.visible {
      display: flex;
    }
    .crop-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #cropCanvas {
      display: block;
      cursor: crosshair;
    }
    
    .crop-tools {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 12px 24px;
      border-radius: 40px;
      z-index: 10001;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .crop-tool-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 50%;
      transition: all 0.2s;
    }
    .crop-tool-btn:hover { background: rgba(255, 255, 255, 0.2); }
    .crop-tool-btn svg { width: 24px; height: 24px; }
    .crop-tool-btn.confirm {
      background: #2563eb;
      width: auto;
      padding: 0 20px;
      border-radius: 22px;
      font-weight: bold;
      font-size: 15px;
    }
    .crop-tool-btn.cancel {
      position: absolute;
      top: -80px;
      right: 0;
      background: rgba(0, 0, 0, 0.5);
    }

    /* ─── Image Modal ────────────────────────────────────── */
    .image-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none; /* 防止移动端默认滚动 */
    }
    .image-modal.visible {
      display: flex;
    }
    .image-modal-content {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    .image-modal-content:active {
      cursor: grabbing;
    }
    .image-modal img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      transition: transform 0.1s ease-out;
      user-select: none;
      -webkit-user-drag: none;
    }
    .image-modal-tools {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 10px 20px;
      border-radius: 30px;
      z-index: 10000;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .image-modal-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .image-modal-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .image-modal-btn svg {
      width: 24px;
      height: 24px;
    }
    .image-modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      background: rgba(0, 0, 0, 0.3);
      border: none;
      cursor: pointer;
      border-radius: 50%;
      z-index: 10001;
    }

    /* ─── Toolbar ───────────────────────────────────────── */
    .chatbot-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 12px;
      border-top: 1px solid #e5e7eb;
      background: #f8fafc;
    }
    .toolbar-icon-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .toolbar-icon-btn:hover {
      background: #e2e8f0;
      color: #3b82f6;
    }
    .toolbar-icon-btn svg {
      width: 20px;
      height: 20px;
    }
    /* ─── Replay overlay button (on grid) ───────────────── */

    .chat-row {
      display: flex;
      align-items: flex-end;
      gap: 7px;
    }
    .chat-row.student { flex-direction: row-reverse; }

    .chat-avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .chat-avatar.coach   { background: #eff6ff; color: #3b82f6; border: 1px solid #dbeafe; }
    .chat-avatar.student { background: #f0fdf4; color: #22c55e; border: 1px solid #dcfce7; }

    .chat-bubble {
      max-width: 90%;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 24px; /* 进一步调大聊天气泡字号 (原20px) */
      line-height: 1.5;
      word-break: break-word;
    }
    .chat-bubble.coach {
      background: #dbeafe;
      border: 1px solid #93c5fd;
      color: #000000;
      border-bottom-left-radius: 3px;
    }
    .chat-bubble.coach strong {
      display: inline-block;
      margin: 0 4px;
      padding: 0 8px;
      background-color: #fef3c7;
      border-bottom: 2px solid #f59e0b;
      color: #92400e;
      font-weight: 700;
      border-radius: 4px;
    }

    .replay-btn-inline {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px; 
      padding: 6px 14px;
      background: #f0c040;
      color: #7a4e10;
      border: 1px solid #d9a300;
      border-radius: 8px;
      font-size: 16px; 
      font-weight: 700;
      cursor: pointer;
      width: fit-content;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(240, 192, 64, 0.3);
    }
    .replay-btn-inline:hover {
      background: #ffcf4d;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(240, 192, 64, 0.4);
    }
    .replay-btn-inline:active {
      transform: translateY(0);
    }
    .replay-btn-inline svg {
      width: 18px;
      height: 18px;
    }

    .thinking-bubble {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      background: #f1f5f9;
      border-radius: 12px;
      border-bottom-left-radius: 3px;
      width: fit-content;
    }
    .thinking-dot {
      width: 6px;
      height: 6px;
      background: #94a3b8;
      border-radius: 50%;
      animation: thinking-bounce 1.4s infinite ease-in-out;
    }
    .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes thinking-bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
 
    .chat-bubble.student {
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #000000;
      border-bottom-right-radius: 3px;
    }

    .chat-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    /* ─── Success banner ────────────────────────────────────── */
    .success-banner {
      display: none;
      text-align: center;
      padding: 11px;
      background: linear-gradient(90deg, #ecfdf3, #dcfce7, #ecfdf3);
      border: 1px solid #86efac;
      border-radius: 6px;
      color: #166534;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(134,239,172,0.45);
    }
    .success-banner.in-grid-top {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      min-width: 320px;
      max-width: calc(100% - 24px);
    }
    .success-banner.visible { display: block; }

    /* ─── 移动端字体与间距适配 ─────────────────────────── */
    @media (max-width: 768px) {
      h1 { font-size: 20px; letter-spacing: 2px; }
      .chatbot-header-label { font-size: 16px; }
      .chat-bubble { font-size: 16px; padding: 10px 14px; }
      .sdsf-tab-btn { padding: 4px 12px; font-size: 13px; }
      textarea { font-size: 14px; }
      .btn { font-size: 13px; padding: 6px 14px; }
      .chat-avatar { width: 32px; height: 32px; font-size: 18px; }
    }

  </style>
</head>
<body>

  <!-- ─── Main Layout ────────────────────────────────── -->
  <div class="main-layout">

    <!-- Left: Puzzle Grid -->
    <div class="grid-wrap">
      <div class="success-banner in-grid-top" id="successBanner">🎉 拼图还原成功！燕子已归位！</div>
      <div class="grid-stage" id="gridStage">
        <div class="puzzle-grid" id="puzzleGrid"></div>

  <!-- 隐藏的文件输入框，使用更稳健的隐藏方式 -->
  <input type="file" id="imageInput" accept="image/*" style="position:fixed; top:-500px; left:-100px; width:40px; height:40px; opacity:0.01; z-index:9999;" onchange="handleImageSelect(event)">

  <script>
    // ═══════════════════════════════════════════════════════
    //  Constants
    // ═══════════════════════════════════════════════════════
    const ROWS = 5, COLS = 10;
    const CELL_W = 90;
    const CELL_H = Math.round(CELL_W * (1780 / ROWS) / (3418 / COLS)); // = 94

    // Game coordinates: row 1 = bottom, row 5 = top; col 1 = left, col 10 = right
    const SWALLOW_START = { row: 1, col: 1 };
    const TARGET        = { row: 3, col: 5 };

    // --- API Configuration (New) ---
    const API_BASE = 'https://kelvin-cosin.cloud/test/api'; // 替换为真实的 Agent 地址
    let THREAD_ID = `t_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`;
    const USER_ID = 'kelvin';
    const CANVAS_ID = 'swallow_puzzle_1';

    // 从 URL 参数获取用户名
    const urlParams = new URLSearchParams(window.location.search);
    const userNameParam = urlParams.get('userName');
    const DISPLAY_NAME = userNameParam || USER_ID;
    console.log('[SDSF] 初始 DISPLAY_NAME:', DISPLAY_NAME);

    let sseSource = null;
    let lastKeepAlive = Date.now(); // 记录最后一次活跃时间
    let isReconnecting = false; // 防止定时器和事件冲突
    let manualClosed = false; // 记录是否是手动关闭，如果是，则停止所有自动重连
    let currentAbortController = null; // 用于取消正在进行的对话请求
    let selectedImages = []; // { file, previewUrl }
    let hasSentFirstImage = false; // 是否已发送过第一张图片

    // --- 原生绘制式裁剪 (支持缩放和平移) ---
    let cropState = {
      img: null,
      rotate: 0,
      zoom: 1,      // 用户缩放
      offsetX: 0,   // 用户平移 X
      offsetY: 0,   // 用户平移 Y
      canvas: null,
      ctx: null,
      isDrawing: false, // 正在画框
      isPanning: false, // 正在平移
      startX: 0,
      startY: 0,
      rect: { x: 0, y: 0, w: 0, h: 0 }, // 绘制的矩形 (Canvas 坐标)
      imgDisplayScale: 1, // 基础 contain 缩放比例
      lastPinchDist: 0
    };

    function openCropModal(src) {
      const modal = document.getElementById('cropModal');
      const canvas = document.getElementById('cropCanvas');
      const container = document.getElementById('cropContainer');
      if (!modal || !canvas || !container) return;

      const image = new Image();
      image.onload = () => {
        modal.style.display = 'flex';
        modal.classList.add('visible');

        cropState.img = image;
        cropState.canvas = canvas;
        cropState.ctx = canvas.getContext('2d');
        cropState.rotate = 0;
        cropState.zoom = 1;
        cropState.offsetX = 0;
        cropState.offsetY = 0;
        cropState.rect = { x: 0, y: 0, w: 0, h: 0 };

        requestAnimationFrame(() => {
          initCropInteraction();
          renderCropCanvas();
        });
      };
      image.src = src;
    }

    /**
     * 关闭裁剪对话框
     */
    function closeCropModal() {
      const modal = document.getElementById('cropModal');
      if (modal) {
        modal.style.display = 'none';
        modal.classList.remove('visible');
      }
      cropState.img = null;
    }

    function renderCropCanvas() {
      const { img, canvas, ctx, rotate, zoom, offsetX, offsetY, rect } = cropState;
      if (!img || !canvas || !ctx) return;

      const container = document.getElementById('cropContainer');
      canvas.width = container.clientWidth || window.innerWidth;
      canvas.height = container.clientHeight || window.innerHeight;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // 1. 计算基础 contain 缩放
      const isVertical = (rotate / 90) % 2 !== 0;
      const srcW = isVertical ? img.height : img.width;
      const srcH = isVertical ? img.width : img.height;
      const baseScale = Math.min(canvas.width / srcW, canvas.height / srcH);
      cropState.imgDisplayScale = baseScale;

      // 2. 绘制图片 (应用缩放、旋转、平移)
      ctx.save();
      ctx.translate(canvas.width / 2 + offsetX, canvas.height / 2 + offsetY);
      ctx.rotate((rotate * Math.PI) / 180);
      ctx.scale(baseScale * zoom, baseScale * zoom);
      ctx.drawImage(img, -img.width / 2, -img.height / 2);
      ctx.restore();

      // 3. 绘制遮罩层
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      if (rect.w !== 0 && rect.h !== 0) {
        ctx.beginPath();
        ctx.rect(0, 0, canvas.width, canvas.height);
        ctx.moveTo(rect.x, rect.y);
        ctx.lineTo(rect.x, rect.y + rect.h);
        ctx.lineTo(rect.x + rect.w, rect.y + rect.h);
        ctx.lineTo(rect.x + rect.w, rect.y);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 2;
        ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
      } else {
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // 添加滑动裁剪提示
        ctx.fillStyle = '#fff';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('请滑动手指，选择裁剪区域', canvas.width / 2, canvas.height / 2);
      }
    }

    function rotateCrop(deg) {
      cropState.rotate = (cropState.rotate + deg) % 360;
      cropState.rect = { x: 0, y: 0, w: 0, h: 0 }; // 旋转后重置选择
      renderCropCanvas();
    }

    function initCropInteraction() {
      const canvas = cropState.canvas;
      
      const getPos = (e) => {
        const r = canvas.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return { x: t.clientX - r.left, y: t.clientY - r.top };
      };

      // 鼠标滚轮缩放
      canvas.onwheel = (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        cropState.zoom *= delta;
        cropState.zoom = Math.max(0.1, Math.min(20, cropState.zoom));
        renderCropCanvas();
      };

      canvas.onmousedown = (e) => {
        const pos = getPos(e);
        if (e.button === 0) { // 左键：画框
          cropState.isDrawing = true;
          cropState.startX = pos.x;
          cropState.startY = pos.y;
          cropState.rect = { x: pos.x, y: pos.y, w: 0, h: 0 };
        } else { // 右键或中键：平移
          cropState.isPanning = true;
          cropState.startX = e.clientX - cropState.offsetX;
          cropState.startY = e.clientY - cropState.offsetY;
        }
      };

      window.onmousemove = (e) => {
        if (cropState.isDrawing) {
          const pos = getPos(e);
          cropState.rect = {
            x: Math.min(pos.x, cropState.startX),
            y: Math.min(pos.y, cropState.startY),
            w: Math.abs(pos.x - cropState.startX),
            h: Math.abs(pos.y - cropState.startY)
          };
          renderCropCanvas();
        } else if (cropState.isPanning) {
          cropState.offsetX = e.clientX - cropState.startX;
          cropState.offsetY = e.clientY - cropState.startY;
          renderCropCanvas();
        }
      };

      window.onmouseup = () => {
        cropState.isDrawing = false;
        cropState.isPanning = false;
      };

      canvas.oncontextmenu = (e) => e.preventDefault(); // 禁用右键菜单

      // 触摸事件 (移动端)
      canvas.ontouchstart = (e) => {
        if (e.touches.length === 1) {
          const pos = getPos(e);
          cropState.isDrawing = true;
          cropState.startX = pos.x;
          cropState.startY = pos.y;
          cropState.rect = { x: pos.x, y: pos.y, w: 0, h: 0 };
        } else if (e.touches.length === 2) {
          cropState.isDrawing = false;
          cropState.isPanning = true;
          cropState.lastPinchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          cropState.startX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - cropState.offsetX;
          cropState.startY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - cropState.offsetY;
        }
      };

      canvas.ontouchmove = (e) => {
        e.preventDefault();
        if (e.touches.length === 1 && cropState.isDrawing) {
          const pos = getPos(e);
          cropState.rect = {
            x: Math.min(pos.x, cropState.startX),
            y: Math.min(pos.y, cropState.startY),
            w: Math.abs(pos.x - cropState.startX),
            h: Math.abs(pos.y - cropState.startY)
          };
          renderCropCanvas();
        } else if (e.touches.length === 2 && cropState.isPanning) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          // 缩放
          const ratio = dist / cropState.lastPinchDist;
          cropState.zoom *= ratio;
          cropState.lastPinchDist = dist;
          // 平移
          const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          cropState.offsetX = centerX - cropState.startX;
          cropState.offsetY = centerY - cropState.startY;
          renderCropCanvas();
        }
      };

      canvas.ontouchend = () => {
        cropState.isDrawing = false;
        cropState.isPanning = false;
      };
    }

    function confirmCrop() {
      const { img, rotate, zoom, offsetX, offsetY, rect, canvas } = cropState;
      if (!img || rect.w < 5 || rect.h < 5) {
        alert('请先拖拽选择一个有效的裁剪区域');
        return;
      }

      // 1. 创建最终输出画布
      const out = document.createElement('canvas');
      out.width = rect.w * (2048 / Math.max(rect.w, rect.h)); // 保持高质量
      if (out.width > 2048) out.width = 2048;
      out.height = rect.h * (out.width / rect.w);
      
      const oCtx = out.getContext('2d');
      oCtx.imageSmoothingEnabled = true;
      oCtx.imageSmoothingQuality = 'high';

      // 2. 直接从预览画布裁剪 (最简单且兼容缩放平移的方式)
      // 注意：这种方式依赖预览画布的当前像素。如果想要极高精度，需要复杂的坐标逆矩阵变换，
      // 但对于 99% 的场景，从预览画布直接提取已经足够。
      oCtx.drawImage(
        canvas,
        rect.x, rect.y, rect.w, rect.h,
        0, 0, out.width, out.height
      );

      const dataUrl = out.toDataURL('image/jpeg', 0.9);
      selectedImages = [{ file: null, previewUrl: dataUrl }];
      
      closeCropModal();
      setTimeout(() => sendUserInput(), 150);
    }
    // ----------------------

    /**
     * 生成新的会话 ID
     */
    function generateThreadId() {
      return `t_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`;
    }

    /**
     * 稳健触发图片选择逻辑
     */
    function triggerImageInput() {
      console.log(`${getLogPrefix()} [UI] 尝试触发图片选择 (triggerImageInput)`);
      
      // 获取原生桥接对象（兼容大小写）
      const bridge = window.AndroidBridge || window.androidBridge;
      
      // 1. 优先尝试调用 Android 原生桥接方法（如果存在）
      if (bridge) {
        // 根据 WebAppInterface.java 实际定义的方法名
        if (typeof bridge.captureImageFromCamera === 'function') {
          console.log(`${getLogPrefix()} [UI] 检测到 AndroidBridge，调用 captureImageFromCamera`);
          bridge.captureImageFromCamera();
          return;
        } else if (typeof bridge.selectImageFromGallery === 'function') {
          console.log(`${getLogPrefix()} [UI] 检测到 AndroidBridge，调用 selectImageFromGallery`);
          bridge.selectImageFromGallery();
          return;
        } else if (typeof bridge.takePhoto === 'function') {
          console.log(`${getLogPrefix()} [UI] 检测到 AndroidBridge，调用 takePhoto`);
          bridge.takePhoto();
          return;
        }
      }

      // 2. 备选方案：触发隐藏的 input[type="file"]
      const input = document.getElementById('imageInput');
      if (input) {
        console.log(`${getLogPrefix()} [UI] 触发 input.click()`);
        input.click();
      } else {
        console.error(`${getLogPrefix()} [UI] 找不到 imageInput 元素`);
      }
    }

    const DIR_DELTA = {
      '上': { dr:  1, dc:  0 },
      '下': { dr: -1, dc:  0 },
      '左': { dr:  0, dc: -1 },
      '右': { dr:  0, dc:  1 },
    };

    const CORNER_OFF = {
      '左上角': { dx: 0,      dy: 0      },
      '右上角': { dx: CELL_W, dy: 0      },
      '左下角': { dx: 0,      dy: CELL_H },
      '右下角': { dx: CELL_W, dy: CELL_H },
    };

    // ═══════════════════════════════════════════════════════
    //  Watchdog Timer (保活监控定时器)
    // ═══════════════════════════════════════════════════════
    setInterval(() => {
      const now = Date.now();
      const idleTime = now - lastKeepAlive;
      
      // 如果断开了，或者超过 45 秒没收到心跳包
      if (!wsConnected || idleTime > 45000) {
        if (!isReconnecting && !manualClosed) {
          console.log(`${getLogPrefix()} [Watchdog] 检测到连接异常(空闲${Math.round(idleTime/1000)}s)，启动保活重连...`);
          isReconnecting = true;
          initCanvasSSE();
        }
      }
    }, 5000); // 每 5 秒检查一次

    // ═══════════════════════════════════════════════════════
    //  Visibility & Reconnect Logic (处理息屏唤醒)
    // ═══════════════════════════════════════════════════════
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        const now = Date.now();
        const idleTime = now - lastKeepAlive;
        
        console.log(`${getLogPrefix()} [系统] 页面重回前台。当前状态: ${wsConnected ? '已连接' : '断开'}, 手动关闭: ${manualClosed}, 空闲时间: ${Math.round(idleTime/1000)}s`);

        // 如果手动关闭了，不再执行亮屏自动重连
        if (manualClosed) return;

        // 如果已经断开，或者超过45秒没有收到任何心跳/数据，强制重连
        if (!wsConnected || idleTime > 45000) {
          console.log(`${getLogPrefix()} [系统] 亮屏自动重连中...`);
          initCanvasSSE();
        }
      }
    });

    // ═══════════════════════════════════════════════════════
    //  Playback State
    // ═══════════════════════════════════════════════════════
    let pos                  = { ...SWALLOW_START };
    let flatSteps            = [];
    let moveEnds             = [];
    let stepIdx              = 0;
    let playing              = false;
    let playTimer            = null;
    let trail                = [];
    let activeCorner         = null;
    const speed              = 750;
    let pendingCoachMessages = [];

    // ═══════════════════════════════════════════════════════
    //  API Layer (Restructured based on canvas_router_api.md)
    // ═══════════════════════════════════════════════════════

    /**
     * 获取带时间戳的日志前缀
     */
    function getLogPrefix() {
      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}.${now.getMilliseconds().toString().padStart(3, '0')}`;
      return `[${timeStr}]`;
    }

    /**
     * 初始化 SSE 连接接收指令
     */
    function initCanvasSSE() {
      // 1. 检查是否已经有一个正常的连接，防止重复创建
      if (sseSource && sseSource.readyState === 1) {
        console.log(`${getLogPrefix()} [SSE] 检查到已有活跃连接，跳过创建`);
        wsConnected = true;
        isReconnecting = false;
        return;
      }

      // 2. 彻底清理旧连接
      if (sseSource) {
        console.log(`${getLogPrefix()} [SSE] 清理旧连接对象`);
        sseSource.onopen = null;
        sseSource.onmessage = null;
        sseSource.onerror = null;
        sseSource.close();
        sseSource = null;
      }

      isReconnecting = true; // 锁定重连状态

      const sseUrl = `${API_BASE}/canvas/sse/${THREAD_ID}`;
      console.log(`${getLogPrefix()} [接口请求] SSE 建立连接: GET ${sseUrl}`);
      sseSource = new EventSource(sseUrl);

      sseSource.onopen = () => {
        console.log(`${getLogPrefix()} [接口响应] SSE 连接成功 ✅`);
        wsConnected = true;
        isReconnecting = false; // 解锁
        lastKeepAlive = Date.now(); // 关键修复：连接成功时立即刷新活跃时间，防止 Watchdog 误判
        updateSendButtonState();
      };

      sseSource.onmessage = (e) => {
        lastKeepAlive = Date.now(); // 刷新活跃时间
        if (e.data === ': keepalive') return;
        
        console.log(`${getLogPrefix()} [接口数据] SSE 收到消息:`, e.data);
        try {
          const data = JSON.parse(e.data);
          if (data.cmd_id && data.command) {
            handleCanvasCommand(data.cmd_id, data.command);
          }
        } catch (err) {
          console.error(`${getLogPrefix()} [SSE] 解析数据失败`, err, e.data);
        }
      };

      sseSource.onerror = (e) => {
        console.error(`${getLogPrefix()} [SSE] 连接错误或中断:`, e);
        wsConnected = false;
        updateSendButtonState();
        
        // 关闭旧连接
        if (sseSource) {
          sseSource.close();
          sseSource = null;
        }

        // 移除 setStatus 显式文字提示，改为后台静默重连
        console.log(`${getLogPrefix()} [SSE] 助手连接已断开，准备自动重连...`);
        
        // 如果是手动关闭的，不要启动定时器自动重连
        if (manualClosed) return;

        // 3秒后尝试重连
        setTimeout(() => {
          if (!sseSource) {
            console.log(`${getLogPrefix()} [SSE] 正在尝试自动重连...`);
            initCanvasSSE();
          }
        }, 3000);
      };
    }

    /**
     * 处理具体的画布指令
     */
    function handleCanvasCommand(cmd_id, command) {
      console.log(`${getLogPrefix()} [SSE] 收到指令并加入队列:`, cmd_id);
      pendingCommands.push({ cmd_id, command });
      
      // 只要当前没有正在执行的指令且不在播放中，就立刻开始执行（不再等待对话响应结束）
      if (!currentExecutingCommand && !playing) {
        processNextCommand();
      }
    }

    /**
     * 从队列中取出并执行下一个指令
     */
    function processNextCommand() {
      if (pendingCommands.length === 0) return;
      if (playing) return;

      const { cmd_id, command } = pendingCommands.shift();
      executeCanvasCommand(cmd_id, command);
    }

    /**
     * 实际执行画布指令逻辑
     */
    function executeCanvasCommand(cmd_id, command) {
      const { action, params } = command;
      currentExecutingCommand = { cmd_id, command };
      
      if (action === 'demo_moves') {
        const currentPlanJson = JSON.stringify(params);
        lastPlanJson = currentPlanJson;
        
        const movesDesc = params.moves.map(m => `向${m.dir}走${m.steps}步`).join('，然后');
        let displayMsg = `我先${movesDesc}。`;
        
        if (params.highlight) {
          displayMsg += `（小技巧：我们可以看着方块的<strong>${params.highlight}的点</strong>来数格数哦！）`;
        }
        
        // 直接创建一个独立的指令气泡
        appendChatMessage('coach', displayMsg, true, currentPlanJson);

        if (loadPlan(currentPlanJson)) {
          setStatus('llmStatus', 'ok', '收到演示指令，正在播放…');
          togglePlay();
        } else {
          sendCallback(cmd_id, 'error', '解析移动指令失败', { 
            result: 'no',
            current_position: { x: pos.col, y: pos.row },
            target_position: { x: TARGET.col, y: TARGET.row }
          });
          currentExecutingCommand = null;
          processNextCommand();
        }
      } else {
        console.warn('[Canvas] 未知 action:', action);
        sendCallback(cmd_id, 'error', `未知指令 action: ${action}`, { 
          result: 'no',
          current_position: { x: pos.col, y: pos.row },
          target_position: { x: TARGET.col, y: TARGET.row }
        });
        currentExecutingCommand = null;
        processNextCommand();
      }
    }

    /**
     * 执行结果回调给 Agent
     */
    async function sendCallback(cmdId, status, message = '', data = {}) {
      const url = `${API_BASE}/canvas/callback`;
      const body = {
        cmd_id: cmdId,
        status: status,
        message: message,
        data: data
      };
      
      console.log(`${getLogPrefix()} [接口请求] Callback 发送: POST ${url}`, body);
      
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const result = await response.json();
        console.log(`${getLogPrefix()} [接口响应] Callback 结果:`, result);
      } catch (err) {
        console.error(`${getLogPrefix()} [接口错误] Callback 发送失败`, err);
      }
    }

    /**
     * 处理图片选择
     */
    function handleImageSelect(e) {
      const files = e.target.files;
      if (!files || files.length === 0) return;

      const filePromises = Array.from(files).map(file => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (event) => {
            resolve({
              file: file,
              previewUrl: event.target.result
            });
          };
          reader.readAsDataURL(file);
        });
      });

      Promise.all(filePromises).then(newImages => {
        selectedImages = newImages; // 替换当前选择，直接发送
        sendUserInput();
      });
      
      e.target.value = ''; // 清空以支持重复选择同一文件
    }

    /**
     * 上传单张图片并获取 URL
     */
    async function uploadSingleImage(imageObj) {
      console.log(`${getLogPrefix()} [Upload] 准备上传图片, 大小约为: ${Math.round(imageObj.previewUrl.length * 0.75 / 1024)} KB`);
      const formData = new FormData();
      
      if (imageObj.file) {
        formData.append('file', imageObj.file);
      } else if (imageObj.previewUrl && imageObj.previewUrl.startsWith('data:')) {
        // 处理 Base64 转换
        console.log(`${getLogPrefix()} [Upload] 检测到 Base64 数据，正在转换为 Blob`);
        const byteString = atob(imageObj.previewUrl.split(',')[1]);
        const mimeString = imageObj.previewUrl.split(',')[0].split(':')[1].split(';')[0];
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) {
          ia[i] = byteString.charCodeAt(i);
        }
        const blob = new Blob([ab], {type: mimeString});
        formData.append('file', blob, 'camera_capture.jpg');
      }

      // 注意：根据 getRouteBaseMap，/api/images/upload 映射到 ADDRESS_CATALOG.CLIENT_HTTP (https://www.imates.com.cn:8200)
      // 如果是在本地测试，可能需要直接使用完整 URL
      const uploadUrl = 'https://www.imates.com.cn:8200/api/images/upload';
      
      try {
        const response = await fetch(uploadUrl, {
          method: 'POST',
          body: formData
        });
        const result = await response.json();
        if (result.success && result.data && result.data.path) {
          // 拼接完整 URL
          return `https://www.imates.com.cn${result.data.path}`;
        }
        throw new Error(result.message || '上传失败');
      } catch (err) {
        console.error('[Upload] 图片上传错误:', err);
        throw err;
      }
    }

    /**
     * 发送用户对话内容到画布助手
     */
    async function sendUserInput() {
      if (waitingResponse || playing) return;

      // 发送前双重检查：如果 SSE 连接断了，且不是手动关闭的，立即尝试重连
      if ((!wsConnected || !sseSource) && !manualClosed) {
        console.log(`${getLogPrefix()} [系统] 发送消息前检测到连接异常，正在尝试重连助手...`);
        initCanvasSSE();
      }

      const text = document.getElementById('nlInput').value.trim();
      const hasImages = selectedImages.length > 0;
      
      if (!text && !hasImages) { 
        setStatus('llmStatus', 'err', '请输入内容或上传图片'); 
        return; 
      }

      // 1. 展示用户消息
      const userBubble = appendChatMessage('student', text);
      if (hasImages) {
        selectedImages.forEach(img => {
          const imgEl = document.createElement('img');
          imgEl.src = img.previewUrl;
          imgEl.className = 'chat-bubble-image';
          imgEl.onclick = () => openImageModal(img.previewUrl);
          userBubble.querySelector('.chat-bubble').appendChild(imgEl);
        });
      }

      // 清空输入
      const currentImages = [...selectedImages];
      document.getElementById('nlInput').value = '';
      selectedImages = [];
      renderImagePreviews();
      
      waitingResponse = true;
      updateSendButtonState();
      showThinkingBubble();
      let currentResponseIsRight = false;

      // 2. 上传图片（如果有）
      let imageUrls = [];
      if (hasImages) {
        try {
          setStatus('llmStatus', 'info', '正在上传图片...');
          const uploadPromises = currentImages.map(img => uploadSingleImage(img));
          imageUrls = await Promise.all(uploadPromises);
          console.log(`${getLogPrefix()} [上传成功] 图片 URLs:`, imageUrls);
          
          // 如果是第一次发送图片，解锁输入框
          if (!hasSentFirstImage) {
            hasSentFirstImage = true;
            const overlay = document.getElementById('inputLockOverlay');
            if (overlay) overlay.classList.add('hidden');
          }
        } catch (err) {
          console.error('[Bot] 图片上传失败', err);
          removeThinkingBubble();
          setStatus('llmStatus', 'err', '图片上传失败，请重试');
          waitingResponse = false;
          updateSendButtonState();
          return;
        }
      }

      const url = `${API_BASE}/canvas_bot`;
      const body = {
        inputs: {
          message: text,
          name: DISPLAY_NAME,
          image_url: imageUrls,
          canvas_id: CANVAS_ID
        },
        config: {
          configurable: {
            thread_id: THREAD_ID,
            user_id: USER_ID
          }
        }
      };

      console.log(`${getLogPrefix()} [接口请求] ChatBot 发送: POST ${url}`, body);

      // 如果之前有正在进行的请求，先取消它
      if (currentAbortController) {
        currentAbortController.abort();
      }
      currentAbortController = new AbortController();

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: currentAbortController.signal
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let coachBubble = null; // 用于本次对话的独立文字气泡
        let fullContent = "";
        let hasReportedInThisTurn = false; // 标记本轮对话是否已经触发过 SDSF 上报

        console.log(`${getLogPrefix()} [接口响应] ChatBot 流式传输开始...`);

        while (true) {
          const { value, done } = await reader.read();
          if (done) {
            console.log(`${getLogPrefix()} [接口完成] ChatBot 流读取完成`);
            break;
          }
          
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');
          
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              console.log(`${getLogPrefix()} [接口数据] ChatBot Chunk:`, line);
              try {
                const data = JSON.parse(line.slice(6));
                
                // 1. 渲染文本内容
                if (data.content) {
                  const isSpecificAnswer = data.content.includes("the answer is right");
                  const isBubbleBreak = data.content.toLowerCase().includes("bubble");
                  
                  if (isSpecificAnswer) {
                    console.log(`${getLogPrefix()} [Bot] 识别到特定判定内容，不进行渲染并标记成功`);
                    currentResponseIsRight = true;
                    continue;
                  }

                  if (isBubbleBreak) {
                    console.log('[Bot] 识别到 bubble 关键词，准备切分气泡');
                    fullContent = "";
                    coachBubble = null;
                  } else {
                    removeThinkingBubble();
                    fullContent += data.content;
                    
                    if (!coachBubble) {
                      coachBubble = appendChatMessage('coach', fullContent, false);
                    } else {
                      updateCoachBubbleContent(coachBubble, fullContent);
                    }
                  }
                }

                // 2. 检查流是否应该结束 (根据 history_messages 或特定的结束标识)
                if (data.history_messages && Array.isArray(data.history_messages) && data.history_messages.length > 0) {
                   
                   // --- 在整个流结束时，判定是否为整个会话的“第一次”交互 ---
                   if (DISPLAY_NAME && !hasReportedInThisTurn) {
                     console.log('[Bot] 收到历史消息，准备结束流接收并判定上报');
                     hasReportedInThisTurn = true;
                     
                     // 如果 history_messages 的长度等于 2，说明这是本会话的【第一轮完整对话】(1条用户消息 + 1条AI消息)
                     // 结构示例：[ {type: "human", ...}, {type: "ai", ...} ]
                     if (data.history_messages.length === 2) {
                       const isSuccess = currentResponseIsRight; // 只有在这第一轮对话中检测到关键词才算成功
                       console.log(`${getLogPrefix()} [SDSF] 首次互动结束，上报状态 isSuccess: ${isSuccess}`);
                       fetch('https://www.imates.com.cn/openclassSDSF/api/sdsf/submit', {
                         method: 'POST',
                         headers: { 'Content-Type': 'application/json' },
                         body: JSON.stringify({
                           studentId: DISPLAY_NAME,
                           studentName: DISPLAY_NAME,
                           isSuccess: isSuccess 
                         })
                       }).catch(e => console.error('[SDSF] 首次互动上报失败:', e));
                     } else {
                       console.log(`${getLogPrefix()} [SDSF] 当前 history_messages 长度为 ${data.history_messages.length}，非首次互动，跳过上报`);
                     }
                   }
                   // ---------------------------------------
                }
              } catch (e) {}
            }
          }
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          console.log(`${getLogPrefix()} [Bot] 旧请求已取消，停止后续渲染逻辑`);
          return;
        }
        console.error('[Bot] 请求失败', err);
        removeThinkingBubble();
        setStatus('llmStatus', 'err', '对话助手响应失败');
      } finally {
        waitingResponse = false;
        updateSendButtonState();

        // 对话响应结束，自动触发处理指令队列
        processNextCommand();
      }
    }

    /**
     * 更新已有教练气泡的内容
     */
    function updateCoachBubbleContent(bubbleEl, text) {
      const bubble = bubbleEl.querySelector('.chat-bubble.coach');
      if (!bubble) return;
      
      let formattedText = text.replace(/(（[^）]+）|_{2,})/g, '<strong>$1</strong>');
      const textContainer = bubble.querySelector('div:first-child');
      if (textContainer) {
        textContainer.innerHTML = formattedText;
      }
      
      // 保持滚动到底部
      const container = document.getElementById('chatMessages');
      if (container) {

      }
    }

    // ═══════════════════════════════════════════════════════
    //  Legacy WebSocket Logic (Replaced by API Layer)
    // ═══════════════════════════════════════════════════════
    let wsConnected      = true;
    let waitingResponse  = false;
    let thinkingMsgEl    = null;
    let lastPlanJson     = null;
    let pendingCommands  = []; // 存储待执行的指令队列 { cmd_id, command }
    let currentExecutingCommand = null; // 当前正在执行的指令

    // 图片预览缩放与平移状态
    let imgModalState = {
      scale: 1,
      translateX: 0,
      translateY: 0,
      rotate: 0,
      isDragging: false,
      startX: 0,
      startY: 0,
      lastPinchDistance: 0 // 用于记录双指缩放的距离
    };

    function updateImageTransform() {
      const img = document.getElementById('modalImg');
      if (img) {
        // 先旋转，再平移和缩放，避免坐标轴随旋转而改变导致平移方向错误
        img.style.transform = `translate(${imgModalState.translateX}px, ${imgModalState.translateY}px) scale(${imgModalState.scale}) rotate(${imgModalState.rotate}deg)`;
      }
    }

    function zoomImage(delta) {
      const newScale = imgModalState.scale + delta;
      if (newScale >= 0.2 && newScale <= 10) {
        imgModalState.scale = newScale;
        updateImageTransform();
      }
    }

    function rotateImage(delta) {
      imgModalState.rotate = imgModalState.rotate + delta;
      updateImageTransform();
    }

    function resetImageZoom() {
      imgModalState.scale = 1;
      imgModalState.translateX = 0;
      imgModalState.translateY = 0;
      imgModalState.rotate = 0;
      updateImageTransform();
    }

    // 初始化图片预览交互
    function initImageModalEvents() {
      const content = document.getElementById('imageModalContent');
      if (!content) return;

      // 滚轮缩放
      content.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.1 : 0.1;
        zoomImage(delta);
      }, { passive: false });

      // 双击重置
      content.addEventListener('dblclick', (e) => {
        resetImageZoom();
      });

      // 拖拽平移
      content.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return; // 仅左键
        imgModalState.isDragging = true;
        imgModalState.startX = e.clientX - imgModalState.translateX;
        imgModalState.startY = e.clientY - imgModalState.translateY;
        content.style.cursor = 'grabbing';
      });

      window.addEventListener('mousemove', (e) => {
        if (!imgModalState.isDragging) return;
        imgModalState.translateX = e.clientX - imgModalState.startX;
        imgModalState.translateY = e.clientY - imgModalState.startY;
        updateImageTransform();
      });

      window.addEventListener('mouseup', () => {
        imgModalState.isDragging = false;
        if (content) content.style.cursor = 'grab';
      });

      // 移动端触摸处理
      content.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          // 单指拖拽
          imgModalState.isDragging = true;
          imgModalState.startX = e.touches[0].clientX - imgModalState.translateX;
          imgModalState.startY = e.touches[0].clientY - imgModalState.translateY;
        } else if (e.touches.length === 2) {
          // 双指缩放初始化
          imgModalState.isDragging = false;
          imgModalState.lastPinchDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      });

      content.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && imgModalState.isDragging) {
          // 单指平移
          e.preventDefault();
          imgModalState.translateX = e.touches[0].clientX - imgModalState.startX;
          imgModalState.translateY = e.touches[0].clientY - imgModalState.startY;
          updateImageTransform();
        } else if (e.touches.length === 2) {
          // 双指缩放
          e.preventDefault();
          const distance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          if (imgModalState.lastPinchDistance > 0) {
            const ratio = distance / imgModalState.lastPinchDistance;
            const delta = (ratio - 1) * 0.5; // 适当减小缩放敏感度
            zoomImage(delta);
          }
          imgModalState.lastPinchDistance = distance;
        }
      }, { passive: false });

      content.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          imgModalState.lastPinchDistance = 0;
        }
        if (e.touches.length === 0) {
          imgModalState.isDragging = false;
        }
      });
    }

    function updateSendButtonState() {
      const input = document.getElementById('nlInput');
      const btn = document.getElementById('btnSend');
      if (!btn) return;
      const hasText = !!(input && input.value.trim());
      const hasImages = selectedImages.length > 0;
      btn.disabled = !wsConnected || waitingResponse || (!hasText && !hasImages);
    }

    function handleInputKeydown(e) {

    }

        let formattedText = text.replace(/(（[^）]+）|_{2,})/g, '<strong>$1</strong>');
        bubble.innerHTML = `<div>${formattedText}</div>`;

        if (showReplay && planJson) {
          addReplayButtonToBubble(bubble, planJson);
        }
      } else {
        bubble.textContent = text;
      }

      row.appendChild(avatar);
      row.appendChild(bubble);

      // 关键修改：如果当前有“思考中”气泡，则将新消息插入到它之前
      if (thinkingMsgEl && container.contains(thinkingMsgEl)) {
        container.insertBefore(row, thinkingMsgEl);
      } else {
        container.appendChild(row);
      }

      container.scrollTop = container.scrollHeight;
      return row;
    }

    /**
     * 向气泡添加重播按钮
     */
    function addReplayButtonToBubble(bubbleEl, planJson) {
      // 检查是否已经存在按钮，避免重复添加
      if (bubbleEl.querySelector('.replay-btn-inline')) return;

      const replayBtn = document.createElement('button');
      replayBtn.className = 'replay-btn-inline';
      replayBtn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span>点击查看演示</span>
      `;
      replayBtn.onclick = (e) => {
        e.stopPropagation();
        if (playing) return;
        if (loadPlan(planJson)) {
          togglePlay();
        }
      };
      bubbleEl.appendChild(replayBtn);
    }

    function showCoachMessage(text) {
      appendChatMessage('coach', text, false);
    }

    function showThinkingBubble() {
      const container = document.getElementById('chatMessages');
      if (!container) return;

      const empty = document.getElementById('chatEmpty');
      if (empty) empty.remove();

      const row = document.createElement('div');
      row.className = 'chat-row coach thinking-row';

      const avatar = document.createElement('div');
      avatar.className = 'chat-avatar coach';
      avatar.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:60%; height:60%;">
          <path d="M12 8V4H8"></path>
          <rect width="16" height="12" x="4" y="8" rx="2"></rect>
          <path d="M2 14h2"></path>
          <path d="M20 14h2"></path>
          <path d="M15 13v2"></path>
          <path d="M9 13v2"></path>
        </svg>`;

      const bubble = document.createElement('div');
      bubble.className = 'thinking-bubble';
      bubble.innerHTML = `
        <div class="thinking-dot"></div>
        <div class="thinking-dot"></div>
        <div class="thinking-dot"></div>
      `;

      row.appendChild(avatar);
      row.appendChild(bubble);
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
      thinkingMsgEl = row;
    }

    function removeThinkingBubble() {
      if (thinkingMsgEl) {
        thinkingMsgEl.remove();
        thinkingMsgEl = null;
      }
    }

    function _enableSendBtn() {
      waitingResponse = false;
      updateSendButtonState();
    }

    function _setWsDot(_state) { /* UI element removed */ }

    function _setWsText(_cls, _msg) { /* UI element removed */ }

    // ═══════════════════════════════════════════════════════
    //  Grid Initialization
    // ═══════════════════════════════════════════════════════
    function buildGrid() {
      const grid = document.getElementById('puzzleGrid');
      grid.innerHTML = '';
      for (let dr = 0; dr < ROWS; dr++) {
        for (let dc = 0; dc < COLS; dc++) {
          const gameRow = ROWS - dr;
          const gameCol = dc + 1;
          const div = document.createElement('div');
          div.className = 'cell';
          div.style.backgroundPosition =
            `${-(gameCol - 1) * CELL_W}px ${-(ROWS - gameRow) * CELL_H}px`;
          if (gameRow === TARGET.row && gameCol === TARGET.col) {
            div.classList.add('empty-target');
            div.id = 'targetCell';
          }
          if (gameRow === SWALLOW_START.row && gameCol === SWALLOW_START.col) {
            div.id = 'swallowStartCell';
          }
          grid.appendChild(div);
        }
      }
    }

    // ═══════════════════════════════════════════════════════
    //  Swallow Piece Rendering
    // ═══════════════════════════════════════════════════════
    function renderSwallow(animate = true) {
      const el = document.getElementById('swallowPiece');
      el.style.transition = animate
        ? `top ${Math.round(speed * 0.82)}ms cubic-bezier(0.4,0,0.2,1),`
          + ` left ${Math.round(speed * 0.82)}ms cubic-bezier(0.4,0,0.2,1)`
        : 'none';
      el.style.top  = `${(ROWS - pos.row) * CELL_H}px`;
      el.style.left = `${(pos.col - 1) * CELL_W}px`;
      el.style.backgroundPosition =
        `${-(SWALLOW_START.col - 1) * CELL_W}px ${-(ROWS - SWALLOW_START.row) * CELL_H}px`;
      syncSwallowStartCellFill();
    }

    function resetSwallowToStart() {
      stopPlay(false); // 停止当前所有播放
      pos = { ...SWALLOW_START };
      stepIdx = 0;
      clearTrail();
      
      const el = document.getElementById('swallowPiece');
      if (el) {
        // 1. 彻底禁用过渡动画
        el.style.transition = 'none';
        // 2. 立即更新坐标
        el.style.top  = `${(ROWS - pos.row) * CELL_H}px`;
        el.style.left = `${(pos.col - 1) * CELL_W}px`;
        // 3. 强制浏览器重绘 (reflow)，确保 transition: none 立即生效
        void el.offsetHeight;
      }
      
      syncSwallowStartCellFill();
      document.getElementById('targetCell')?.classList.add('empty-target');
      document.getElementById('swallowPiece').classList.remove('arrived');
      document.getElementById('successBanner').classList.remove('visible');
    }

    function syncSwallowStartCellFill() {
      const startCell = document.getElementById('swallowStartCell');
      if (!startCell) return;
      const isAtStart = pos.row === SWALLOW_START.row && pos.col === SWALLOW_START.col;
      startCell.classList.toggle('swallow-origin-empty', !isAtStart);
    }

    // ═══════════════════════════════════════════════════════
    //  SVG Trail
    // ═══════════════════════════════════════════════════════
    function cornerPixel(row, col, corner) {
      return {
        x: (col - 1) * CELL_W + CORNER_OFF[corner].dx,
        y: (ROWS - row) * CELL_H + CORNER_OFF[corner].dy,
      };
    }

    function selectedCorner() {
      return activeCorner ?? '';
    }

    function initLiveDot() {
      const svg = document.getElementById('trailSvg');

      const hist = svgEl('g');
      hist.id = 'trailHistory';
      svg.appendChild(hist);

      const glow = svgEl('circle');
      glow.id = 'trailGlow';
      glow.setAttribute('fill', '#f0c040');
      glow.style.display = 'none';
      const ga1 = svgEl('animate');
      ga1.setAttribute('attributeName', 'r');
      ga1.setAttribute('values', '9;15;9');
      ga1.setAttribute('dur', '1.1s');
      ga1.setAttribute('repeatCount', 'indefinite');
      const ga2 = svgEl('animate');
      ga2.setAttribute('attributeName', 'opacity');
      ga2.setAttribute('values', '0.38;0;0.38');
      ga2.setAttribute('dur', '1.1s');
      ga2.setAttribute('repeatCount', 'indefinite');
      glow.appendChild(ga1);
      glow.appendChild(ga2);
      svg.appendChild(glow);

      const dot = svgEl('circle');
      dot.id = 'trailLiveDot';
      dot.setAttribute('fill', '#f0c040');
      dot.setAttribute('stroke', '#fff');
      dot.setAttribute('stroke-width', '1.5');
      dot.style.display = 'none';
      const da = svgEl('animate');
      da.setAttribute('attributeName', 'r');
      da.setAttribute('values', '5;8;5');
      da.setAttribute('dur', '1.1s');
      da.setAttribute('repeatCount', 'indefinite');
      dot.appendChild(da);
      svg.appendChild(dot);
    }

    function updateLiveDot(animate) {
      const c = selectedCorner();
      const dot  = document.getElementById('trailLiveDot');
      const glow = document.getElementById('trailGlow');
      if (!dot || !glow) return;

      if (!c) {
        dot.style.display  = 'none';
        glow.style.display = 'none';
        return;
      }

      const dur   = animate ? Math.round(speed * 0.82) : 0;
      const ease  = 'cubic-bezier(0.4,0,0.2,1)';
      const trans = dur > 0 ? `cx ${dur}ms ${ease}, cy ${dur}ms ${ease}` : 'none';
      dot.style.transition  = trans;
      glow.style.transition = trans;
      dot.style.display  = '';
      glow.style.display = '';

      const { x, y } = cornerPixel(pos.row, pos.col, c);
      dot.style.cx  = `${x}px`;
      dot.style.cy  = `${y}px`;
      glow.style.cx = `${x}px`;
      glow.style.cy = `${y}px`;
    }

    function drawTrailHistory() {
      const hist = document.getElementById('trailHistory');
      if (!hist) return;
      hist.innerHTML = '';

      const c = selectedCorner();
      if (!c || trail.length === 0) return;

      const cur = cornerPixel(pos.row, pos.col, c);
      const pts = [...trail, cur];
      if (pts.length > 1) {
        const pl = svgEl('polyline');
        pl.setAttribute('points', pts.map(p => `${p.x},${p.y}`).join(' '));
        pl.setAttribute('fill', 'none');
        pl.setAttribute('stroke', '#f0c040');
        pl.setAttribute('stroke-width', '2');
        pl.setAttribute('stroke-dasharray', '5,4');
        pl.setAttribute('opacity', '0.62');
        hist.appendChild(pl);
      }

      trail.forEach(p => {
        const d = svgEl('circle');
        d.setAttribute('cx', p.x); d.setAttribute('cy', p.y);
        d.setAttribute('r', '3');
        d.setAttribute('fill', '#f0c040');
        d.setAttribute('opacity', '0.38');
        hist.appendChild(d);
      });
    }

    function clearTrail() {
      trail = [];
      const hist = document.getElementById('trailHistory');
      if (hist) hist.innerHTML = '';
      updateLiveDot(false);
    }

    function svgEl(tag) {
      return document.createElementNS('http://www.w3.org/2000/svg', tag);
    }

    // ═══════════════════════════════════════════════════════
    //  JSON Plan Parsing & Validation
    // ═══════════════════════════════════════════════════════
    function parsePlan(raw) {
      let data;
      try { data = JSON.parse(raw.trim()); }
      catch (e) { throw new Error('JSON 解析失败：' + e.message); }

      if (!Array.isArray(data.moves) || data.moves.length === 0)
        throw new Error('moves 必须为非空数组');

      const VALID_DIRS    = new Set(['上','下','左','右']);
      const VALID_CORNERS = new Set(['左上角','右上角','左下角','右下角']);
      const steps = [];
      const ends  = [];

      data.moves.forEach((m, i) => {
        if (!VALID_DIRS.has(m.dir))
          throw new Error(`moves[${i}].dir 非法值 "${m.dir}"`);
        const s = Number(m.steps);
        if (!Number.isInteger(s) || s <= 0)
          throw new Error(`moves[${i}].steps 必须为正整数`);
        for (let j = 0; j < s; j++) steps.push(m.dir);
        ends.push(steps.length);
      });

      const hl = (data.highlight && data.highlight !== 'null') ? data.highlight : null;
      if (hl && !VALID_CORNERS.has(hl))
        throw new Error(`highlight 非法值 "${hl}"`);

      return { steps, moveEnds: ends, highlight: hl };
    }

    function loadPlan(rawJson) {
      const raw = rawJson || '';
      if (!raw) { setStatus('llmStatus', 'err', '无有效方案'); return false; }
      let result;
      try { result = parsePlan(raw); }
      catch (e) { setStatus('llmStatus', 'err', e.message); return false; }

      resetSwallowToStart(); // 统一重置逻辑
      
      flatSteps    = result.steps;
      moveEnds     = result.moveEnds;
      activeCorner = result.highlight;
      
      const replayBtn = document.getElementById('btnReplay');
      if (replayBtn) replayBtn.disabled = false;
      return true;
    }

    // ═══════════════════════════════════════════════════════
    //  Step Execution
    // ═══════════════════════════════════════════════════════
    function doStep() {
      if (stepIdx >= flatSteps.length) return false;
      const dir = flatSteps[stepIdx];
      const { dr, dc } = DIR_DELTA[dir];
      const nr = pos.row + dr;
      const nc = pos.col + dc;

      if (nr < 1 || nr > ROWS || nc < 1 || nc > COLS) {
        const errMsg = `越界！（向${dir}移动超出网格范围）`;
        setStatus('llmStatus', 'err', errMsg);
        stopPlay();
        
        // 如果有正在执行的指令，发送错误回调
        if (currentExecutingCommand) {
          sendCallback(currentExecutingCommand.cmd_id, 'error', errMsg, { 
            result: 'no',
            current_position: { x: pos.col, y: pos.row },
            target_position: { x: TARGET.col, y: TARGET.row }
          });
          currentExecutingCommand = null;
        }
        processNextCommand(); // 尝试执行下一个任务
        return false;
      }

      const c = selectedCorner();
      if (c) trail.push(cornerPixel(pos.row, pos.col, c));

      pos = { row: nr, col: nc };
      renderSwallow(true);
      updateLiveDot(true);
      drawTrailHistory();
      stepIdx++;
      return true;
    }

    function checkSuccess() {
      if (pos.row === TARGET.row && pos.col === TARGET.col) {
        document.getElementById('targetCell')?.classList.remove('empty-target');
        document.getElementById('swallowPiece').classList.add('arrived');
        document.getElementById('successBanner').classList.add('visible');
        setStatus('llmStatus', 'ok', '成功抵达目标位置！');
        return true;
      }
      return false;
    }

    // ═══════════════════════════════════════════════════════
    //  Playback Controls
    // ═══════════════════════════════════════════════════════
    function togglePlay() {
      if (playing) { stopPlay(); return; }
      if (flatSteps.length === 0) return;
      if (stepIdx >= flatSteps.length) return;
      playing = true;
      if (stepIdx === 0 && selectedCorner()) {
        updateLiveDot(false);
        drawTrailHistory();
        playTimer = setTimeout(schedule, speed);
        return;
      }
      schedule();
    }

    function schedule() {
      if (!playing) return;
      if (stepIdx >= flatSteps.length) {
        if (checkSuccess()) {
          stopPlay();
          // 如果有正在执行的指令，发送成功回调
          if (currentExecutingCommand) {
            sendCallback(currentExecutingCommand.cmd_id, 'success', '拼图还原成功', { 
              result: 'yes',
              current_position: { x: pos.col, y: pos.row },
              target_position: { x: TARGET.col, y: TARGET.row }
            });
            currentExecutingCommand = null;
          }
          processNextCommand(); // 执行下一个任务
          return;
        }
        stopPlay();
        setStatus('llmStatus', 'ok', '全部步骤执行完毕！');
        // 发送执行完毕回调
        if (currentExecutingCommand) {
          sendCallback(currentExecutingCommand.cmd_id, 'success', '执行完毕', { 
            result: 'no',
            current_position: { x: pos.col, y: pos.row },
            target_position: { x: TARGET.col, y: TARGET.row }
          });
          currentExecutingCommand = null;
        }
        processNextCommand(); // 执行下一个任务
        return;
      }
      if (doStep()) {
        playTimer = setTimeout(schedule, speed);
      }
    }

    function stopPlay(flushCoachMessages = true) {
      playing = false;
      clearTimeout(playTimer);
      // 冲刷播放期间缓存的教练消息
      if (flushCoachMessages) {
        while (pendingCoachMessages.length) {
          showCoachMessage(pendingCoachMessages.shift());
        }
      } else {
        pendingCoachMessages = [];
      }
      _enableSendBtn();
    }

    function replayPuzzle() {
      if (flatSteps.length === 0) return;
      resetSwallowToStart();
      setStatus('llmStatus', '', '');
      togglePlay();
    }

    function resetChatPanel() {
      const container = document.getElementById('chatMessages');
      if (!container) return;
      container.innerHTML = '<div class="chat-empty" id="chatEmpty">对话记录展示区</div>';
      container.scrollTop = 0;
      // 重置后显示初始欢迎语（不传模型）
      showCoachMessage("同学你好，我是果果，请先拍下你的作品，我们一起交流吧！");
    }

    function restartPuzzleSession() {
      // 1. 立即取消正在进行的对话请求
      if (currentAbortController) {
        currentAbortController.abort();
        currentAbortController = null;
      }

      // 2. 彻底断开旧连接，确保绕过 initCanvasSSE 的活跃检查
      if (sseSource) {
        console.log(`${getLogPrefix()} [Session] 手动重置，关闭旧 SSE`);
        sseSource.onopen = null;
        sseSource.onmessage = null;
        sseSource.onerror = null;
        sseSource.close();
        sseSource = null;
      }

      stopPlay(false);

      // 3. 生成全新的 Thread ID
      THREAD_ID = generateThreadId();
      console.log(`${getLogPrefix()} [Session] 重置会话, 新 thread_id: ${THREAD_ID}`);

      // 4. 重置所有前端游戏状态
      resetSwallowToStart();
      flatSteps = [];
      moveEnds = [];
      stepIdx = 0;
      trail = [];
      activeCorner = null;
      pendingCommands = [];
      currentExecutingCommand = null;

      document.getElementById('successBanner').classList.remove('visible');
      document.getElementById('swallowPiece').classList.remove('arrived');
      
      // 重置聊天面板并显示欢迎语
      resetChatPanel();
      
      _enableSendBtn();

      // 5. 重新建立全新的 SSE 连接
      initCanvasSSE();
      
      // 重置引导锁定状态
      hasSentFirstImage = false;
      const overlay = document.getElementById('inputLockOverlay');
      if (overlay) overlay.classList.remove('hidden');
    }

    // ═══════════════════════════════════════════════════════
    //  Utilities
    // ═══════════════════════════════════════════════════════
    function setStatus(id, cls, html) {
      const el = document.getElementById(id);
      if (!el) return;
      if (id === 'llmStatus') {
        const llmCls = cls || 'info';
        el.className = 'chatbot-header-label' + (llmCls ? ' ' + llmCls : '');
        el.innerHTML = html || '你有移动燕子到空缺方块的方案吗？';
      } else {
        el.className = 'status ' + cls;
        el.innerHTML = html;
      }
    }

    function syncResponsiveLayout() {
      const wrap = document.querySelector('.grid-wrap');
      const stage = document.getElementById('gridStage');
      if (!wrap || !stage) return;

      const style = window.getComputedStyle(wrap);
      const padX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
      const padY = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
      const availableWidth = Math.max(wrap.clientWidth - padX, CELL_W);
      const availableHeight = Math.max(wrap.clientHeight - padY, CELL_H);
      const scale = Math.min(availableWidth / (CELL_W * COLS), availableHeight / (CELL_H * ROWS));

      document.documentElement.style.setProperty('--board-scale', scale.toFixed(4));
    }

    // ═══════════════════════════════════════════════════════
    //  Bootstrap
    // ═══════════════════════════════════════════════════════
    // 初始化微课
    (function init() {
      buildGrid();
      initLiveDot();
      renderSwallow(false);
      const input = document.getElementById('nlInput');
      input?.addEventListener('input', updateSendButtonState);
      updateSendButtonState();
      syncResponsiveLayout();
      window.addEventListener('resize', syncResponsiveLayout);
      initImageModalEvents(); // 初始化图片查看器的交互
      
      /**
       * 统一处理图片数据并发送
       */
      function handleNativeImageData(data) {
        console.log(`${getLogPrefix()} [UI] 处理图片数据:`, data);
        if (data && data.success && data.base64DataUrl) {
          const newImageData = {
            file: null,
            previewUrl: data.base64DataUrl
          };
          selectedImages = [newImageData];
          // 延迟一小会儿确保状态更新
          setTimeout(() => {
            sendUserInput();
          }, 100);
        }
      }

      // 1. 监听 Android 原生直接派发的事件 (当前窗口)
      window.addEventListener('nativeImageCaptureResult', function(e) {
        console.log(`${getLogPrefix()} [Event] window 捕获到 nativeImageCaptureResult:`, e.detail);
        handleNativeImageData(e.detail);
      });

      // 1.1 尝试直接监听顶层窗口 (解决 iframe 捕获不到原生事件的问题)
      // 只要是同源 URL，这段代码就能成功执行
      try {
        if (window.top && window.top !== window) {
          console.log(`${getLogPrefix()} [Event] 尝试在 window.top 挂载监听器`);
          window.top.addEventListener('nativeImageCaptureResult', function(e) {
            console.log(`${getLogPrefix()} [Event] window.top 捕获到事件，准备处理`);
            handleNativeImageData(e.detail);
          });
        }
      } catch (err) {
        console.warn(`${getLogPrefix()} [Event] 跨域限制或顶层访问失败:`, err);
      }

      // 2. 监听可能通过 postMessage 转发的事件
      window.addEventListener('message', function(e) {
        console.log(`${getLogPrefix()} [Message] window 收到 postMessage:`, e.data);
        if (e.data && e.data.type === 'nativeImageCaptureResult') {
          console.log(`${getLogPrefix()} [Message] 识别为拍照结果，准备处理`);
          handleNativeImageData(e.data.detail);
        }
      });
      
      // 初始显示欢迎语
      showCoachMessage("同学你好，我是果果，请先拍下你的作品，我们一起交流吧！");

      // 自动登记学生信息到 SDSF 统计服务器
      if (DISPLAY_NAME) {
        fetch('https://www.imates.com.cn/openclassSDSF/api/sdsf/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            studentName: DISPLAY_NAME,
            studentId: DISPLAY_NAME,
            timestamp: new Date().toISOString()
          })
        }).catch(err => console.warn('[SDSF] 自动登记失败:', err));
      }

      // 初始化 SSE 连接
      initCanvasSSE();
    })();
  </script>
