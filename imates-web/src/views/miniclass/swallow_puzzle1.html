<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>燕子拼图演示工具</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --board-width: 900px;
      --board-height: 470px;
      --board-scale: 1;
    }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
      background: #eceff3;
      color: #d8dce8;
      min-height: 100vh;
      height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      font-size: 24px; /* 调小标题字号 (原28px) */
      font-weight: 700;
      color: #8f6b11;
      letter-spacing: 4px;
      flex-shrink: 0;
      margin-bottom: 4px;
    }

    /* ─── Main Layout ───────────────────────────────────── */
    .main-layout {
      display: flex;
      flex-direction: row; /* 强制保持横向布局 */
      gap: 12px;
      align-items: stretch;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .grid-wrap {
      position: relative;
      flex: 2 1 0; /* 减小左侧权重 (原 2) */
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border: 1px solid #d7dbe3;
      border-radius: 12px;
      background: #f7f8fa;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      overflow: hidden;
    }

    .right-col {
      flex: 1.2 1 0; /* 增加右侧聊天区权重 (原 1) */
      min-width: 200px; /* 稍微缩小右侧最小宽度以腾出更多空间给左侧 */
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .grid-stage {
      position: relative;
      width: var(--board-width);
      height: var(--board-height);
      flex-shrink: 0;
      transform: scale(var(--board-scale));
      transform-origin: center center;
      will-change: transform;
      border: 2px solid #2e3650;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 6px 32px rgba(0,0,0,0.6);
    }

    .puzzle-grid {
      display: grid;
      grid-template-columns: repeat(10, 90px);
      grid-template-rows: repeat(5, 94px);
    }

    .cell {
      width: 90px;
      height: 94px;
      background-image: url('original_pic.png');
      background-size: 900px 470px;
      position: relative;
    }
    .cell.swallow-origin-empty {
      background-image: none;
      background-color: #ffffff;
    }

    /* ─── Swallow Piece Overlay ─────────────────────────── */
    .swallow-piece {
      position: absolute;
      width: 90px;
      height: 94px;
      background-image: url('original_pic.png');
      background-size: 900px 470px;
      box-shadow: 0 0 0 1px #e03838, 0 0 14px rgba(224,56,56,0.65);
      z-index: 10;
      transition: top 320ms cubic-bezier(0.4, 0, 0.2, 1),
                  left 320ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .swallow-piece.arrived {
      box-shadow: 0 0 0 1px #2ecc71, 0 0 18px rgba(46,204,113,0.85);
      animation: arrivalPulse 0.55s ease 3;
    }
    @keyframes arrivalPulse {
      0%,100% { box-shadow: 0 0 0 1px #2ecc71, 0 0 18px rgba(46,204,113,0.85); }
      50%      { box-shadow: 0 0 0 3px #2ecc71, 0 0 28px rgba(46,204,113,1);   }
    }

    /* ─── SVG Trail ─────────────────────────────────────── */
    .trail-svg {
      position: absolute;
      top: 0; left: 0;
      width: var(--board-width);
      height: var(--board-height);
      pointer-events: none;
      z-index: 20;
    }

    /* ─── Panel layout ──────────────────────────────────── */
    .panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-height: 0;
    }

    .card {
      background: #1e2438;
      border: 1px solid #2e3650;
      border-radius: 6px;
      padding: 12px 16px;
    }

    .card-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #5060a0;
      margin-bottom: 8px;
    }

    .row { display: flex; align-items: center; gap: 8px; }

    input[type="text"] {
      flex: 1;
      padding: 7px 10px;
      background: #141824;
      border: 1px solid #2e3650;
      border-radius: 4px;
      color: #d8dce8;
      font-size: 13px;
      font-family: inherit;
    }
    input:focus { outline: none; border-color: #4060c0; }

    textarea {
      width: 100%;
      background: #141824;
      border: 1px solid #2e3650;
      border-radius: 4px;
      color: #d8dce8;
      font-size: 15px; /* 调小输入框字号 */
      padding: 10px 12px;
      resize: vertical;
      font-family: inherit;
    }
    textarea:focus { outline: none; border-color: #4060c0; }

    .btn {
      padding: 7px 14px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-sm { padding: 5px 11px; font-size: 12px; }
    .btn-blue   { background: #2c5cc8; color: #fff; }
    .btn-blue:hover:not(:disabled)   { background: #2250b8; }
    .btn-green  { background: #1f8c50; color: #fff; }
    .btn-green:hover:not(:disabled)  { background: #177840; }
    .btn-red    { background: #7a2020; color: #ffa0a0; }
    .btn-red:hover:not(:disabled)    { background: #8f2828; }
    .btn-gray   { background: #2e3650; color: #a0a8c0; }
    .btn-gray:hover:not(:disabled)   { background: #3a4468; }
    .btn-amber  { background: #7a4e10; color: #f0c040; }
    .btn-amber:hover:not(:disabled)  { background: #8f5c12; }

    /* ─── Status lines ──────────────────────────────────── */
    .status {
      margin-top: 6px;
      font-size: 12px;
      min-height: 18px;
      line-height: 1.5;
    }
    .status.err  { color: #e05858; }
    .status.ok   { color: #40b870; }
    .status.info { color: #5080c0; }

    /* ─── Spinner ───────────────────────────────────────── */
    .spin {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid #2e3650;
      border-top-color: #4080d0;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      vertical-align: text-bottom;
      margin-right: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── WS indicator dot ──────────────────────────────── */
    .ws-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }
    .ws-dot.disconnected { background: #e05858; }
    .ws-dot.connecting   { background: #f0c040; animation: spin 0.65s linear infinite; }
    .ws-dot.connected    { background: #40b870; }

    /* ─── Chatbot panel ─────────────────────────────────── */
    .chatbot-card {
      background: #ffffff;
      border: 1px solid #d7dbe3;
      border-radius: 6px;
      color: #1f2937;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      position: relative;
    }
    .chatbot-header {
      padding: 8px 14px;
      border-bottom: 1px solid #e5e7eb;
      background: #f8fafc;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }
    .chatbot-header-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #f0c040;
      box-shadow: 0 0 6px rgba(240,192,64,0.6);
    }
    .chatbot-header-label {
      font-size: 18px; /* 调小页眉字号 (原20px) */
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #64748b;
      transition: color 0.2s;
    }
    .chatbot-header-label.err  { color: #e05858; font-weight: 600; letter-spacing: 0; text-transform: none; }
    .chatbot-header-label.ok   { color: #40b870; font-weight: 600; letter-spacing: 0; text-transform: none; }
    .chatbot-header-label.info { color: #5080c0; font-weight: 600; letter-spacing: 0; text-transform: none; }
    .chatbot-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    .chatbot-messages::-webkit-scrollbar { width: 4px; }
    .chatbot-messages::-webkit-scrollbar-track { background: transparent; }
    .chatbot-messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

    /* ─── Onboarding Overlay ────────────────────────────── */
    .input-lock-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #f8fafc;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      border-radius: 0 0 6px 6px;
      transition: opacity 0.3s;
    }
    .input-lock-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .onboarding-title {
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 4px;
    }
    .onboarding-desc {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 12px;
    }
    .onboarding-btn {
      padding: 8px 18px;
      background: #eff6ff;
      color: #3b82f6;
      border: 1px solid #dbeafe;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .onboarding-btn:hover { 
      background: #dbeafe;
      border-color: #3b82f6;
    }
    .onboarding-btn svg { width: 20px; height: 20px; }

    /* ─── Chatbot input footer ───────────────────────────── */
    .chatbot-footer {
      flex-shrink: 0;
      border-top: 1px solid #e5e7eb;
      background: #ffffff;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chatbot-input-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }
    .chatbot-btn-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: flex-end;
    }
    .chatbot-btn-stack .btn {
      min-width: 96px;
      height: 44px;
    }
    .chatbot-input-row textarea {
      flex: 1;
      resize: none;
      border-radius: 8px;
      min-height: 62px;
      max-height: 160px;
      background: #ffffff;
      border-color: #d1d5db;
      color: #111827;
    }
    .chatbot-input-row textarea::placeholder {
      font-size: 14px; /* 调小占位符 */
      color: #94a3b8;
    }

    /* ─── Image Preview ─────────────────────────────────── */
    .image-preview-area {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 12px;
      border-top: 1px solid #e5e7eb;
      background: #f9fafb;
    }
    .image-preview-area.visible { display: flex; }
    .image-item {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #d1d5db;
    }
    .image-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .image-item .remove-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      background: rgba(0,0,0,0.5);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      border: none;
    }
    .chat-bubble-image {
      max-width: 200px;
      border-radius: 8px;
      margin-top: 8px;
      cursor: pointer;
    }

    /* ─── Toolbar ───────────────────────────────────────── */
    .chatbot-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 12px;
      border-top: 1px solid #e5e7eb;
      background: #f8fafc;
    }
    .toolbar-icon-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .toolbar-icon-btn:hover {
      background: #e2e8f0;
      color: #3b82f6;
    }
    .toolbar-icon-btn svg {
      width: 20px;
      height: 20px;
    }
    /* ─── Replay overlay button (on grid) ───────────────── */

    .chat-row {
      display: flex;
      align-items: flex-end;
      gap: 7px;
    }
    .chat-row.student { flex-direction: row-reverse; }

    .chat-avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .chat-avatar.coach   { background: #eff6ff; color: #3b82f6; border: 1px solid #dbeafe; }
    .chat-avatar.student { background: #f0fdf4; color: #22c55e; border: 1px solid #dcfce7; }

    .chat-bubble {
      max-width: 90%;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 24px; /* 进一步调大聊天气泡字号 (原20px) */
      line-height: 1.5;
      word-break: break-word;
    }
    .chat-bubble.coach {
      background: #dbeafe;
      border: 1px solid #93c5fd;
      color: #000000;
      border-bottom-left-radius: 3px;
    }
    .chat-bubble.coach strong {
      display: inline-block;
      margin: 0 4px;
      padding: 0 8px;
      background-color: #fef3c7;
      border-bottom: 2px solid #f59e0b;
      color: #92400e;
      font-weight: 700;
      border-radius: 4px;
    }

    .replay-btn-inline {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px; 
      padding: 6px 14px;
      background: #f0c040;
      color: #7a4e10;
      border: 1px solid #d9a300;
      border-radius: 8px;
      font-size: 16px; 
      font-weight: 700;
      cursor: pointer;
      width: fit-content;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(240, 192, 64, 0.3);
    }
    .replay-btn-inline:hover {
      background: #ffcf4d;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(240, 192, 64, 0.4);
    }
    .replay-btn-inline:active {
      transform: translateY(0);
    }
    .replay-btn-inline svg {
      width: 18px;
      height: 18px;
    }

    .thinking-bubble {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      background: #f1f5f9;
      border-radius: 12px;
      border-bottom-left-radius: 3px;
      width: fit-content;
    }
    .thinking-dot {
      width: 6px;
      height: 6px;
      background: #94a3b8;
      border-radius: 50%;
      animation: thinking-bounce 1.4s infinite ease-in-out;
    }
    .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes thinking-bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
 
    .chat-bubble.student {
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #000000;
      border-bottom-right-radius: 3px;
    }

    .chat-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    /* ─── Success banner ────────────────────────────────────── */
    .success-banner {
      display: none;
      text-align: center;
      padding: 11px;
      background: linear-gradient(90deg, #ecfdf3, #dcfce7, #ecfdf3);
      border: 1px solid #86efac;
      border-radius: 6px;
      color: #166534;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(134,239,172,0.45);
    }
    .success-banner.in-grid-top {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      min-width: 320px;
      max-width: calc(100% - 24px);
    }
    .success-banner.visible { display: block; }

    /* ─── 移动端字体与间距适配 ─────────────────────────── */
    @media (max-width: 768px) {
      h1 { font-size: 20px; letter-spacing: 2px; }
      .chatbot-header-label { font-size: 16px; }
      .chat-bubble { font-size: 16px; padding: 10px 14px; }
      .sdsf-tab-btn { padding: 4px 12px; font-size: 13px; }
      textarea { font-size: 14px; }
      .btn { font-size: 13px; padding: 6px 14px; }
      .chat-avatar { width: 32px; height: 32px; font-size: 18px; }
    }

  </style>
</head>
<body>

  <!-- ─── Main Layout ────────────────────────────────── -->
  <div class="main-layout">

    <!-- Left: Puzzle Grid -->
    <div class="grid-wrap">
      <div class="success-banner in-grid-top" id="successBanner">🎉 拼图还原成功！燕子已归位！</div>
      <div class="grid-stage" id="gridStage">
        <div class="puzzle-grid" id="puzzleGrid"></div>
        <div class="swallow-piece"  id="swallowPiece"></div>
        <svg class="trail-svg"      id="trailSvg"></svg>
      </div>
    </div>

    <!-- Right: Control Panel -->
    <div class="right-col">
      <div class="panel">

        <!-- Chatbot panel (含输入区) -->
        <div class="chatbot-card">
          <div class="chatbot-header">
            <span id="llmStatus" class="chatbot-header-label info"></span>
          </div>
          <div class="chatbot-messages" id="chatMessages">
            <div class="chat-empty" id="chatEmpty">对话记录展示区</div>
          </div>
          <div class="image-preview-area" id="imagePreviewArea"></div>
          <div class="chatbot-footer" style="position: relative;">
            <!-- 初始引导层 -->
            <div class="input-lock-overlay" id="inputLockOverlay" onclick="triggerImageInput()">
              <button class="onboarding-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                </svg>
                拍下你的作答
              </button>
            </div>
            
            <div class="chatbot-input-row">
              <textarea id="nlInput" rows="2"
                placeholder="请说出你的移动方案或思考"
                onkeydown="handleInputKeydown(event)"></textarea>
              <div class="chatbot-btn-stack">
                <button class="btn btn-amber" id="btnResetSession"
                  onclick="restartPuzzleSession()">重玩</button>
                <button class="btn btn-blue" id="btnSend"
                  onclick="sendUserInput()" disabled>发送</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- 隐藏的文件输入框，使用更稳健的隐藏方式 -->
  <input type="file" id="imageInput" accept="image/*" style="position:fixed; top:-500px; left:-100px; width:40px; height:40px; opacity:0.01; z-index:9999;" onchange="handleImageSelect(event)">

  <script>
    // ═══════════════════════════════════════════════════════
    //  Constants
    // ═══════════════════════════════════════════════════════
    const ROWS = 5, COLS = 10;
    const CELL_W = 90;
    const CELL_H = Math.round(CELL_W * (1780 / ROWS) / (3418 / COLS)); // = 94

    // Game coordinates: row 1 = bottom, row 5 = top; col 1 = left, col 10 = right
    const SWALLOW_START = { row: 1, col: 1 };
    const TARGET        = { row: 3, col: 5 };

    // --- API Configuration (New) ---
    const API_BASE = 'https://kelvin-cosin.cloud/test/api'; // 替换为真实的 Agent 地址
    let THREAD_ID = `t_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`;
    const USER_ID = 'kelvin';
    const CANVAS_ID = 'swallow_puzzle_1';

    // 从 URL 参数获取用户名
    const urlParams = new URLSearchParams(window.location.search);
    const userNameParam = urlParams.get('userName');
    const DISPLAY_NAME = userNameParam || USER_ID;
    console.log('[SDSF] 初始 DISPLAY_NAME:', DISPLAY_NAME);

    let sseSource = null;
    let selectedImages = []; // { file, previewUrl }
    let hasSentFirstImage = false; // 是否已发送过第一张图片

    /**
     * 生成新的会话 ID
     */
    function generateThreadId() {
      return `t_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`;
    }

    /**
     * 稳健触发图片选择逻辑
     */
    function triggerImageInput() {
      console.log(`${getLogPrefix()} [UI] 尝试触发图片选择 (triggerImageInput)`);
      
      // 获取原生桥接对象（兼容大小写）
      const bridge = window.AndroidBridge || window.androidBridge;
      
      // 1. 优先尝试调用 Android 原生桥接方法（如果存在）
      if (bridge) {
        // 根据 WebAppInterface.java 实际定义的方法名
        if (typeof bridge.captureImageFromCamera === 'function') {
          console.log(`${getLogPrefix()} [UI] 检测到 AndroidBridge，调用 captureImageFromCamera`);
          bridge.captureImageFromCamera();
          return;
        } else if (typeof bridge.selectImageFromGallery === 'function') {

    /**
     * 获取带时间戳的日志前缀
     */
    function getLogPrefix() {
      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}.${now.getMilliseconds().toString().padStart(3, '0')}`;
      return `[${timeStr}]`;
    }

    /**
     * 初始化 SSE 连接接收指令
     */
    function initCanvasSSE() {
      if (sseSource) {
        sseSource.close();
      }

      const sseUrl = `${API_BASE}/canvas/sse/${THREAD_ID}`;
      console.log(`${getLogPrefix()} [接口请求] SSE 建立连接: GET ${sseUrl}`);
      sseSource = new EventSource(sseUrl);

      sseSource.onopen = () => {
        console.log(`${getLogPrefix()} [接口响应] SSE 连接成功 ✅`);
        // setStatus('llmStatus', 'ok', '已连接画布助手'); // 不再渲染状态文字
        wsConnected = true;
        updateSendButtonState();
      };

      sseSource.onmessage = (e) => {
        if (e.data === ': keepalive') return;
        
        console.log(`${getLogPrefix()} [接口数据] SSE 收到消息:`, e.data);
        try {
          const data = JSON.parse(e.data);
          if (data.cmd_id && data.command) {
            handleCanvasCommand(data.cmd_id, data.command);
          }
        } catch (err) {
          console.error(`${getLogPrefix()} [SSE] 解析数据失败`, err, e.data);
        }
      };

      sseSource.onerror = (e) => {
        console.error('[SSE] 连接错误', e);
        wsConnected = false;
        updateSendButtonState();
        setStatus('llmStatus', 'err', '助手连接断开，正在尝试重连...');
      };
    }

    /**
     * 处理具体的画布指令
     */
    function handleCanvasCommand(cmd_id, command) {
      console.log(`${getLogPrefix()} [SSE] 收到指令并加入队列:`, cmd_id);
      pendingCommands.push({ cmd_id, command });
      
      // 只要当前没有正在执行的指令且不在播放中，就立刻开始执行（不再等待对话响应结束）
      if (!currentExecutingCommand && !playing) {
        processNextCommand();
      }
    }

    /**
     * 从队列中取出并执行下一个指令
     */
    function processNextCommand() {
      if (pendingCommands.length === 0) return;
      if (playing) return;

      const { cmd_id, command } = pendingCommands.shift();
      executeCanvasCommand(cmd_id, command);
    }

    /**
     * 实际执行画布指令逻辑
     */
    function executeCanvasCommand(cmd_id, command) {
      const { action, params } = command;
      currentExecutingCommand = { cmd_id, command };
      
      if (action === 'demo_moves') {
        const currentPlanJson = JSON.stringify(params);
        lastPlanJson = currentPlanJson;
        
        const movesDesc = params.moves.map(m => `向${m.dir}走${m.steps}步`).join('，然后');
        let displayMsg = `我先${movesDesc}。`;
        
        if (params.highlight) {
          displayMsg += `（小技巧：我们可以看着方块的<strong>${params.highlight}的点</strong>来数格数哦！）`;
        }
        
        // 直接创建一个独立的指令气泡
        appendChatMessage('coach', displayMsg, true, currentPlanJson);

        if (loadPlan(currentPlanJson)) {
          setStatus('llmStatus', 'ok', '收到演示指令，正在播放…');
          togglePlay();
        } else {
          sendCallback(cmd_id, 'error', '解析移动指令失败');
          currentExecutingCommand = null;
          processNextCommand();
        }
      } else {
        console.warn('[Canvas] 未知 action:', action);
        sendCallback(cmd_id, 'error', `未知指令 action: ${action}`);
        currentExecutingCommand = null;
        processNextCommand();
      }
    }

    /**
     * 执行结果回调给 Agent
     */
    async function sendCallback(cmdId, status, message = '', data = {}) {
      const url = `${API_BASE}/canvas/callback`;
      const body = {
        cmd_id: cmdId,
        status: status,
        message: message,
        data: data
      };
      
      console.log(`${getLogPrefix()} [接口请求] Callback 发送: POST ${url}`, body);
      
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const result = await response.json();
        console.log(`${getLogPrefix()} [接口响应] Callback 结果:`, result);
      } catch (err) {
        console.error(`${getLogPrefix()} [接口错误] Callback 发送失败`, err);
      }
    }

    function handleImageSelect(e) {
      const files = e.target.files;
      if (!files || files.length === 0) return;

      const filePromises = Array.from(files).map(file => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (event) => {
            resolve({
              file: file,
              previewUrl: event.target.result
            });
          };
          reader.readAsDataURL(file);
        });
      });

      Promise.all(filePromises).then(newImages => {
        selectedImages = newImages; // 替换当前选择，直接发送
        sendUserInput();
      });
      
      e.target.value = ''; // 清空以支持重复选择同一文件
    }

    /**
     * 上传单张图片并获取 URL
     */
    async function uploadSingleImage(imageObj) {
      console.log(`${getLogPrefix()} [Upload] 准备上传图片, 大小约为: ${Math.round(imageObj.previewUrl.length * 0.75 / 1024)} KB`);
      const formData = new FormData();
      
      if (imageObj.file) {
        formData.append('file', imageObj.file);
      } else if (imageObj.previewUrl && imageObj.previewUrl.startsWith('data:')) {
        // 处理 Base64 转换
        console.log(`${getLogPrefix()} [Upload] 检测到 Base64 数据，正在转换为 Blob`);
        const byteString = atob(imageObj.previewUrl.split(',')[1]);
        const mimeString = imageObj.previewUrl.split(',')[0].split(':')[1].split(';')[0];
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) {
          ia[i] = byteString.charCodeAt(i);
        }
        const blob = new Blob([ab], {type: mimeString});
        formData.append('file', blob, 'camera_capture.jpg');
      }

      // 注意：根据 getRouteBaseMap，/api/images/upload 映射到 ADDRESS_CATALOG.CLIENT_HTTP (https://www.imates.com.cn:8200)
      // 如果是在本地测试，可能需要直接使用完整 URL
      const uploadUrl = 'https://www.imates.com.cn:8200/api/images/upload';
      
      try {
        const response = await fetch(uploadUrl, {
          method: 'POST',
          body: formData
        });
        const result = await response.json();
        if (result.success && result.data && result.data.path) {
          // 拼接完整 URL
          return `https://www.imates.com.cn${result.data.path}`;
        }
        throw new Error(result.message || '上传失败');
      } catch (err) {
        console.error('[Upload] 图片上传错误:', err);
        throw err;
      }
    }

    /**
     * 发送用户对话内容到画布助手
     */
    async function sendUserInput() {
      const text = document.getElementById('nlInput').value.trim();
      const hasImages = selectedImages.length > 0;
      
      if (!text && !hasImages) { 
        setStatus('llmStatus', 'err', '请输入内容或上传图片'); 
        return; 
      }

      // 1. 展示用户消息
      const userBubble = appendChatMessage('student', text);
      if (hasImages) {
        selectedImages.forEach(img => {
          const imgEl = document.createElement('img');
          imgEl.src = img.previewUrl;
          imgEl.className = 'chat-bubble-image';
          userBubble.querySelector('.chat-bubble').appendChild(imgEl);
        });
      }

      // 清空输入
      const currentImages = [...selectedImages];
      document.getElementById('nlInput').value = '';
      selectedImages = [];
      renderImagePreviews();
      
      waitingResponse = true;
      updateSendButtonState();
      showThinkingBubble();
      let currentResponseIsRight = false;

      // 2. 上传图片（如果有）
      let imageUrls = [];
      if (hasImages) {
        try {
          setStatus('llmStatus', 'info', '正在上传图片...');
          const uploadPromises = currentImages.map(img => uploadSingleImage(img));
          imageUrls = await Promise.all(uploadPromises);
          console.log(`${getLogPrefix()} [上传成功] 图片 URLs:`, imageUrls);
          
          // 如果是第一次发送图片，解锁输入框
          if (!hasSentFirstImage) {
            hasSentFirstImage = true;
            const overlay = document.getElementById('inputLockOverlay');
            if (overlay) overlay.classList.add('hidden');
          }
        } catch (err) {
          console.error('[Bot] 图片上传失败', err);
          removeThinkingBubble();
          setStatus('llmStatus', 'err', '图片上传失败，请重试');
          waitingResponse = false;
          updateSendButtonState();
          return;
        }
      }

      const url = `${API_BASE}/canvas_bot`;
      const body = {
        inputs: {
          message: text,
          name: DISPLAY_NAME,
          image_url: imageUrls,
          canvas_id: CANVAS_ID
        },
        config: {
          configurable: {
            thread_id: THREAD_ID,
            user_id: USER_ID
          }
        }
      };

      console.log(`${getLogPrefix()} [接口请求] ChatBot 发送: POST ${url}`, body);

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let coachBubble = null; // 用于本次对话的独立文字气泡
        let fullContent = "";

        console.log(`${getLogPrefix()} [接口响应] ChatBot 流式传输开始...`);

        while (true) {
          const { value, done } = await reader.read();
          if (done) {
            console.log(`${getLogPrefix()} [接口完成] ChatBot 流读取完成`);
            break;
          }
          
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');
          
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              console.log(`${getLogPrefix()} [接口数据] ChatBot Chunk:`, line);
              try {
                const data = JSON.parse(line.slice(6));
                
                // 1. 渲染文本内容
                if (data.content) {
                  const isSpecificAnswer = data.content.includes("the answer is right");
                  // 检查是否包含 "bubble" 关键词（不分大小写）
                  const isBubbleBreak = data.content.toLowerCase().includes("bubble");
                  
                  if (isSpecificAnswer) {
                    console.log('[Bot] 识别到特定判定内容，不进行渲染并标记成功');
                    currentResponseIsRight = true;
                  } else if (isBubbleBreak) {
                    console.log('[Bot] 识别到 bubble 关键词，准备切分气泡');
                    // 清空当前内容累积，强制下一个 content chunk 创建新气泡
                    fullContent = "";
                    coachBubble = null;
                  } else {
                    removeThinkingBubble();
                    fullContent += data.content;
                    
                    if (!coachBubble) {
                      // 文字流到达时，创建一个全新的独立气泡
                      coachBubble = appendChatMessage('coach', fullContent, false);
                    } else {
                      updateCoachBubbleContent(coachBubble, fullContent);
                    }
                  }
                }

                // 2. 检查流是否应该结束 (根据 history_messages 或特定的结束标识)
                if (data.history_messages && Array.isArray(data.history_messages) && data.history_messages.length > 0) {
                   // 注意：这里不要直接 break，因为最后一个 chunk 可能还有 content
                   // 我们标记一下，在当前 chunk 处理完后退出
                   console.log('[Bot] 收到历史消息，准备结束流接收');
                }
              } catch (e) {}
            }
          }
        }
      } catch (err) {
        console.error('[Bot] 请求失败', err);
        removeThinkingBubble();
        setStatus('llmStatus', 'err', '对话助手响应失败');
      } finally {
        waitingResponse = false;
        updateSendButtonState();

        // 对话响应结束，自动触发处理指令队列
        processNextCommand();

        // 自动上报结果到 SDSF Server (模拟逻辑)
        if (DISPLAY_NAME) {
          // 逻辑更新：优先使用接口判定的 currentResponseIsRight，否则回退到拼图状态判定
          const isGameSuccess = currentResponseIsRight || document.getElementById('successBanner').classList.contains('visible');
          
          fetch('https://www.imates.com.cn/openclassSDSF/api/sdsf/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              studentName: DISPLAY_NAME,
              studentId: DISPLAY_NAME,
              isSuccess: isGameSuccess,
              timestamp: new Date().toISOString()
            })
          })
          .catch(err => console.error('[SDSF] 上报作答状态失败:', err));
        }
      }
    }

    //  Grid Initialization
    // ═══════════════════════════════════════════════════════
    function buildGrid() {
      const grid = document.getElementById('puzzleGrid');
      grid.innerHTML = '';
      for (let dr = 0; dr < ROWS; dr++) {
        for (let dc = 0; dc < COLS; dc++) {
          const gameRow = ROWS - dr;
          const gameCol = dc + 1;
          const div = document.createElement('div');
          div.className = 'cell';
          div.style.backgroundPosition =
            `${-(gameCol - 1) * CELL_W}px ${-(ROWS - gameRow) * CELL_H}px`;
          if (gameRow === TARGET.row && gameCol === TARGET.col) {
            div.classList.add('empty-target');
            div.id = 'targetCell';
          }
          if (gameRow === SWALLOW_START.row && gameCol === SWALLOW_START.col) {
            div.id = 'swallowStartCell';
          }
          grid.appendChild(div);
        }
      }
    }

    // ═══════════════════════════════════════════════════════
    //  Swallow Piece Rendering
    // ═══════════════════════════════════════════════════════
    function renderSwallow(animate = true) {
      const el = document.getElementById('swallowPiece');
      el.style.transition = animate
        ? `top ${Math.round(speed * 0.82)}ms cubic-bezier(0.4,0,0.2,1),`
          + ` left ${Math.round(speed * 0.82)}ms cubic-bezier(0.4,0,0.2,1)`
        : 'none';
      el.style.top  = `${(ROWS - pos.row) * CELL_H}px`;
      el.style.left = `${(pos.col - 1) * CELL_W}px`;
      el.style.backgroundPosition =
        `${-(SWALLOW_START.col - 1) * CELL_W}px ${-(ROWS - SWALLOW_START.row) * CELL_H}px`;
      syncSwallowStartCellFill();
    }

    function resetSwallowToStart() {
      stopPlay(false); // 停止当前所有播放
      pos = { ...SWALLOW_START };
      stepIdx = 0;
      clearTrail();
      
      const el = document.getElementById('swallowPiece');
      if (el) {
        // 1. 彻底禁用过渡动画
        el.style.transition = 'none';
        // 2. 立即更新坐标
        el.style.top  = `${(ROWS - pos.row) * CELL_H}px`;
        el.style.left = `${(pos.col - 1) * CELL_W}px`;
        // 3. 强制浏览器重绘 (reflow)，确保 transition: none 立即生效
        void el.offsetHeight;
      }
      
      syncSwallowStartCellFill();
      document.getElementById('targetCell')?.classList.add('empty-target');
      document.getElementById('swallowPiece').classList.remove('arrived');
      document.getElementById('successBanner').classList.remove('visible');
    }

    function syncSwallowStartCellFill() {
      const startCell = document.getElementById('swallowStartCell');
      if (!startCell) return;
      const isAtStart = pos.row === SWALLOW_START.row && pos.col === SWALLOW_START.col;
      startCell.classList.toggle('swallow-origin-empty', !isAtStart);
    }

    // ═══════════════════════════════════════════════════════
    //  SVG Trail
    // ═══════════════════════════════════════════════════════
    function cornerPixel(row, col, corner) {
      return {
        x: (col - 1) * CELL_W + CORNER_OFF[corner].dx,
        y: (ROWS - row) * CELL_H + CORNER_OFF[corner].dy,
      };
    }

    function selectedCorner() {
      return activeCorner ?? '';
    }

    function initLiveDot() {
      const svg = document.getElementById('trailSvg');

      const hist = svgEl('g');
      hist.id = 'trailHistory';
      svg.appendChild(hist);

      const glow = svgEl('circle');
      glow.id = 'trailGlow';
      glow.setAttribute('fill', '#f0c040');
      glow.style.display = 'none';
      const ga1 = svgEl('animate');
      ga1.setAttribute('attributeName', 'r');
      ga1.setAttribute('values', '9;15;9');
      ga1.setAttribute('dur', '1.1s');
      ga1.setAttribute('repeatCount', 'indefinite');
      const ga2 = svgEl('animate');
      ga2.setAttribute('attributeName', 'opacity');
      ga2.setAttribute('values', '0.38;0;0.38');
      ga2.setAttribute('dur', '1.1s');
      ga2.setAttribute('repeatCount', 'indefinite');
      glow.appendChild(ga1);
      glow.appendChild(ga2);
      svg.appendChild(glow);

      const dot = svgEl('circle');
      dot.id = 'trailLiveDot';
      dot.setAttribute('fill', '#f0c040');
      dot.setAttribute('stroke', '#fff');
      dot.setAttribute('stroke-width', '1.5');
      dot.style.display = 'none';
      const da = svgEl('animate');
      da.setAttribute('attributeName', 'r');
      da.setAttribute('values', '5;8;5');
      da.setAttribute('dur', '1.1s');
      da.setAttribute('repeatCount', 'indefinite');
      dot.appendChild(da);
      svg.appendChild(dot);
    }

    function updateLiveDot(animate) {
      const c = selectedCorner();
      const dot  = document.getElementById('trailLiveDot');
      const glow = document.getElementById('trailGlow');
      if (!dot || !glow) return;

      if (!c) {
        dot.style.display  = 'none';
        glow.style.display = 'none';
        return;
      }

      const dur   = animate ? Math.round(speed * 0.82) : 0;
      const ease  = 'cubic-bezier(0.4,0,0.2,1)';
      const trans = dur > 0 ? `cx ${dur}ms ${ease}, cy ${dur}ms ${ease}` : 'none';
      dot.style.transition  = trans;
      glow.style.transition = trans;
      dot.style.display  = '';
      glow.style.display = '';

      const { x, y } = cornerPixel(pos.row, pos.col, c);
      dot.style.cx  = `${x}px`;
      dot.style.cy  = `${y}px`;
      glow.style.cx = `${x}px`;
      glow.style.cy = `${y}px`;
    }

    function drawTrailHistory() {
      const hist = document.getElementById('trailHistory');
      if (!hist) return;
      hist.innerHTML = '';

      const c = selectedCorner();
      if (!c || trail.length === 0) return;

      const cur = cornerPixel(pos.row, pos.col, c);
      const pts = [...trail, cur];
      if (pts.length > 1) {
        const pl = svgEl('polyline');
        pl.setAttribute('points', pts.map(p => `${p.x},${p.y}`).join(' '));
        pl.setAttribute('fill', 'none');
        pl.setAttribute('stroke', '#f0c040');
        pl.setAttribute('stroke-width', '2');
        pl.setAttribute('stroke-dasharray', '5,4');
        pl.setAttribute('opacity', '0.62');
        hist.appendChild(pl);
      }

      trail.forEach(p => {
        const d = svgEl('circle');
        d.setAttribute('cx', p.x); d.setAttribute('cy', p.y);
        d.setAttribute('r', '3');
        d.setAttribute('fill', '#f0c040');
        d.setAttribute('opacity', '0.38');
        hist.appendChild(d);
      });
    }

    function clearTrail() {
      trail = [];
      const hist = document.getElementById('trailHistory');
      if (hist) hist.innerHTML = '';
      updateLiveDot(false);
    }

    function svgEl(tag) {
      return document.createElementNS('http://www.w3.org/2000/svg', tag);
    }

    // ═══════════════════════════════════════════════════════
    //  JSON Plan Parsing & Validation
    // ═══════════════════════════════════════════════════════
    function parsePlan(raw) {
      let data;
      try { data = JSON.parse(raw.trim()); }
      catch (e) { throw new Error('JSON 解析失败：' + e.message); }

      if (!Array.isArray(data.moves) || data.moves.length === 0)
        throw new Error('moves 必须为非空数组');

      const VALID_DIRS    = new Set(['上','下','左','右']);
      const VALID_CORNERS = new Set(['左上角','右上角','左下角','右下角']);
      const steps = [];
      const ends  = [];

      data.moves.forEach((m, i) => {
        if (!VALID_DIRS.has(m.dir))
          throw new Error(`moves[${i}].dir 非法值 "${m.dir}"`);
        const s = Number(m.steps);
        if (!Number.isInteger(s) || s <= 0)
          throw new Error(`moves[${i}].steps 必须为正整数`);
        for (let j = 0; j < s; j++) steps.push(m.dir);
        ends.push(steps.length);
      });

      const hl = (data.highlight && data.highlight !== 'null') ? data.highlight : null;
      if (hl && !VALID_CORNERS.has(hl))
        throw new Error(`highlight 非法值 "${hl}"`);

      return { steps, moveEnds: ends, highlight: hl };
    }

    function loadPlan(rawJson) {
      const raw = rawJson || '';
      if (!raw) { setStatus('llmStatus', 'err', '无有效方案'); return false; }
      let result;
      try { result = parsePlan(raw); }
      catch (e) { setStatus('llmStatus', 'err', e.message); return false; }

      resetSwallowToStart(); // 统一重置逻辑
      
      flatSteps    = result.steps;
      moveEnds     = result.moveEnds;
      activeCorner = result.highlight;
      
      const replayBtn = document.getElementById('btnReplay');
      if (replayBtn) replayBtn.disabled = false;
      return true;
    }

    // ═══════════════════════════════════════════════════════
    //  Step Execution
    // ═══════════════════════════════════════════════════════
    function doStep() {
      if (stepIdx >= flatSteps.length) return false;
      const dir = flatSteps[stepIdx];
      const { dr, dc } = DIR_DELTA[dir];
      const nr = pos.row + dr;
      const nc = pos.col + dc;

      if (nr < 1 || nr > ROWS || nc < 1 || nc > COLS) {
        setStatus('llmStatus', 'err', `越界！（向${dir}移动超出网格范围）`);
        stopPlay();
        return false;
      }

      const c = selectedCorner();
      if (c) trail.push(cornerPixel(pos.row, pos.col, c));

      pos = { row: nr, col: nc };
      renderSwallow(true);
      updateLiveDot(true);
      drawTrailHistory();
      stepIdx++;
      return true;
    }

    function checkSuccess() {
      if (pos.row === TARGET.row && pos.col === TARGET.col) {
        document.getElementById('targetCell')?.classList.remove('empty-target');
        document.getElementById('swallowPiece').classList.add('arrived');
        document.getElementById('successBanner').classList.add('visible');
        setStatus('llmStatus', 'ok', '成功抵达目标位置！');
        return true;
      }
      return false;
    }

    // ═══════════════════════════════════════════════════════
    //  Playback Controls
    // ═══════════════════════════════════════════════════════
    function togglePlay() {
      if (playing) { stopPlay(); return; }
      if (flatSteps.length === 0) return;
      if (stepIdx >= flatSteps.length) return;
      playing = true;
      if (stepIdx === 0 && selectedCorner()) {
        updateLiveDot(false);
        drawTrailHistory();
        playTimer = setTimeout(schedule, speed);
        return;
      }
      schedule();
    }

    function schedule() {
      if (!playing) return;
      if (stepIdx >= flatSteps.length) {
        if (checkSuccess()) {
          stopPlay();
          // 如果有正在执行的指令，发送成功回调
          if (currentExecutingCommand) {
            sendCallback(currentExecutingCommand.cmd_id, 'success', '拼图还原成功');
            currentExecutingCommand = null;
          }
          processNextCommand(); // 执行下一个任务
          return;
        }
        stopPlay();
        setStatus('llmStatus', 'ok', '全部步骤执行完毕！');
        // 发送执行完毕回调
        if (currentExecutingCommand) {
          sendCallback(currentExecutingCommand.cmd_id, 'success', '执行完毕');
          currentExecutingCommand = null;
        }
        processNextCommand(); // 执行下一个任务
        return;
      }
      if (doStep()) {
        playTimer = setTimeout(schedule, speed);
      }
    }

    function stopPlay(flushCoachMessages = true) {
      playing = false;
      clearTimeout(playTimer);
      // 冲刷播放期间缓存的教练消息
      if (flushCoachMessages) {
        while (pendingCoachMessages.length) {
          showCoachMessage(pendingCoachMessages.shift());
        }
      } else {
        pendingCoachMessages = [];
      }
      _enableSendBtn();
    }

    function replayPuzzle() {
      if (flatSteps.length === 0) return;
      resetSwallowToStart();
      setStatus('llmStatus', '', '');
      togglePlay();
    }

    function resetChatPanel() {
      const container = document.getElementById('chatMessages');
      if (!container) return;
      container.innerHTML = '<div class="chat-empty" id="chatEmpty">对话记录展示区</div>';
      container.scrollTop = 0;
      // 重置后显示初始欢迎语（不传模型）
      showCoachMessage("同学你好，我是果果。成功的标准是按照规则将小燕子方块移回原位。请先拍下你的作答方案，我们一起探讨吧！");
    }

    function restartPuzzleSession() {
      stopPlay(false);

      // 生成新的会话 ID 以开始全新对话
      THREAD_ID = generateThreadId();
      console.log(`[Session] 重置会话, 新 thread_id: ${THREAD_ID}`);

      // 清空前端播放状态与上下文展示
      pos = { ...SWALLOW_START };
      flatSteps = [];
      moveEnds = [];
      stepIdx = 0;
      activeCorner = null;
      clearTrail();
      renderSwallow(false);
      pendingCoachMessages = [];
      waitingResponse = false;

      document.getElementById('nlInput').value = '';
      document.getElementById('targetCell')?.classList.add('empty-target');
      document.getElementById('swallowPiece').classList.remove('arrived');
      document.getElementById('successBanner').classList.remove('visible');
      const replayBtn = document.getElementById('btnReplay');
      if (replayBtn) replayBtn.disabled = true;
      resetChatPanel();
      setStatus('llmStatus', 'info', '已重置，等待新的输入。');
      _enableSendBtn();

      // 重置引导锁定状态
      hasSentFirstImage = false;
      const overlay = document.getElementById('inputLockOverlay');
      if (overlay) overlay.classList.remove('hidden');

      // 重新启动会话 (重新建立 SSE 即可)
      initCanvasSSE();
    }

    // ═══════════════════════════════════════════════════════
    //  Utilities
    // ═══════════════════════════════════════════════════════
    function setStatus(id, cls, html) {
      const el = document.getElementById(id);
      if (!el) return;
      if (id === 'llmStatus') {
        const llmCls = cls || 'info';
        el.className = 'chatbot-header-label' + (llmCls ? ' ' + llmCls : '');
        el.innerHTML = html || '你有移动燕子到空缺方块的方案吗？';
      } else {
        el.className = 'status ' + cls;
        el.innerHTML = html;
      }
    }

    function syncResponsiveLayout() {
      const wrap = document.querySelector('.grid-wrap');
      const stage = document.getElementById('gridStage');
      if (!wrap || !stage) return;

      const style = window.getComputedStyle(wrap);
      const padX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
      const padY = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
      const availableWidth = Math.max(wrap.clientWidth - padX, CELL_W);
      const availableHeight = Math.max(wrap.clientHeight - padY, CELL_H);
      const scale = Math.min(availableWidth / (CELL_W * COLS), availableHeight / (CELL_H * ROWS));

      document.documentElement.style.setProperty('--board-scale', scale.toFixed(4));
    }

    // ═══════════════════════════════════════════════════════
    //  Bootstrap
    // ═══════════════════════════════════════════════════════
    // 初始化微课
    (function init() {
      buildGrid();
      initLiveDot();
      renderSwallow(false);
      const input = document.getElementById('nlInput');
      input?.addEventListener('input', updateSendButtonState);
      updateSendButtonState();
      syncResponsiveLayout();
      window.addEventListener('resize', syncResponsiveLayout);
      
      /**
       * 统一处理图片数据并发送
       */
      function handleNativeImageData(data) {
        console.log(`${getLogPrefix()} [UI] 处理图片数据:`, data);
        if (data && data.success && data.base64DataUrl) {
          const newImageData = {
            file: null,
            previewUrl: data.base64DataUrl
          };
          selectedImages = [newImageData];
          // 延迟一小会儿确保状态更新
          setTimeout(() => {
            sendUserInput();
          }, 100);
        }
      }

      // 1. 监听 Android 原生直接派发的事件 (当前窗口)
      window.addEventListener('nativeImageCaptureResult', function(e) {
        console.log(`${getLogPrefix()} [Event] window 捕获到 nativeImageCaptureResult:`, e.detail);
        handleNativeImageData(e.detail);
      });

      // 1.1 尝试直接监听顶层窗口 (解决 iframe 捕获不到原生事件的问题)
      // 只要是同源 URL，这段代码就能成功执行
      try {
        if (window.top && window.top !== window) {
          console.log(`${getLogPrefix()} [Event] 尝试在 window.top 挂载监听器`);
          window.top.addEventListener('nativeImageCaptureResult', function(e) {
            console.log(`${getLogPrefix()} [Event] window.top 捕获到事件，准备处理`);
            handleNativeImageData(e.detail);
          });
        }
      } catch (err) {
        console.warn(`${getLogPrefix()} [Event] 跨域限制或顶层访问失败:`, err);
      }

      // 2. 监听可能通过 postMessage 转发的事件
      window.addEventListener('message', function(e) {
        console.log(`${getLogPrefix()} [Message] window 收到 postMessage:`, e.data);
        if (e.data && e.data.type === 'nativeImageCaptureResult') {
          console.log(`${getLogPrefix()} [Message] 识别为拍照结果，准备处理`);
          handleNativeImageData(e.data.detail);
        }
      });
      
      // 初始显示欢迎语
      showCoachMessage("同学你好，我是果果。成功的标准是按照规则将小燕子方块移回原位。请先拍下你的作答方案，我们一起探讨吧！");

      // 自动登记学生信息到 SDSF 统计服务器
      if (DISPLAY_NAME) {
        fetch('https://www.imates.com.cn/openclassSDSF/api/sdsf/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            studentName: DISPLAY_NAME,
            studentId: DISPLAY_NAME,
            timestamp: new Date().toISOString()
          })
        }).catch(err => console.warn('[SDSF] 自动登记失败:', err));
      }

      // 初始化 SSE 连接
      initCanvasSSE();
    })();
  </script>
