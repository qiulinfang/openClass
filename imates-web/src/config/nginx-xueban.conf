location /ws {
    # 解决跨域
    add_header 'Access-Control-Allow-Origin' 'https://www.imates.com.cn' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, Upgrade' always;
    add_header 'Access-Control-Allow-Headers' 'Upgrade, Connection, Token, UserId' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # 预检请求直接返回204
    if ($request_method = OPTIONS) {
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    # 转发到宿主机8201的WS地址（替换为你的宿主机内网IP，比如172.168.0.99）
    proxy_pass http://172.168.0.99:8201/blw-edu-yb/ws;

    # WebSocket/WSS必备配置
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme; # 告诉后端是HTTPS/WSS

    # 长连接超时（避免WS断开）
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 75s;
}
