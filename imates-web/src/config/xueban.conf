# 教师WS测试
location /teacher-ws-test/ {
    # 跨域配置
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Upgrade, Connection, Content-Type' always;

    # 转发到后端 Nginx 的 WSS 地址（注意用 https，因为后端 Nginx 监听 443/ssl）
    proxy_pass https://43.138.16.5:50013/yb-teacher-ws/;

    # WebSocket 核心配置
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 长连接超时
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 75s;
    proxy_buffering off;
}

# 教师WS正式
location /teacher-ws-release/ {
    # 转发到后端 8201 端口
    proxy_pass http://127.0.0.1:8201/;

    # WebSocket 必须配置的请求头
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 通用代理头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 超时时间（防止WebSocket自动断开）
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
}

# 请求HTML源码
location /requests/ {
    proxy_pass http://172.27.102.104:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # 超时设置
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    
    # 缓存设置
    proxy_cache_valid 200 5m;
    proxy_cache_key $request_uri;
}