location /blw-edu-yb/api/question {
    include /etc/nginx/snippets/proxy-common-headers.conf;
    proxy_pass http://127.0.0.1:8201;
}

location /blw-edu-yb/api/system {
    include /etc/nginx/snippets/proxy-common-headers.conf;
    proxy_pass http://127.0.0.1:8201;
}

location /blw-edu-yb/ {
  if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin "https://www.imates.com.cn" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Content-Length 0;
    add_header Content-Type text/plain;
    return 204;
  }
 
  include /etc/nginx/snippets/proxy-common-headers.conf;
  proxy_pass https://www.imates.com.cn:9099/blw-edu-yb/;
  proxy_ssl_server_name on;
  proxy_ssl_verify off;
}


location /yb-teacher-test/ {
  include /etc/nginx/snippets/proxy-common-headers.conf;
  proxy_pass https://43.138.16.5:50013/yb-teacher/;
  proxy_ssl_server_name on;
  proxy_ssl_verify off;
}

location /yb-teacher-ws {
    # 跨域配置
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Upgrade, Connection, Content-Type' always;

    # 转发到后端 Nginx 的 WSS 地址（注意用 https，因为后端 Nginx 监听 443/ssl）
    proxy_pass https://43.138.16.5:50013/yb-teacher-ws;

    # WebSocket 核心配置
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 长连接超时
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 75s;
    proxy_buffering off;
}


