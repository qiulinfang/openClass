
user  root;
worker_processes  4;



# error_log  logs/error.log;
# error_log  logs/error.log  notice;
# error_log  logs/error.log  info;
error_log  /var/log/nginx/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    
    include       mime.types;
    default_type  application/octet-stream;
    
    types {
        text/javascript js;
        application/javascript js;
        text/css css;
    }
    
    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen       80;
        listen       443 ssl;
        server_name  localhost;

        client_max_body_size 100M; #上传文件大小

        ssl_certificate     cert/nginx-selfsigned.crt;  # 证书文件路径
        ssl_certificate_key cert/nginx-selfsigned.key;  # 私钥文件路径

        # SSL 配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        #charset koi8-r;

        #access_log  logs/host.access.log  main;

	   
		
        location /lt-api/re_ocr_region {
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://49.232.39.212:8011/re_ocr_region;
        }
		
        location /lt-api/parse_image {
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://49.232.39.212:8011/parse_image;
        }
		
        location /lt-api/parse_images {
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://49.232.39.212:8011/parse_images;
        }
		
        location /lt-api/process_exam_with_regions {
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://49.232.39.212:8011/process_exam_with_regions;
        }
		
        location /lt-api/preview_exam_with_regions {
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://49.232.39.212:8011/preview_exam_with_regions;
        }
		
        location /lt-api/process_single_with_regions {
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://49.232.39.212:8011/process_single_with_regions;
        }
		
        location /lt-api/process_single_exam {
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://49.232.39.212:8011/process_single_exam;
        }
		
        location /lt-api/process_exam {
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://49.232.39.212:8011/process_exam;
        }
		
        location /lt-img {
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass https://k12-picture.tos-cn-beijing.volces.com;
        }
		
        location /nacos {
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://nacos:8848/nacos;
        }
		
        location /gateway {
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://blw-edu-gateway:8000;
        }
		
        location /service-tk {
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://blw-edu-service-tk:8080/service-tk;
        }

        location /ybht {
            add_header Cache-Control no-store;
            add_header Pragma no-cache;
            alias /etc/nginx/html/ybht/;
            try_files $uri $uri/ /ybht/index.html;
            index index.html index.htm;
        }
		
        location /tk {
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://172.168.0.99:8223;
        }
		
        location /api {
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://yb-web:8080/blw-edu-yb;
        }
		
        location /blw-edu-yb {
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://yb-web:8080/blw-edu-yb;
        }
		
        location /kkfileview {
        	  add_header Access-Control-Allow-Origin *;
		  add_header Access-Control-Allow-Methods 'GET, OPTIONS';
		  add_header Access-Control-Allow-Headers 'Content-Type';
            add_header Cache-Control no-store;
            add_header Pragma no-cache;
            proxy_pass http://kkfileview:8012/kkfileview;
        }

        location /avatar {
        	  add_header Access-Control-Allow-Origin *;
		  add_header Access-Control-Allow-Methods 'GET, OPTIONS';
		  add_header Access-Control-Allow-Headers 'Content-Type';
            root /usr/files/upload;
        }

        location /img {
        	  add_header Access-Control-Allow-Origin *;
		  add_header Access-Control-Allow-Methods 'GET, OPTIONS';
		  add_header Access-Control-Allow-Headers 'Content-Type';
            root /usr/files/upload;
        }

        location /audio {
        	  add_header Access-Control-Allow-Origin *;
		  add_header Access-Control-Allow-Methods 'GET, OPTIONS';
		  add_header Access-Control-Allow-Headers 'Content-Type';
            root /usr/files/upload;
        }

        location /resource {
        	  add_header Access-Control-Allow-Origin *;
		  add_header Access-Control-Allow-Methods 'GET, OPTIONS';
		  add_header Access-Control-Allow-Headers 'Content-Type';
            root /usr/files/upload;
        }

        location /zip {
        	  add_header Access-Control-Allow-Origin *;
		  add_header Access-Control-Allow-Methods 'GET, OPTIONS';
		  add_header Access-Control-Allow-Headers 'Content-Type';
            root /usr/files/upload;
        }

        
        location /yb-teacher {
            proxy_pass http://172.168.0.99:8201/blw-edu-yb;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        	
        location /yb-teacher-ws {
            # 允许跨域（保持不变）
            add_header 'Access-Control-Allow-Origin' '*' always;
            # 转发到后端WS路径（不带/）
            proxy_pass http://172.168.0.99:8201/blw-edu-yb/ws;
            
            # WebSocket/WSS核心配置（保持不变）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;  # 关键：告诉后端是HTTPS/WSS请求
            proxy_set_header X-Original-URI $request_uri;
            
            # 长连接超时（保持不变）
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 75s;
        }

	
        location / {
            root   html/yb;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}
    
    }

    # HTTPS server
    #
    #server {
    #    listen       443 ssl;
    #    server_name  localhost;

    #    ssl_certificate      cert.pem;
    #    ssl_certificate_key  cert.key;

    #    ssl_session_cache    shared:SSL:1m;
    #    ssl_session_timeout  5m;

    #    ssl_ciphers  HIGH:!aNULL:!MD5;
    #    ssl_prefer_server_ciphers  on;

    #    location / {
    #        root   html;
    #        index  index.html index.htm;
    #    }
    #}

}
