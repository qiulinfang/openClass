<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>数据驱动版知识图谱</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a2e; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none; 
            cursor: grab;
            user-select: none;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body.grabbing {
            cursor: grabbing;
        }
        .ui-layer {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            pointer-events: none;
            color: #fff;
            opacity: 0.6;
            font-size: 14px;
            letter-spacing: 1px;
            z-index: 10;
        }
    </style>
</head>
<body>

<div class="ui-layer">
    滑动切换小节 · 知识点越多圆越大
</div>

<canvas id="spaceCanvas"></canvas>

<script>
    // --- 1. 数据源 (使用您提供的结构) ---
    const mockChapterDetails = {
        id: 'chapter-1',
        name: '一次函数',
        label: '第1章 一次函数',
        level: 0, // level 0 不渲染
        children: [
            {
                id: 'section-1-1',
                name: '函数的概念',
                label: '1.1 函数的概念',
                level: 1, // level 1 渲染为月球
                children: [
                    { id: 'kp-1-1-1', name: '自变量与因变量', label: '1.1.1 自变量与因变量', level: 2 },
                    { id: 'kp-1-1-2', name: '函数表示法', label: '1.1.2 函数表示法', level: 2 }
                ]
            },
            {
                id: 'section-1-2',
                name: '一次函数的图像',
                label: '1.2 一次函数的图像',
                level: 1, // level 1 渲染为月球
                children: [
                    { id: 'kp-1-2-1', name: '斜率的意义', label: '1.2.1 斜率的意义', level: 2 },
                    { id: 'kp-1-2-2', name: '截距的意义', label: '1.2.2 截距的意义', level: 2 },
                    // 为了演示动态大小，我手动添加几个假数据来模拟卫星较多的情况
                    // { id: 'kp-test-1', name: '测试点1', label: '测试点1', level: 2 },
                    // { id: 'kp-test-2', name: '测试点2', label: '测试点2', level: 2 },
                ]
            }
        ]
    };

    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');

    // --- 2. 布局配置 ---
    const config = {
        // 轨道参数
        orbitRadiusX: 400,    // 长半轴 (控制离右边的距离)
        orbitRadiusY: 250,    // 短半轴
        rotationSpeed: 0.08,

        // 尺寸参数
        moonRadiusBase: 30,       // 未放大半径
        moonRadiusFocusBase: 50,  // 放大基础半径
        
        satelliteDistBase: 90,    // 卫星基础距离
        satelliteRadius: 18,      // 卫星半径
        
        // 动态缩放参数
        zoomStepPerSat: 0.15,     // 每个卫星增加的缩放系数
        distStepPerSat: 6,        // 每个卫星增加的间距
    };

    const state = {
        globalAngle: 0,
        targetGlobalAngle: 0,
        isAutoRotating: false,
        focusedIndex: 0, 
        moons: [],
        
        isInteracting: false,
        startX: 0,
        startY: 0,
        lastX: 0,
        interactionMode: null
    };

    let width, height, cx, cy;

    // --- 3. 实体类 ---

    class Satellite {
        constructor(index, total, data) {
            this.data = data;
            // 卫星均匀分布
            this.angleOffset = (index / total) * Math.PI * 2 - Math.PI/2;
            this.x = 0;
            this.y = 0;
        }

        update(px, py, dist) {
            this.x = px + Math.cos(this.angleOffset) * dist;
            this.y = py + Math.sin(this.angleOffset) * dist;
        }

        draw(ctx, scale) {
            const r = config.satelliteRadius * (0.8 + scale * 0.15);
            
            // 绘制卫星占位符 (菱形)
            ctx.beginPath();
            ctx.moveTo(this.x, this.y - r);
            ctx.lineTo(this.x + r, this.y);
            ctx.lineTo(this.x, this.y + r);
            ctx.lineTo(this.x - r, this.y);
            ctx.closePath();
            ctx.fillStyle = '#a29bfe'; 
            ctx.fill();

            // 文字绘制
            if (scale > 1.0) {
                ctx.fillStyle = '#fff';
                ctx.font = `${12}px "Microsoft YaHei"`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                
                // 显示 label 里的后半部分名称，或者直接显示 label
                // 这里为了简洁，假设每行大概显示6-8个字
                const name = this.data.name; 
                ctx.fillText(name, this.x, this.y + r + 5);
            }
        }
    }

    class Moon {
        constructor(index, total, data) {
            this.index = index;
            this.data = data;
            this.angleOffset = (index / total) * Math.PI * 2;
            
            // --- 核心逻辑：根据卫星数量决定最大缩放比例 ---
            const satCount = data.children ? data.children.length : 0;
            // 基础 1.5 倍，每个卫星增加 zoomStepPerSat
            this.maxZoomFactor = 1.5 + (satCount * config.zoomStepPerSat);
            // 设置上限防止过大
            if (this.maxZoomFactor > 3.0) this.maxZoomFactor = 3.0; 

            // 计算卫星轨道半径
            this.satelliteOrbitDist = config.satelliteDistBase + (satCount * config.distStepPerSat);

            this.scale = 1;
            this.targetScale = 1;
            this.opacity = 1;
            this.x = 0;
            this.y = 0;

            // 初始化卫星 (Level 2 data)
            this.satellites = [];
            if (data.children) {
                data.children.forEach((child, i) => {
                    this.satellites.push(new Satellite(i, data.children.length, child));
                });
            }
        }

        update() {
            const diff = this.targetScale - this.scale;
            this.scale += Math.abs(diff) > 0.001 ? diff * 0.1 : 0;
            if (Math.abs(diff) <= 0.001) this.scale = this.targetScale;

            let targetOp = (this.index === state.focusedIndex) ? 1.0 : 0.5;
            this.opacity += (targetOp - this.opacity) * 0.1;

            // 轨道位置
            const currentAngle = state.globalAngle + this.angleOffset;
            this.x = cx + Math.cos(currentAngle) * config.orbitRadiusX;
            this.y = cy + Math.sin(currentAngle) * config.orbitRadiusY;

            // 更新卫星位置
            if (this.scale > 1.1) {
                const progress = (this.scale - 1) / (this.maxZoomFactor - 1); 
                const currentDist = this.satelliteOrbitDist * Math.max(0, progress);
                this.satellites.forEach(sat => sat.update(this.x, this.y, currentDist));
            }
        }

        draw(ctx) {
            ctx.globalAlpha = this.opacity;
            if (this.scale > 1.2) {
                this.drawFocused(ctx);
            } else {
                this.drawUnfocused(ctx);
            }
            ctx.globalAlpha = 1.0;
        }

        drawFocused(ctx) {
            // 根据 scale 动态计算当前显示的圆半径
            const r = config.moonRadiusFocusBase * (this.scale / 1.5); 

            // 1. 卫星轨道线
            const progress = (this.scale - 1) / (this.maxZoomFactor - 1);
            const currentSatDist = this.satelliteOrbitDist * Math.max(0, progress);
            if (currentSatDist > r) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, currentSatDist, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // 2. 月球本体 (SVG 占位)
            const grad = ctx.createLinearGradient(this.x, this.y - r, this.x, this.y + r);
            grad.addColorStop(0, '#a29bfe');
            grad.addColorStop(1, '#6c5ce7');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
            ctx.fill();

            // 3. 标题 (Level 1 label)
            ctx.fillStyle = '#fff';
            const titleSize = 16 * (this.scale / 1.5);
            ctx.font = `bold ${titleSize}px "Microsoft YaHei"`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // 处理换行，虽然 label 一般比较短，但以防万一
            // 简单处理：按空格换行，或者直接画
            // 这里直接显示 label
            ctx.fillText(this.data.label, this.x, this.y);
            
            // 副标题 name
            ctx.font = `${titleSize * 0.8}px "Microsoft YaHei"`;
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            // ctx.fillText(this.data.name, this.x, this.y + titleSize * 1.2); 
            // (如果 label 已经包含了 name 的信息，就不需要画这行了，根据您的数据来看 label = "1.1 函数的概念" 已经够了)

            // 4. 卫星
            this.satellites.forEach(sat => sat.draw(ctx, this.scale));
        }

        drawUnfocused(ctx) {
            const r = config.moonRadiusBase;

            ctx.fillStyle = 'rgba(108, 92, 231, 0.3)';
            ctx.strokeStyle = 'rgba(162, 155, 254, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 未聚焦时，只显示序号 (例如 "1.1")
            // 从 label 中提取序号
            const num = this.data.label.split(' ')[0]; 
            
            ctx.fillStyle = '#fff';
            ctx.font = `bold 14px "Microsoft YaHei"`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(num, this.x, this.y);
        }
    }

    // --- 4. 初始化 ---

    function init() {
        resize();
        state.moons = [];
        
        // --- 数据映射 ---
        // Level 0 (mockChapterDetails) 不渲染
        // 使用 mockChapterDetails.children (Level 1) 作为月球数组
        const sections = mockChapterDetails.children;
        
        if (sections && sections.length > 0) {
            sections.forEach((section, index) => {
                state.moons.push(new Moon(index, sections.length, section));
            });
            focusOnIndex(0, true);
        }

        loop();
    }

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);
        
        // --- 布局要求：圆心在右侧垂直中心 ---
        cx = width; 
        cy = height / 2;
    }

    // --- 5. 循环逻辑 ---

    function update() {
        if (state.isAutoRotating) {
            let diff = state.targetGlobalAngle - state.globalAngle;
            while (diff <= -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;

            if (Math.abs(diff) < 0.005) {
                state.globalAngle = state.targetGlobalAngle;
                state.isAutoRotating = false;
            } else {
                state.globalAngle += diff * config.rotationSpeed;
            }
        }
        state.moons.forEach(m => m.update());
    }

    function draw() {
        const dpr = window.devicePixelRatio || 1;
        ctx.clearRect(0, 0, width, height);

        // 绘制椭圆轨道
        ctx.beginPath();
        ctx.ellipse(cx, cy, config.orbitRadiusX, config.orbitRadiusY, 0, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        // 排序绘制
        const sortedMoons = [...state.moons].sort((a, b) => a.scale - b.scale);
        sortedMoons.forEach(m => m.draw(ctx));
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    // --- 6. 交互逻辑 ---

    function focusOnIndex(index, instant = false) {
        if (index < 0 || index >= state.moons.length) return;
        state.focusedIndex = index;
        const targetMoon = state.moons[index];

        // 设置目标缩放
        state.moons.forEach((m, i) => {
            m.targetScale = (i === index) ? m.maxZoomFactor : 1;
        });

        const currentMod = state.globalAngle % (Math.PI * 2);
        state.globalAngle = currentMod;
        // 目标位置：PI (屏幕左侧)
        state.targetGlobalAngle = Math.PI - targetMoon.angleOffset;

        if (instant) {
            state.globalAngle = state.targetGlobalAngle;
            state.moons.forEach(m => m.scale = m.targetScale);
        } else {
            state.isAutoRotating = true;
        }
    }

    function switchFocus(direction) {
        const len = state.moons.length;
        let newIndex;
        if (direction === 'next') {
            newIndex = (state.focusedIndex + 1) % len;
        } else {
            newIndex = (state.focusedIndex - 1 + len) % len;
        }
        focusOnIndex(newIndex);
    }

    function onStart(x, y) {
        state.isInteracting = true;
        state.startX = x;
        state.startY = y;
        state.lastX = x;
        state.interactionMode = null;
        document.body.classList.add('grabbing');
    }

    function onMove(x, y) {
        if (!state.isInteracting) return;
        const dx = x - state.startX;
        const dy = y - state.startY;

        if (!state.interactionMode) {
            if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                state.interactionMode = Math.abs(dx) > Math.abs(dy) ? 'ROTATE' : 'SWITCH';
            }
        }

        if (state.interactionMode === 'ROTATE') {
            const delta = x - state.lastX;
            state.globalAngle += delta * 0.005;
        } else if (state.interactionMode === 'SWITCH') {
            if (dy < -50) {
                switchFocus('next');
                state.isInteracting = false;
            } else if (dy > 50) {
                switchFocus('prev');
                state.isInteracting = false;
            }
        }
        state.lastX = x;
    }

    function onEnd() {
        state.isInteracting = false;
        document.body.classList.remove('grabbing');
    }

    window.addEventListener('mousedown', e => onStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', e => onEnd());
    window.addEventListener('touchstart', e => onStart(e.touches[0].clientX, e.touches[0].clientY), {passive: false});
    window.addEventListener('touchmove', e => { e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
    window.addEventListener('touchend', e => onEnd());

    window.addEventListener('resize', () => {
        resize();
        draw();
    });

    init();
</script>
</body>
</html>
