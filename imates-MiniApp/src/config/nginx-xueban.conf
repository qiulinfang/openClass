location /app {
    include /etc/nginx/snippets/proxy-common-headers.conf;
    # 关闭目录列表，避免暴露文件结构
    autoindex off;
    # 直接映射到 APK 文件的绝对路径（核心修正）
    alias /imates/websites/bj101/apps/app-production-release-1.0.78-78.apk;
    # 强制浏览器下载（而非尝试打开）
    add_header Content-Disposition "attachment; filename=app-1.0.78.apk";
    # 兜底：文件不存在时返回404，避免500错误
    try_files $uri =404;
}

